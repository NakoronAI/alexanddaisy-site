<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex &amp; Daisy — Welcome to the House</title>
<meta name="description" content="Welcome to the Alex & Daisy storybook house. Knock on a window to visit a friend.">

<style>
/* ============================================================
   ALEX & DAISY — STORYBOOK HOUSE HOMEPAGE
   ------------------------------------------------------------
   STYLE NOTES
   - The artwork (house.jpg) is the hero.
   - The page around it is a quiet evening: soft dusk paper,
     a faint vignette, nothing that competes with the house.
   - Hotspots are invisible until hovered/focused, then they
     "wake up" with a warm inner lamp-light glow.
   ============================================================ */

:root{
  /* --- Page palette (quiet dusk paper) --- */
  --page-top:    #d8e0be;   /* soft leaf light */
  --page-bottom: #71845c;   /* quiet moss */
  --paper:       #f3e9d7;   /* warm paper for text panels */
  --ink:         #3b3128;   /* warm ink for text */
  --ink-soft:    #6e5f50;
  --lamp:        #ffd98a;   /* warm window light */
  --lamp-deep:   #ffb95e;   /* deeper amber for click */

  /* --- Glow strength (see also GLOW settings in the JS) --- */
  --glow-hover-opacity: 0.55;
  --glow-click-opacity: 0.9;
}

*{ box-sizing: border-box; }

html, body{
  margin: 0;
  padding: 0;
}

body{
  min-height: 100vh;
  background: #4a563a;          /* deep moss fallback while the image loads */
  color: var(--paper);
  font-family: Georgia, "Times New Roman", "Hiragino Mincho ProN", "Yu Mincho", serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 0 48px;
}

/* ============================================================
   THE WORLD BACKDROP (cinematic, CSS-only)
   ------------------------------------------------------------
   A softly enlarged, blurred, slightly darkened echo of the
   SAME house artwork fills the whole landscape screen, so the
   portrait picture sits inside its own world instead of plain
   side bars. It is fixed in place, so the foreground house
   scrolls over it with a natural storybook depth (parallax).
   The image file is set automatically from IMAGE_FILE in the
   EDIT HERE box — you never need to edit it here.
   ============================================================ */
.world-backdrop{
  position: fixed;
  inset: -48px;                     /* oversized so blur has no hard edges */
  z-index: -2;
  background-size: cover;           /* image is set by the script */
  background-position: center 22%;  /* keep the sunny treetops in view */
  filter: blur(18px) brightness(0.82) saturate(0.92);
  transform: scale(1.08);
  pointer-events: none;
}

/* quiet light over the backdrop: a sunlit clearing, leaf-shadow
   dapple at the edges, and a gentle vignette so the eye settles
   on the house. No purple, no neon — only forest light. */
.world-veil{
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    /* soft sun from above the sign */
    radial-gradient(90% 55% at 50% 0%, rgba(255,248,220,0.18), rgba(0,0,0,0) 60%),
    /* large, soft leaf shadows drifting in from the corners */
    radial-gradient(40% 34% at 6% 12%,  rgba(26,36,18,0.34), rgba(0,0,0,0) 70%),
    radial-gradient(42% 36% at 96% 8%,  rgba(26,36,18,0.30), rgba(0,0,0,0) 70%),
    radial-gradient(36% 30% at 88% 78%, rgba(26,36,18,0.26), rgba(0,0,0,0) 70%),
    /* natural vignette toward the edges */
    radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 52%, rgba(22,30,16,0.42) 100%),
    /* grounding shade at the very bottom */
    linear-gradient(180deg, rgba(0,0,0,0) 78%, rgba(20,28,14,0.35) 100%);
}

/* ---------- The stage that holds the artwork ---------- */
/* The window onto the scene: full page width, and it crops away
   whatever part of the (deliberately oversized) artwork doesn't
   fit — like looking at a wide theater stage through the screen. */
.stage-window{
  width: 100%;
  overflow: hidden;
  display: flex;
  justify-content: center;   /* keep the house centered in the crop */
}

.house-stage{
  position: relative;
  flex: none;                /* never shrink: overflow IS the design */
  /* CINEMATIC CROP SIZING:
     The artwork is rendered LARGER than the screen and centered,
     so the forest edges crop away and the house itself stands
     big, with the first view cutting cleanly at the lower row of
     name plaques (Mr. T / Videos / Nico). Scrolling reveals the
     porch, Alex & Daisy, and the garden signs.

       - 285vh: THE CUT DIAL (the main number to tune).
                285 = the first view ends right at the lower
                name plaques. 260 = smaller house, cut moves
                down past the lower windows. 320 = bigger house,
                cut moves up to the Welcome oval.
       - 170vw: phone guard — on narrow screens the crop never
                goes past 1.7x the screen width, so the house
                always fits nicely on mobile.
       - 100vw: never smaller than the full screen width. */
  width: max(100vw, min(285vh, 170vw));
}

/* The artwork itself. Never cropped, aspect ratio preserved. */
.house-stage img.house-art{
  display: block;
  width: 100%;
  height: auto;
}

/* ============================================================
   HOTSPOTS
   - Created by JavaScript from the HOTSPOTS list (see EDIT HERE).
   - Positioned with percentage top/left/width/height so they
     scale perfectly with the image at any screen size.
   ============================================================ */
.hotspot{
  position: absolute;
  display: block;
  border: none;
  background: transparent;
  padding: 0;
  margin: 0;
  cursor: pointer;
  border-radius: 14px;
  /* keep the artwork visible: the glow lives in ::before */
}

/* warm inner lamp-light, invisible until hover/focus */
.hotspot::before{
  content:"";
  position: absolute;
  inset: -6%;
  border-radius: inherit;
  background: radial-gradient(ellipse at 50% 55%,
              rgba(255,217,138,0.95) 0%,
              rgba(255,185,94,0.45) 45%,
              rgba(255,185,94,0.0) 75%);
  mix-blend-mode: screen;       /* light "adds" onto the painting */
  opacity: 0;
  transition: opacity 0.45s ease;
  pointer-events: none;
}

.hotspot:hover::before,
.hotspot:focus-visible::before{
  opacity: var(--glow-hover-opacity);
}

/* doors get a slightly fuller, but still gentle, light */
.hotspot.is-door:hover::before,
.hotspot.is-door:focus-visible::before{
  opacity: calc(var(--glow-hover-opacity) + 0.15);
}

/* click: the light swells for a moment */
.hotspot.is-lit::before{
  opacity: var(--glow-click-opacity) !important;
  transition: opacity 0.18s ease;
}

/* elegant keyboard focus: a thin candle-gold line */
.hotspot:focus{ outline: none; }
.hotspot:focus-visible{
  outline: 2px solid rgba(255,221,160,0.85);
  outline-offset: 3px;
}

/* small floating name tag that appears on hover/focus */
.hotspot .hotspot-label{
  position: absolute;
  left: 50%;
  bottom: calc(100% + 6px);
  transform: translateX(-50%) translateY(4px);
  white-space: nowrap;
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  color: var(--ink);
  background: linear-gradient(180deg, #f8efdd, #eddfc4);
  border: 1px solid rgba(120,95,60,0.35);
  border-radius: 999px;
  padding: 4px 12px;
  opacity: 0;
  transition: opacity 0.35s ease, transform 0.35s ease;
  pointer-events: none;
  box-shadow: 0 2px 8px rgba(30,20,10,0.3);
}
.hotspot:hover .hotspot-label,
.hotspot:focus-visible .hotspot-label{
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ---------- tiny golden dust motes (created on click) ---------- */
.dust-mote{
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: radial-gradient(circle, #ffe9b8 0%, rgba(255,200,110,0.85) 50%, rgba(255,200,110,0) 100%);
  pointer-events: none;
  opacity: 0;
  animation: mote-rise 1.1s ease-out forwards;
}
@keyframes mote-rise{
  0%   { opacity: 0;   transform: translateY(0)    scale(0.6); }
  20%  { opacity: 0.9; }
  100% { opacity: 0;   transform: translateY(-34px) scale(1.1); }
}

/* ---------- fairy dust (created by the script) ----------------------
   Golden-amber magic motes over the scene. Each mote is TWO parts:
     .fairy-dust  = the invisible carrier that drifts upward in a
                    gentle S-shaped sway (zig, zag, zig)
     .fairy-core  = the glowing light itself, which twinkles:
                    swelling, shrinking, breathing its halo
   Round motes mix with little four-point star sparkles.
   All colors/sizes/timings are randomized per mote by the script. */
.fairy-dust{
  position: absolute;
  pointer-events: none;
  opacity: 0;
  animation: fairy-rise var(--dur) ease-in-out var(--delay) infinite;
}
.fairy-core{
  display: block;
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  background: radial-gradient(circle,
              rgba(255,252,235,1)   0%,
              rgba(var(--c1), 0.95) 35%,
              rgba(var(--c2), 0)    75%);
  box-shadow:
    0 0 calc(var(--size) * 0.7) calc(var(--size) * 0.18) rgba(var(--c1), 0.65),
    0 0 calc(var(--size) * 1.6) calc(var(--size) * 0.45) rgba(var(--c2), 0.30);
  animation: fairy-twinkle var(--tw) ease-in-out var(--delay) infinite;
}
/* some motes are tiny four-point stars instead of round glows */
.fairy-dust.is-star .fairy-core{
  border-radius: 0;
  clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%,
                     50% 100%, 39% 61%, 0% 50%, 39% 39%);
  background: radial-gradient(circle,
              rgba(255,253,240,1)   0%,
              rgba(var(--c1), 1)    45%,
              rgba(var(--c2), 0.2)  100%);
}

/* the upward S-curve journey: rise, sway right, sway left, fade */
@keyframes fairy-rise{
  0%   { opacity: 0;
         transform: translate3d(0, 0, 0); }
  10%  { opacity: var(--peak); }
  25%  { transform: translate3d(var(--sway), calc(var(--rise) * 0.25), 0); }
  50%  { transform: translate3d(calc(var(--sway) * -0.8), calc(var(--rise) * 0.5), 0);
         opacity: calc(var(--peak) * 0.85); }
  75%  { transform: translate3d(var(--sway), calc(var(--rise) * 0.75), 0); }
  90%  { opacity: calc(var(--peak) * 0.9); }
  100% { opacity: 0;
         transform: translate3d(0, var(--rise), 0); }
}

/* the heartbeat of the light: swell, brighten, breathe */
@keyframes fairy-twinkle{
  0%, 100% { transform: scale(0.65) rotate(0deg);  filter: brightness(0.9); }
  50%      { transform: scale(1.35) rotate(22deg); filter: brightness(1.9); }
}

/* ============================================================
   THE YOUTUBE BUTTON — a real CSS button floating in the scene.
   Position & size come from YT_BUTTON in the EDIT HERE box.
   It bobs gently like something hanging in the breeze, and
   bounces + glows when you point at it.
   ============================================================ */
.yt-button{
  position: absolute;            /* placed by the script from YT_BUTTON */
  width: var(--yt-size, 90px);
  height: calc(var(--yt-size, 90px) * 0.7);
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: calc(var(--yt-size, 90px) * 0.24);
  background: linear-gradient(180deg, #ff5347 0%, #e3170a 55%, #c20d04 100%);
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,0.45),   /* candy highlight   */
    inset 0 -4px 6px rgba(90,0,0,0.35),       /* underside shading */
    0 6px 16px rgba(80,15,8,0.45),            /* drop shadow       */
    0 2px 4px rgba(60,10,5,0.4);
  cursor: pointer;
  animation: yt-bob 3.6s ease-in-out infinite alternate;
  transition: box-shadow 0.3s ease;
}
/* the white play triangle */
.yt-button::after{
  content:"";
  width: 0;
  height: 0;
  margin-left: calc(var(--yt-size, 90px) * 0.05);
  border-top:    calc(var(--yt-size, 90px) * 0.14) solid transparent;
  border-bottom: calc(var(--yt-size, 90px) * 0.14) solid transparent;
  border-left:   calc(var(--yt-size, 90px) * 0.24) solid #fffdf6;
  filter: drop-shadow(0 1px 1px rgba(90,0,0,0.4));
}
/* gentle bobbing, like a sign swaying on a breeze */
@keyframes yt-bob{
  from { transform: translate(-50%, -54%) rotate(-2deg); }
  to   { transform: translate(-50%, -46%) rotate( 2deg); }
}
/* point at it: a happy bounce and a warm halo */
.yt-button:hover,
.yt-button:focus-visible{
  animation: yt-bounce 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,0.5),
    inset 0 -4px 6px rgba(90,0,0,0.3),
    0 8px 22px rgba(80,15,8,0.5),
    0 0 0 6px rgba(255,224,150,0.35),         /* golden ring  */
    0 0 28px 8px rgba(255,205,120,0.55);      /* warm halo    */
}
@keyframes yt-bounce{
  0%   { transform: translate(-50%, -50%) scale(1); }
  45%  { transform: translate(-50%, -50%) scale(1.18) rotate(-2deg); }
  70%  { transform: translate(-50%, -50%) scale(1.08) rotate(1.5deg); }
  100% { transform: translate(-50%, -50%) scale(1.12) rotate(0deg); }
}
.yt-button:focus{ outline: none; }
.yt-button:focus-visible{
  outline: 2px solid rgba(255,221,160,0.9);
  outline-offset: 4px;
}

/* ---------- debugging aid: outlines for placing hotspots ----------
   Turned on/off with SHOW_HOTSPOT_OUTLINES in the JS EDIT HERE box. */
.show-outlines .hotspot{
  outline: 1px dashed rgba(255,120,120,0.9);
  background: rgba(255,120,120,0.12);
}

/* ============================================================
   "VISIT ROOMS" fallback menu — quiet and secondary.
   Small worn paper tags resting in the shade below the house.
   ============================================================ */
.visit-rooms{
  width: min(100%, 760px);
  margin-top: 30px;
  padding: 0 14px;
  text-align: center;
  opacity: 0.85;                       /* sits back until needed */
  transition: opacity 0.4s ease;
}
.visit-rooms:hover,
.visit-rooms:focus-within{
  opacity: 1;
}
.visit-rooms h2{
  font-size: 0.72rem;
  font-weight: normal;
  letter-spacing: 0.3em;
  color: rgba(243,233,215,0.62);
  text-shadow: 0 1px 3px rgba(20,28,14,0.6);
  margin: 0 0 12px;
}
.visit-rooms h2::before,
.visit-rooms h2::after{
  content:"·";
  margin: 0 10px;
  color: rgba(255,225,170,0.5);
}
.room-list{
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 9px;
  justify-content: center;
}
.room-list a{
  display: inline-block;
  text-decoration: none;
  color: var(--ink);
  background: linear-gradient(180deg, rgba(244,234,215,0.92) 0%, rgba(229,213,182,0.92) 100%);
  border: 1px solid rgba(110,88,56,0.35);
  border-bottom-width: 2px;
  border-radius: 7px;
  padding: 6px 13px;
  font-size: 0.78rem;
  letter-spacing: 0.07em;
  box-shadow: 0 2px 6px rgba(15,22,10,0.4);
  transition: box-shadow 0.3s ease, transform 0.3s ease, background 0.3s ease;
}
.room-list a:hover,
.room-list a:focus-visible{
  background: linear-gradient(180deg, #fff4dd 0%, #f1e0bf 100%);
  box-shadow: 0 3px 10px rgba(255,190,110,0.35);
  transform: translateY(-1px);
}
.room-list a:focus{ outline: none; }
.room-list a:focus-visible{
  outline: 2px solid rgba(255,221,160,0.9);
  outline-offset: 2px;
}

/* ---------- footer whisper ---------- */
.page-footer{
  margin-top: 34px;
  font-size: 0.72rem;
  letter-spacing: 0.16em;
  color: rgba(243,233,215,0.4);
  text-shadow: 0 1px 3px rgba(20,28,14,0.6);
  font-style: italic;
  text-align: center;
}

/* ============================================================
   REDUCED MOTION
   - No dust motes, no label slide; glow becomes a simple fade.
   ============================================================ */
@media (prefers-reduced-motion: reduce){
  .dust-mote{ display: none !important; }
  .fairy-dust{ display: none !important; }
  .yt-button{ animation: none; }
  .hotspot::before,
  .hotspot .hotspot-label,
  .room-list a{
    transition: opacity 0.2s linear;
    transform: none !important;
  }
}

/* ---------- small screens ---------- */
@media (max-width: 600px){
  body{ padding: 0 0 40px; }
  .hotspot .hotspot-label{ font-size: 0.65rem; padding: 3px 9px; }
  /* on phones the house fills the screen, so the backdrop barely
     shows — use a cheaper blur to keep scrolling silky */
  .world-backdrop{ filter: blur(10px) brightness(0.82); }
}
</style>
</head>
<body>

<!-- ============================================================
     THE WORLD BACKDROP — a blurred, darkened echo of the SAME
     artwork fills the landscape screen behind the house, plus a
     veil of forest light and vignette. Both are decorative only.
     The picture used here follows IMAGE_FILE automatically.
     ============================================================ -->
<div class="world-backdrop" id="worldBackdrop" aria-hidden="true"></div>
<div class="world-veil" aria-hidden="true"></div>

<!-- ============================================================
     THE STAGE — the artwork itself is the homepage.
     No extra title above it; the painted sign is the title.
     To change the picture, see IMAGE_FILE in the EDIT HERE box.
     ============================================================ -->
<div class="stage-window">
<main class="house-stage" id="houseStage" aria-label="The Alex and Daisy storybook house. Interactive windows and doors.">
  <img class="house-art" id="houseArt"
       src="house.png"
       alt="A handmade storybook house in a sunlit forest garden. Each window belongs to a friend: Alex, Daisy, Giga, Mr. T, and Nico. The door leads to the videos, with signs for downloads and contact among the flowers.">
  <!-- hotspots are inserted here by the script below -->
</main>
</div><!-- /stage-window -->

<!-- ============================================================
     VISIT ROOMS — friendly fallback menu (great on phones)
     Links are filled in automatically from the same EDIT HERE list,
     so you only ever edit links in ONE place.
     ============================================================ -->
<nav class="visit-rooms" aria-label="Visit rooms">
  <h2>VISIT&nbsp;ROOMS</h2>
  <ul class="room-list" id="roomList"></ul>
</nav>

<footer class="page-footer">
  a little house, handmade with love
</footer>


<script>
/* ╔══════════════════════════════════════════════════════════════╗
   ║                                                              ║
   ║   ★★★  EDIT HERE  ★★★                                        ║
   ║                                                              ║
   ║   Everything you normally need to change lives in this box: ║
   ║   the image file, every link, every label, every position,  ║
   ║   and the glow strength. You should not need to touch       ║
   ║   anything below the "ENGINE" line.                         ║
   ║                                                              ║
   ╚══════════════════════════════════════════════════════════════╝ */

/* 1) THE PICTURE -------------------------------------------------
      Put your image in the same folder as this file and write its
      filename here. */
const IMAGE_FILE = "house.png";


/* 2) HOTSPOT POSITIONING HELP ------------------------------------
      Set this to true to see red dashed boxes over the image while
      you adjust positions. Set back to false when you're done. */
const SHOW_HOTSPOT_OUTLINES = false;


/* 3) GLOW STRENGTH -----------------------------------------------
      0 = invisible, 1 = strongest. Gentle values look best. */
const GLOW = {
  hover: 0.55,   // warm light when pointing at a window
  click: 0.90    // brighter swell at the moment of a click
};


/* 3a) THE YOUTUBE BUTTON ------------------------------------------
      A real CSS-made button floating over the scene (the painted
      logo was removed from the artwork). Position and size are
      yours to play with:
        top / left = where it floats, in % of the picture
        size       = width in px (height follows automatically)  */
const YT_BUTTON = {
  href:  "#youtube",
  label: "YouTube",
  aria:  "Visit the Alex and Daisy YouTube channel",
  top:   "4.5%",    /* upper-right sky, clear of the sign letters */
  left:  "77%",
  size:  68
};


/* 3b) FAIRY DUST ---------------------------------------------------
      Golden-amber magic motes that twinkle, breathe, and sway
      upward over the scene. Set enabled to false to turn off. */
const SPARKLES = {
  enabled: true,
  count: 22        // how many motes (14 = calm, 30 = festival)
};


/* 4) THE HOTSPOTS ------------------------------------------------
      One entry per clickable spot on the picture.

      top / left / width / height are PERCENTAGES of the image,
      so they stay in place on every screen size.
        - top:  distance from the TOP edge of the picture
        - left: distance from the LEFT edge of the picture

      HOW TO ADJUST A POSITION:
        a) set SHOW_HOTSPOT_OUTLINES = true (above)
        b) open the page and look at the red boxes
        c) nudge the numbers until each box sits on its window
        d) set SHOW_HOTSPOT_OUTLINES = false again

      "type" changes the feel slightly:
        "window"  – normal gentle glow
        "door"    – a touch stronger glow
        "sign"    – normal glow
        "motes"   – how many dust motes appear on click (optional,
                    defaults to 6)

      NOTE: these positions were measured against the real
      artwork (the portrait house picture). If anything is a
      little off, nudge the numbers with the red outlines on. */
const HOTSPOTS = [
  {
    name: "Alex window",
    label: "Alex",
    aria: "Visit Alex's room",
    href: "#alex",
    type: "window",
    top: 37.5, left: 36.2, width: 6.4, height: 15.5
  },
  {
    name: "Daisy window",
    label: "Daisy",
    aria: "Visit Daisy's room",
    href: "#daisy",
    type: "window",
    top: 34.5, left: 47.4, width: 6,   height: 17
  },
  {
    name: "Giga window",
    label: "Giga",
    aria: "Visit Giga's room",
    href: "#giga",
    type: "window",
    top: 37.5, left: 57.7, width: 6.2, height: 15.5
  },
  {
    name: "Mr. T window",
    label: "Mr. T",
    aria: "Visit Mr. T's room",
    href: "#mr-t",
    type: "window",
    top: 60.5, left: 35.6, width: 7,   height: 17
  },
  {
    name: "Nico window",
    label: "Nico",
    aria: "Visit Nico's room",
    href: "#nico",
    type: "window",
    top: 60.5, left: 57.5, width: 7,   height: 17
  },
  {
    name: "Videos door",
    label: "Videos",
    aria: "Open the door to the videos",
    href: "#videos",
    type: "door",
    motes: 9,
    top: 60.5, left: 46.4, width: 8.2, height: 36
  },
  {
    name: "Downloads sign",
    label: "Posters & Wallpapers",
    aria: "Download posters and wallpapers",
    href: "#downloads",
    type: "sign",
    top: 77.5, left: 24,   width: 7.8, height: 15.5
  },
  {
    name: "Contact postbox",
    label: "Write to us",
    aria: "Send us an email",
    href: "mailto:hello@example.com",
    type: "sign",
    top: 80,   left: 66.2, width: 7.4, height: 16.5
  },
  {
    name: "Alex & Daisy top sign",
    label: "",                /* "" = no floating tag; the painted sign speaks for itself */
    aria: "Alex and Daisy home sign",
    href: "#top",
    type: "sign",
    top: 2.5,  left: 32,   width: 36.5, height: 16.5
  }
];

/* ╔══════════════════════════════════════════════════════════════╗
   ║   END OF "EDIT HERE".                                        ║
   ║   Below is the ENGINE — it just builds the page from the     ║
   ║   list above. You normally never need to change it.          ║
   ╚══════════════════════════════════════════════════════════════╝ */


/* ----------------------- THE ENGINE ----------------------------- */
(function () {
  "use strict";

  const stage    = document.getElementById("houseStage");
  const art      = document.getElementById("houseArt");
  const roomList = document.getElementById("roomList");

  const reducedMotion =
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* apply the simple settings from EDIT HERE */
  art.src = IMAGE_FILE;
  /* the blurred world behind the house uses the SAME image */
  document.getElementById("worldBackdrop").style.backgroundImage =
    'url("' + IMAGE_FILE + '")';
  document.documentElement.style.setProperty("--glow-hover-opacity", GLOW.hover);
  document.documentElement.style.setProperty("--glow-click-opacity", GLOW.click);
  if (SHOW_HOTSPOT_OUTLINES) stage.classList.add("show-outlines");

  /* --- build one hotspot link on the picture --- */
  function buildHotspot(spot) {
    const a = document.createElement("a");
    a.className = "hotspot" + (spot.type === "door" ? " is-door" : "");
    a.href = spot.href;
    a.setAttribute("aria-label", spot.aria || spot.label || spot.name);

    /* percentage positioning — scales with the image */
    a.style.top    = spot.top    + "%";
    a.style.left   = spot.left   + "%";
    a.style.width  = spot.width  + "%";
    a.style.height = spot.height + "%";

    /* the floating name tag (a hotspot with label: "" gets none) */
    if (spot.label !== "") {
      const tag = document.createElement("span");
      tag.className = "hotspot-label";
      tag.textContent = spot.label || spot.name;
      a.appendChild(tag);
    }

    /* click: glow swell + a few dust motes + 0.4s pause, then go */
    a.addEventListener("click", function (event) {
      event.preventDefault();
      a.classList.add("is-lit");
      if (!reducedMotion) {
        releaseDustMotes(a, spot.motes || 6);
      }
      window.setTimeout(function () {
        a.classList.remove("is-lit");
        window.location.href = spot.href;
      }, 400);
    });

    return a;
  }

  /* --- a few tiny golden dust motes drifting up from the spot --- */
  function releaseDustMotes(hotspotEl, count) {
    for (let i = 0; i < count; i++) {
      const mote = document.createElement("span");
      mote.className = "dust-mote";
      /* scatter inside the hotspot */
      mote.style.left = (15 + Math.random() * 70) + "%";
      mote.style.top  = (35 + Math.random() * 50) + "%";
      mote.style.animationDelay = (Math.random() * 0.25) + "s";
      hotspotEl.appendChild(mote);
      /* clean up after the little drift finishes */
      window.setTimeout(function () { mote.remove(); }, 1600);
    }
  }

  /* --- build one entry in the "Visit Rooms" fallback menu --- */
  function buildRoomLink(spot) {
    const li = document.createElement("li");
    const a  = document.createElement("a");
    a.href = spot.href;
    a.textContent = spot.label || spot.name;
    a.setAttribute("aria-label", spot.aria || spot.label || spot.name);
    li.appendChild(a);
    return li;
  }

  /* --- the floating YouTube button (from YT_BUTTON in EDIT HERE) --- */
  function buildYtButton() {
    const yt = document.createElement("a");
    yt.className = "yt-button";
    yt.href = YT_BUTTON.href;
    yt.setAttribute("aria-label", YT_BUTTON.aria || YT_BUTTON.label);
    yt.style.top  = YT_BUTTON.top;
    yt.style.left = YT_BUTTON.left;
    yt.style.setProperty("--yt-size", YT_BUTTON.size + "px");
    stage.appendChild(yt);

    /* it also gets a place in the quiet Visit Rooms menu */
    roomList.appendChild(buildRoomLink({
      label: YT_BUTTON.label,
      aria:  YT_BUTTON.aria,
      href:  YT_BUTTON.href
    }));
  }
  buildYtButton();

  /* --- fairy dust drifting over the scene --- */
  function buildFairyDust() {
    if (!SPARKLES.enabled || reducedMotion) return;
    /* warm storybook palette: [inner glow, outer halo] as "r,g,b" */
    const tones = [
      ["255,216,110", "255,170,60"],   /* gold      */
      ["255,196,86",  "230,140,40"],   /* amber     */
      ["255,232,170", "255,196,120"],  /* candle    */
      ["255,184,128", "240,140,80"]    /* peach ember */
    ];
    for (let i = 0; i < SPARKLES.count; i++) {
      const dust = document.createElement("span");
      dust.className = "fairy-dust" + (Math.random() < 0.35 ? " is-star" : "");
      const tone = tones[Math.floor(Math.random() * tones.length)];

      dust.style.left = (4 + Math.random() * 92) + "%";
      dust.style.top  = (24 + Math.random() * 68) + "%";
      dust.style.setProperty("--c1",   tone[0]);
      dust.style.setProperty("--c2",   tone[1]);
      dust.style.setProperty("--size", (6 + Math.random() * 8).toFixed(0) + "px");
      dust.style.setProperty("--rise", (-(70 + Math.random() * 130)).toFixed(0) + "px");
      dust.style.setProperty("--sway", (18 + Math.random() * 30).toFixed(0) + "px");
      dust.style.setProperty("--dur",  (7 + Math.random() * 7).toFixed(1) + "s");
      dust.style.setProperty("--tw",   (1.3 + Math.random() * 1.7).toFixed(1) + "s");
      dust.style.setProperty("--delay",(Math.random() * 8).toFixed(1) + "s");
      dust.style.setProperty("--peak", (0.8 + Math.random() * 0.2).toFixed(2));

      const core = document.createElement("i");
      core.className = "fairy-core";
      dust.appendChild(core);
      stage.appendChild(dust);
    }
  }
  buildFairyDust();

  /* --- build everything from the HOTSPOTS list --- */
  HOTSPOTS.forEach(function (spot) {
    stage.appendChild(buildHotspot(spot));
    /* label: "" means "art only" — no entry in the quiet menu */
    if (spot.label !== "") {
      roomList.appendChild(buildRoomLink(spot));
    }
  });
})();
</script>

</body>
</html>
