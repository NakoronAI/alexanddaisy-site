/* ===== 木漏れ日の瞬き（木々だけ・家には置かない） =====
   丸い発光体を常設せず、普段は完全に消える。
   葉のすき間で一瞬だけ反射する、小さな光点として表示する。
   移動・回転・blend・blurは使わず、古いAndroid端末にも配慮。 */
.canopy-sparkles{
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 7;
}

.canopy-sparkles .spark{
  position: absolute;
  width: var(--core, 3px);
  height: var(--core, 3px);
  border-radius: 50%;
  background: rgba(255,255,246,1);
  box-shadow:
    0 0 5px 1px rgba(255,252,228,1),
    0 0 14px 4px rgba(255,224,135,0.82),
    0 0 24px 7px rgba(255,194,96,0.28);
  opacity: 0;
  transform: translate(-50%, -50%) scale(0.22);
  transform-origin: 50% 50%;
  animation: canopyTwinkle var(--twinkle-time, 8.2s) ease-in-out infinite;
  animation-delay: var(--twinkle-delay, 0s);
}

.canopy-sparkles .spark::before,
.canopy-sparkles .spark::after{
  width:1px;
  height:var(--ray, 13px);
  background:linear-gradient(to bottom,
      transparent 0%,
      rgba(255,239,180,0.16) 14%,
      rgba(255,255,247,1) 50%,
      rgba(255,239,180,0.16) 86%,
      transparent 100%);
}
.canopy-sparkles .spark::before{
  width:var(--ray, 13px);
  height:1px;
  background:linear-gradient(to right,
      transparent 0%,
      rgba(255,239,180,0.16) 14%,
      rgba(255,255,247,1) 50%,
      rgba(255,239,180,0.16) 86%,
      transparent 100%);
}
.canopy-sparkles .spark::after{
  width:1px;
  height:var(--ray, 13px);
  background:linear-gradient(to bottom,
      transparent 0%,
      rgba(255,239,180,0.10) 16%,
      rgba(255,255,246,1) 50%,
      rgba(255,239,180,0.10) 84%,
      transparent 100%);
}

.canopy-sparkles .spark:nth-child(47) { left: 5%;  top: 86%; --twinkle-time: 6.8s; --twinkle-delay: -1.2s; --core:3px;   --ray:12px; }
.canopy-sparkles .spark:nth-child(48) { left: 9%;  top: 90%; --twinkle-time: 7.6s; --twinkle-delay: -4.1s; --core:2px;   --ray:10px; }
.canopy-sparkles .spark:nth-child(49) { left: 14%; top: 93%; --twinkle-time: 7.2s; --twinkle-delay: -2.3s; --core:2.5px; --ray:11px; }

/* Alex 側の足元まわりの植物 */
.canopy-sparkles .spark:nth-child(50) { left: 33%; top: 87%; --twinkle-time: 7.4s; --twinkle-delay: -3.0s; --core:2px;   --ray:10px; }
.canopy-sparkles .spark:nth-child(51) { left: 35%; top: 91%; --twinkle-time: 6.6s; --twinkle-delay: -0.8s; --core:3px;   --ray:12px; }
.canopy-sparkles .spark:nth-child(52) { left: 38%; top: 94%; --twinkle-time: 8.3s; --twinkle-delay: -5.0s; --core:2px;   --ray:10px; }

/* Daisy 側の足元まわりの植物 */
.canopy-sparkles .spark:nth-child(53) { left: 61%; top: 87%; --twinkle-time: 7.1s; --twinkle-delay: -1.7s; --core:2px;   --ray:10px; }
.canopy-sparkles .spark:nth-child(54) { left: 63%; top: 91%; --twinkle-time: 7.9s; --twinkle-delay: -4.6s; --core:3px;   --ray:12px; }
.canopy-sparkles .spark:nth-child(55) { left: 65%; top: 94%; --twinkle-time: 7.0s; --twinkle-delay: -2.8s; --core:2px;   --ray:10px; }

/* 右下の見えにくい植物と花 */
.canopy-sparkles .spark:nth-child(56) { left: 84%; top: 87%; --twinkle-time: 7.3s; --twinkle-delay: -0.9s; --core:2.5px; --ray:11px; }
.canopy-sparkles .spark:nth-child(57) { left: 89%; top: 91%; --twinkle-time: 6.7s; --twinkle-delay: -3.8s; --core:3px;   --ray:12px; }
.canopy-sparkles .spark:nth-child(58) { left: 94%; top: 94%; --twinkle-time: 8.1s; --twinkle-delay: -5.4s; --core:2px;   --ray:10px; }

/* 1周期に2回、チカッと目立つ。常時何かしら別の場所で光って見える密度にする。 */
@keyframes canopyTwinkle{
  0%, 8%, 18%, 44%, 62%, 100%{
    opacity:0;
    transform:translate(-50%, -50%) scale(0.22);
  }
  10%{
    opacity:0.24;
    transform:translate(-50%, -50%) scale(0.52);
  }
  13%{
    opacity:1;
    transform:translate(-50%, -50%) scale(1.18);
  }
  16%{
    opacity:0.18;
    transform:translate(-50%, -50%) scale(0.64);
  }
  49%{
    opacity:0.18;
    transform:translate(-50%, -50%) scale(0.50);
  }
  53%{
    opacity:0.92;
    transform:translate(-50%, -50%) scale(1.02);
  }
  57%{
    opacity:0.14;
    transform:translate(-50%, -50%) scale(0.58);
  }
}

.hotspot{
  position: absolute;
  display: block;
  border: none;
  background: transparent;
  padding: 0;
  margin: 0;
  cursor: pointer;
  border-radius: 14px;
}

.hotspot::before{
  content:"";
  position: absolute;
  inset: -6%;
  border-radius: inherit;
  background: radial-gradient(ellipse at 50% 55%,
              rgba(255,217,138,0.95) 0%,
              rgba(255,185,94,0.45) 45%,
              rgba(255,185,94,0.0) 75%);
  mix-blend-mode: screen;
  opacity: 0;
  transition: opacity 0.45s ease;
  pointer-events: none;
}

.hotspot:hover::before,
.hotspot:focus-visible::before{
  opacity: var(--glow-hover-opacity);
}

.hotspot.is-door:hover::before,
.hotspot.is-door:focus-visible::before{
  opacity: calc(var(--glow-hover-opacity) + 0.15);
}

.hotspot.is-lit::before{
  opacity: var(--glow-click-opacity) !important;
  transition: opacity 0.18s ease;
}

.hotspot:focus{ outline: none; }
.hotspot:focus-visible{
  outline: 2px solid rgba(255,221,160,0.85);
  outline-offset: 3px;
}

.hotspot .hotspot-label{
  position: absolute;
  left: 50%;
  bottom: calc(100% + 6px);
  transform: translateX(-50%) translateY(4px);
  white-space: nowrap;
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  color: var(--ink);
  background: linear-gradient(180deg, #f8efdd, #eddfc4);
  border: 1px solid rgba(120,95,60,0.35);
  border-radius: 999px;
  padding: 4px 12px;
  opacity: 0;
  transition: opacity 0.35s ease, transform 0.35s ease;
  pointer-events: none;
  box-shadow: 0 2px 8px rgba(30,20,10,0.3);
}
.hotspot:hover .hotspot-label,
.hotspot:focus-visible .hotspot-label{
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.dust-mote{
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: radial-gradient(circle, #ffe9b8 0%, rgba(255,200,110,0.85) 50%, rgba(255,200,110,0) 100%);
  pointer-events: none;
  opacity: 0;
  animation: mote-rise 1.1s ease-out forwards;
}
@keyframes mote-rise{
  0%   { opacity: 0;   transform: translateY(0)    scale(0.6); }
  20%  { opacity: 0.9; }
  100% { opacity: 0;   transform: translateY(-34px) scale(1.1); }
}

.fairy-dust{
  position: absolute;
  pointer-events: none;
  opacity: 0;
  animation: fairy-rise var(--dur) ease-in-out var(--delay) infinite;
}
.fairy-core{
  display: block;
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  background: radial-gradient(circle,
              rgba(255,252,235,1)   0%,
              rgba(var(--c1), 0.95) 35%,
              rgba(var(--c2), 0)    75%);
  box-shadow:
    0 0 calc(var(--size) * 0.7) calc(var(--size) * 0.18) rgba(var(--c1), 0.65),
    0 0 calc(var(--size) * 1.6) calc(var(--size) * 0.45) rgba(var(--c2), 0.30);
  animation: fairy-twinkle var(--tw) ease-in-out var(--delay) infinite;
}
.fairy-dust.is-star .fairy-core{
  border-radius: 0;
  clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%,
                     50% 100%, 39% 61%, 0% 50%, 39% 39%);
  background: radial-gradient(circle,
              rgba(255,253,240,1)   0%,
              rgba(var(--c1), 1)    45%,
              rgba(var(--c2), 0.2)  100%);
}

@keyframes fairy-rise{
  0%   { opacity: 0;
         transform: translate3d(0, 0, 0); }
  10%  { opacity: var(--peak); }
  25%  { transform: translate3d(var(--sway), calc(var(--rise) * 0.25), 0); }
  50%  { transform: translate3d(calc(var(--sway) * -0.8), calc(var(--rise) * 0.5), 0);
         opacity: calc(var(--peak) * 0.85); }
  75%  { transform: translate3d(var(--sway), calc(var(--rise) * 0.75), 0); }
  90%  { opacity: calc(var(--peak) * 0.9); }
  100% { opacity: 0;
         transform: translate3d(0, var(--rise), 0); }
}

@keyframes fairy-twinkle{
  0%, 100% { transform: scale(0.65) rotate(0deg);  filter: brightness(0.9); }
  50%      { transform: scale(1.35) rotate(22deg); filter: brightness(1.9); }
}

.menu-social{
  margin-top: 64px;
  padding-top: 60px;
  /* 2026-08-19 border-topを廃止し、線＋デイジー7個の静止背景に置換。
     位置は%指定なので画面幅が変わっても常に7個・等間隔のまま。
     背景の基準は padding-box なので padding-left の影響を受けず左右対称。 */
  background-image:
      var(--foot1), var(--foot2), var(--foot3),
      var(--foot4), var(--foot5), var(--foot6),
      linear-gradient(to right,
          rgba(243,233,215,0)    0,
          rgba(243,233,215,0.55) 9%,
          rgba(243,233,215,0.55) 91%,
          rgba(243,233,215,0)    100%);
  background-repeat: no-repeat;
  background-size:
      26px 26px, 26px 26px, 26px 26px,
      26px 26px, 26px 26px, 26px 26px,
      100% 1px;
  /* 足あとの中心は y+13。6個の平均が 16.8 なので線は 17px に置く。
     サイズを変えたら線のyも「ズレの平均＋サイズ/2」に合わせ直すこと。 */
  background-position:
      15% 4px, 29% 7px, 43% 6px,
      57% 0, 71% 1px, 85% 5px,
      0 17px;
  display: flex;
  align-items: flex-end; /* 下端そろえ。大きくしても下のラインは動かず上に伸びる */
  gap: 20px;
  justify-content: flex-start;
}
/* Tablets (touch, 601px+): nudge the icon away from the left edge. */
@media (hover: none) and (pointer: coarse) and (min-width: 601px){
  .menu-social{ padding-left: 56px; }
}
/* Narrower tablets like Fire HD: a little further right. */
@media (hover: none) and (pointer: coarse) and (min-width: 601px) and (max-width: 900px){
  .menu-social{ padding-left: 84px; }
}
/* Fire HD 8 (viewport 601px): pinpoint extra nudge. */
@media (hover: none) and (pointer: coarse) and (min-width: 601px) and (max-width: 650px){
  .menu-social{ padding-left: 120px; }
}

/* ===== 軽い霧(Fable画像) + ジェムのフチ消し魔法 ===== */
.water-mist {

  -webkit-mask-image: linear-gradient(to bottom,
      transparent 0%,
      rgba(0,0,0,1) 6%,
      rgba(0,0,0,1) 75%,
      transparent 100%);

/* PC専用(マウス端末のみ)：左右フチも溶かして縦カーテン(煙幕)を消す。中央の透けは維持。
   マスクは静的でタッチ端末は対象外＝Galaxy Tab安全。intersectで縦横フェードを合成。 */
@media (hover: hover) and (pointer: fine){
  .water-mist{
    -webkit-mask-image:
      linear-gradient(to bottom, transparent 0%, rgba(0,0,0,1) 6%, rgba(0,0,0,1) 75%, transparent 100%),
      radial-gradient(ellipse 34% 28% at 50% 40%, rgba(0,0,0,0.03) 0%, rgba(0,0,0,0.06) 35%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,1) 100%),
      linear-gradient(to right,  transparent 0%, rgba(0,0,0,1) 12%, rgba(0,0,0,1) 88%, transparent 100%);
    -webkit-mask-composite: source-in, source-in;
    mask-image:
      linear-gradient(to bottom, transparent 0%, rgba(0,0,0,1) 6%, rgba(0,0,0,1) 75%, transparent 100%),
      radial-gradient(ellipse 34% 28% at 50% 40%, rgba(0,0,0,0.03) 0%, rgba(0,0,0,0.06) 35%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,1) 100%),
      linear-gradient(to right,  transparent 0%, rgba(0,0,0,1) 12%, rgba(0,0,0,1) 88%, transparent 100%);
    mask-composite: intersect;
  }
}

   文字ごとに暖色を振り分け、上下と傾きをばらして手で並べた木の文字の感じを出す。
   理由2: background-clip:text はこのファイルの下の方のコメントにある通りAndroidで
   transformと相性が悪い既知の地雷。べた塗りにすることで機構ごと撤去できる。
   シマーのアニメも廃止（タッチ端末では元々止めてあった）。
   @keyframes vrShimmer / --vr-shimmer-speed / --vr-glow は未使用になるが無害なので残置。
   色・傾き・上下ズレは下の :nth-child で1文字1行。気に入らない文字だけ直せる。 */

  word-spacing: 0.25em;

}

.visit-rooms h2 span{ display: inline-block; }

.visit-rooms h2 span:nth-child(1){  color:#ffd08a; transform: translateY(0)    rotate(-7deg); }
.visit-rooms h2 span:nth-child(2){  color:#ffe9b0; transform: translateY(-5px) rotate(5deg); }
.visit-rooms h2 span:nth-child(3){  color:#7ed6d0; transform: translateY(3px)  rotate(-4deg); }
.visit-rooms h2 span:nth-child(4){  color:#ffb45e; transform: translateY(-3px) rotate(8deg); }
.visit-rooms h2 span:nth-child(5){  color:#ffe9b0; transform: translateY(4px)  rotate(-6deg); }
.visit-rooms h2 span:nth-child(6){  color:#ffd08a; transform: translateY(-6px) rotate(-9deg); }

     em基準にして文字と一緒に縮ませる。PCでは46.4px×0.34≒15.8pxで従来と同寸。 */
  margin: 0 0.34em;

/* ── Wooden tag buttons（木札ボタン）───────────────────
   ルモの札素材を透過WebP化して使用。文字はHTML上載せ（焼き込み禁止）。
   札はCSS背景で1画像を全ボタンで再利用＋aspect-ratioで読み込み前から
   場所を確保。札はimg decoding=sync＝デコード完了まで描画させない（緑地フラッシュ防止）。
   menu-feature（金のAbout＝Fableの遺産）は対象外・完全無変更。
   blur/blend/mask/filter不使用。hoverはtransformのみ。 */
.menu-btn.menu-tag{
  position: relative;
  display: block;
  padding: 0;
  min-height: 0;
  border: none;
  border-radius: 10px;
  box-shadow: none;
  background: none; /* 旧ホテルボタンの白グラデを完全解除（transparentではグラデが残る） */
  transition: transform 0.3s ease;
}
.menu-btn.menu-tag:hover,
.menu-btn.menu-tag:focus-visible{
  background: none;
  box-shadow: none;
  transform: translateY(-2px);
}
.menu-tag .tag-img{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  -webkit-user-select: none;
          user-select: none;
}
.menu-tag.tag-small{ width: clamp(146px, 22vw, 192px); aspect-ratio: 320 / 134; }
.menu-tag.tag-wide{  width: clamp(232px, 53vw, 348px); aspect-ratio: 720 / 184; }
.menu-tag.tag-about{ width: clamp(300px, 66vw, 440px); aspect-ratio: 720 / 184; } /* 後日再検討用・現在未使用 */
/* 木札の文字。body の Georgia(serif) は真面目すぎたので、木札だけ丸文字にする。
   金ボタン(.menu-feature)は別クラスなので Georgia のまま＝Fable遺産は無傷。
   影は「木に焼き印を押した」形：上に暗い縁、下に明るいハイライト、外に焦げの滲み。
   フォールバックの 'Baloo 2' は見出しで読込済みなので、Fredokaが落ちても丸文字は保つ。 */
.menu-tag .tag-label{
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 6% 13%;
  color: #3a220a;
  font-family: 'Fredoka', 'Baloo 2', system-ui, -apple-system, sans-serif;
  font-weight: 500;
  letter-spacing: 0.05em;
  line-height: 1.15;
  /* 影は em 単位。px固定だと、実機の16pxのときに滲みが太すぎて
     o や a の穴が埋まる（実機で5個しか開いていなかった）。文字サイズに比例させる。 */
  text-shadow:
     0 0.06em 0        rgba(255,238,200,0.50),
     0 -0.05em 0.05em  rgba(40,20,6,0.50),
     0 0 0.16em        rgba(74,38,10,0.30);
}
.menu-tag.tag-small .tag-label{ font-size: clamp(1.00rem, 2.7vw, 1.37rem); }
.menu-tag.tag-wide  .tag-label{ font-size: clamp(1.00rem, 3.4vw, 1.48rem); }
.menu-tag.tag-about .tag-label{ font-size: clamp(1.02rem, 3.5vw, 1.53rem); }

/* Large tablet: keep the successful PC-like river. */
@media (min-width: 701px) and (max-width: 900px){
  .river-current{

    filter: blur(0.78px) saturate(1.06);

  }

    opacity: 0.32;
    filter: blur(1.2px);
    animation: riverCurrentFill 840s linear infinite;
  }

  .river-current::after{
    top: 44%;
    opacity: 0.24;
    filter: blur(1.15px);
    animation: riverCurrentLowerDrift 620s linear infinite;
  }
}

/* Mini tablet: v22 fine-stripe transform patch. */
@media (min-width: 601px) and (max-width: 700px){
  .river-current{
    opacity: 0.82;
    mix-blend-mode: screen;
    filter: blur(0.72px) saturate(1.08);
    background: none;
    animation: none;
    overflow: hidden;
    transform: translateZ(0);
    will-change: auto;
    contain: paint;
  }

  .river-current::before{
    content:"";
    position:absolute;
    left:-6%;
    right:-6%;
    top:-220px;
    bottom:auto;
    height:calc(100% + 440px);
    pointer-events:none;
    opacity:0.92;
    mix-blend-mode:normal;
    filter:none;
    background:
      repeating-linear-gradient(5deg,
        rgba(255,255,255,0) 0 10px,
        rgba(215,255,238,0.00) 14px,
        rgba(215,255,238,0.052) 18px,
        rgba(255,238,184,0.074) 23px,
        rgba(215,255,238,0.044) 28px,
        rgba(255,255,255,0.00) 34px);
    background-size: 100% auto;
    background-position: 0 0;
    background-repeat: repeat;
    -webkit-mask-image:none;
            mask-image:none;
    transform: translate3d(0, 0, 0);
    will-change: transform;
    animation: riverMiniFineA 10s linear infinite;
  }

  .river-current::after{
    content:"";
    display:block;
    position:absolute;
    left:-6%;
    right:-6%;
    top:-220px;
    bottom:auto;
    height:calc(100% + 440px);
    pointer-events:none;
    opacity:0.72;
    mix-blend-mode:normal;
    filter:none;
    background:
      repeating-linear-gradient(-4deg,
        rgba(255,255,255,0) 0 14px,
        rgba(197,236,255,0.00) 18px,
        rgba(197,236,255,0.046) 23px,
        rgba(224,255,235,0.060) 28px,
        rgba(197,236,255,0.036) 33px,
        rgba(255,255,255,0.00) 40px);
    background-size: 100% auto;
    background-position: 0 0;
    background-repeat: repeat;
    -webkit-mask-image:none;
            mask-image:none;
    transform: translate3d(0, 0, 0);
    will-change: transform;
    animation: riverMiniFineB 11s linear infinite;
  }

  .ripple-a{
    opacity: 0.20;
    animation-duration: 56s;
  }

  .ripple-b{
    opacity: 0.14;
    animation-duration: 84s;
  }
}

@keyframes riverMiniFineA{
  from{ transform: translate3d(0, 0, 0); }
  to  { transform: translate3d(0, 204px, 0); }

  0%, 100% { filter:

  50%      { filter:

  opacity: 0;

}

  0%, 50%, 100% { opacity: 0;    transform: translateX(-4px); }
  62%           { opacity: 0.95; }
  78%           { opacity: 0;    transform: translateX(26px); }
}

  transform-origin: center;
  transform-box: fill-box;
  animation: gemTwinkle 1.5s ease-in-out infinite;

@keyframes gemTwinkle{
  0%, 100% { opacity: 0.35; transform: scale(0.6);  }
  50%      { opacity: 1;    transform: scale(1.45); }

  text-shadow:
     0 1px 0   rgba(255,247,224,0.55),
     0 -1px 1px rgba(28,12,4,0.6),
     0 0 6cqw  rgba(255,210,140,0.35);
}
.hotspot.is-gift:hover  .gift-gem .gem-shine,
.hotspot.is-gift:focus-visible .gift-gem .gem-shine,
.gift-face.shine .gem-shine{
  animation: gemSweep 0.9s ease-out 1;
}
@keyframes gemSweep{
  0%   { opacity: 0;    transform: translateX(0); }
  16%  { opacity: 0.9;  }
  100% { opacity: 0;    transform: translateX(26px); }
}

@media (prefers-reduced-motion: reduce){
  .hotspot.is-gift .gift-word{ transition: none; }

  .gift-gem .gem-shine{ animation: none !important; opacity: 0; }

/* ===== ジェムの特効薬v2：Android全機種（Galaxy/Fire/Pixel等）向け 波復活＆剥がれ防止 =====
   iPhone(iOS)とPCは@supportsで除外。Galaxy 12インチはタブレット帯(701-900px)のPC用超スロー川
   (riverCurrentDrift 680s)が実質静止画だった＝ジェムの推理。スマホで実績のある
   transform方式の軽い川(riverMiniFineA/B 10-11s・キーフレームはトップレベル定義でクロ照合済み)を
   Androidタッチ端末に強制適用する。ripple-aはスマホ実績値(0.20/56s)に統一。 */
@media (hover: none) and (pointer: coarse){
  @supports not (-webkit-touch-callout: none){
    /* 1. SVGの波は重いので1枚に減らし、優しく動かす */
    .ripple-a {
      opacity: 0.20 !important;
      animation-duration: 56s !important;
    }
    .ripple-b {
      display: none !important;
      animation: none !important;
    }

    /* 2. PC用の重くて遅い川（680秒）をキャンセルし、スマホ用の軽くて速い川（10秒）に切り替え */
    .river-current {
      opacity: 0.82 !important;
      background: none !important;
      animation: none !important;
      transform: translateZ(0) !important;
      filter: none !important;
    }
    .river-current::before {
      content: "" !important;
      display: block !important;
      position: absolute !important;
      left: -6% !important; right: -6% !important;
      top: -220px !important; bottom: auto !important;
      height: calc(100% + 440px) !important;
      opacity: 0.92 !important;
      background: repeating-linear-gradient(5deg, rgba(255,255,255,0) 0 10px, rgba(215,255,238,0.00) 14px, rgba(215,255,238,0.052) 18px, rgba(255,238,184,0.074) 23px, rgba(215,255,238,0.044) 28px, rgba(255,255,255,0.00) 34px) !important;
      background-size: 100% auto !important;
      -webkit-mask-image: none !important;
      mask-image: none !important;
      animation: riverMiniFineA 10s linear infinite !important;
      filter: none !important;
    }
    .river-current::after {
      content: "" !important;
      display: block !important;
      position: absolute !important;
      left: -6% !important; right: -6% !important;
      top: -220px !important; bottom: auto !important;
      height: calc(100% + 440px) !important;
      opacity: 0.72 !important;
      background: repeating-linear-gradient(-4deg, rgba(255,255,255,0) 0 14px, rgba(197,236,255,0.00) 18px, rgba(197,236,255,0.046) 23px, rgba(224,255,235,0.060) 28px, rgba(197,236,255,0.036) 33px, rgba(255,255,255,0.00) 40px) !important;
      background-size: 100% auto !important;
      -webkit-mask-image: none !important;
      mask-image: none !important;
      animation: riverMiniFineB 11s linear infinite !important;
      filter: none !important;
    }

    /* 3. 診断テスト：filterとmaskの同居でmaskが不発になり、.water::afterの
       矩形下端が水平線として露出する疑い。filterのみ全解除して切り分ける。 */
    .water::after {
      filter: none !important;
    }
  }
}

/* ===== 横向き(landscape)専用：短いtailだと横向きの短いビューポートで
   水ボックス下端より下のhtml背景(緑)が露出するため、実績値300pxに戻して覆う。
   縦向き(スマホ50px/タブレット60px)の短さはそのまま維持される。
   2026-08-19 タッチ端末限定に変更。PCも常にlandscape判定なので巻き込まれ、
   アイコン下に余分な水300pxがぶら下がってスクロールが伸びていた。PCは:rootの
   60pxで足りる(bodyの下padding48pxを12px上回るので緑は露出しない)。 ===== */
@media (orientation: landscape) and (hover: none) and (pointer: coarse){
  :root{ --water-tail: 300px; }
}

/* ===== PC(マウス端末)専用：アイコン下の遊びの余白。
   :rootの60pxだと詰まって見えるので140pxに。タッチ端末は上のルールのまま
   (縦60px/スマホ縦50px/横300px)。数値はここ1箇所だけ動かせば増減できる。 ===== */
@media (hover: hover) and (pointer: fine){
  /* 2026-08-19 アイコンを28px下げ、その分だけ水の裾を縮める。
     padding-top を +X したら --water-tail を -X する＝合計が変わらないので
     スクロールの長さは不変。詰め具合を変えたいときはこの2数値だけ動かす。 */
  :root{ --water-tail: 112px; }
  .menu-social{ padding-top: 88px; }
}

  function buildMenu() {
    const holder = document.getElementById("menuRows");
    MENU.forEach(function (row) {
      const rowEl = document.createElement("div");
      rowEl.className = "menu-row";
      row.forEach(function (item) {
        const a = document.createElement("a");
        a.href = item.href;
        a.setAttribute("aria-label", item.aria || item.label);
        setLinkTarget(a, item.href);
        if (item.feature) {
          /* Aboutボタン：金のmenu-feature（Fableの遺産）。
             2026-07 一時③木札化→実機判定で金に復帰。木札案は後日再検討。
             tag-aboutのCSSは再検討用に温存 */
          a.className = "menu-btn menu-feature";
          a.textContent = item.label;
        } else {
          /* 木札ボタン：札=img（decoding=sync＝木目と文字を同フレーム描画）、文字=HTML上載せ */
          const wide = item.label.length > 14;
          a.className = "menu-btn menu-tag " + (wide ? "tag-wide" : "tag-small")
            + (item.label.length > 8 ? " tag-long" : "");
          const img = document.createElement("img");
          img.className = "tag-img";
          img.src = wide ? TAG_WIDE_SRC : TAG_SMALL_SRC;
          img.alt = "";
          img.setAttribute("aria-hidden", "true");
          img.decoding = "sync";
          const lbl = document.createElement("span");
          lbl.className = "tag-label";
          lbl.textContent = item.label;
          a.appendChild(img);
          a.appendChild(lbl);
        }
        rowEl.appendChild(a);
      });
      holder.appendChild(rowEl);
    });
  }
  buildMenu();

  /* 読み込み直後に札imgを全てデコード済みにしておく（スクロール到達前に開封完了） */
  document.querySelectorAll(".tag-img").forEach(function (im) {
    if (im.decode) im.decode().catch(function () {});
  });

    '<stop offset=".24" stop-color="#f77737"/><stop offset=".33" stop-color="#f56040"/>' +
    '<stop offset=".42" stop-color="#fd1d1d"/><stop offset=".55" stop-color="#e1306c"/>' +
    '<stop offset=".67" stop-color="#c13584"/><stop offset=".79" stop-color="#833ab4"/>' +
    '<stop offset=".91" stop-color="#5851db"/><stop offset="1" stop-color="#405de6"/>' +
    '</radialGradient></defs>' +
    '<rect width="46" height="46" rx="14" fill="url(#igGrad)"/>' +
    '<rect x="9.5" y="9.5" width="27" height="27" rx="6.5" fill="none" stroke="#fffdf6" stroke-width="3"/>' +
    '<circle cx="23" cy="23" r="6" fill="none" stroke="#fffdf6" stroke-width="3"/>' +
    '<circle cx="31.5" cy="15.8" r="1.6" fill="#fffdf6"/></svg>';

  function buildSocial() {
    const holder = document.getElementById("menuSocial");
    SOCIAL.forEach(function (s) {
      const a = document.createElement("a");
      a.className = "social-btn social-" + (s.kind === "youtube" ? "yt" : s.kind);
      a.href = s.href;
      a.setAttribute("aria-label", s.aria || s.kind);
      if (s.kind === "instagram") a.innerHTML = IG_SVG;
      setLinkTarget(a, s.href);
      holder.appendChild(a);
    });
  }
  buildSocial();

  function buildFairyDust() {
    if (!SPARKLES.enabled || reducedMotion) return;
    /* スマホでは粒と光輪を小さく・静かに（霊魂化防止） */
    const small = window.matchMedia("(max-width: 600px)").matches;
    const sizeK = small ? 0.55 : 1;
    const peakK = small ? 0.75 : 1;
    const tones = [
      ["255,216,110", "255,170,60"],
      ["255,196,86",  "230,140,40"],
      ["255,232,170", "255,196,120"],
      ["255,184,128", "240,140,80"]
    ];
    for (let i = 0; i < SPARKLES.count; i++) {
      const dust = document.createElement("span");
      dust.className = "fairy-dust" + (Math.random() < 0.35 ? " is-star" : "");
      const tone = tones[Math.floor(Math.random() * tones.length)];

      dust.style.left = (4 + Math.random() * 92) + "%";
      dust.style.top  = (24 + Math.random() * 68) + "%";
      dust.style.setProperty("--c1",   tone[0]);
      dust.style.setProperty("--c2",   tone[1]);
      dust.style.setProperty("--size", ((6 + Math.random() * 8) * sizeK).toFixed(1) + "px");
      dust.style.setProperty("--rise", (-(70 + Math.random() * 130)).toFixed(0) + "px");
      dust.style.setProperty("--sway", (18 + Math.random() * 30).toFixed(0) + "px");
      dust.style.setProperty("--dur",  (7 + Math.random() * 7).toFixed(1) + "s");
      dust.style.setProperty("--tw",   (1.3 + Math.random() * 1.7).toFixed(1) + "s");
      dust.style.setProperty("--delay",(Math.random() * 8).toFixed(1) + "s");
      dust.style.setProperty("--peak", ((0.8 + Math.random() * 0.2) * peakK).toFixed(2));

      const core = document.createElement("i");
      core.className = "fairy-core";
      dust.appendChild(core);
      stage.appendChild(dust);
    }
  }
  buildFairyDust();

  HOTSPOTS.forEach(function (spot) {
    stage.appendChild(buildHotspot(spot));
  });

})();
</script>

</body>
</html>
