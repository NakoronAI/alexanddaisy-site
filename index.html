<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex &amp; Daisy — Welcome to the House</title>
<meta name="description" content="Welcome to the Alex & Daisy storybook house. Knock on a window to visit a friend.">
<link rel="icon" href="/favicon.ico?v=1" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png?v=1">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1">

<style>
/* ============================================================
   ALEX & DAISY — STORYBOOK HOUSE HOMEPAGE
   ------------------------------------------------------------
   STYLE NOTES
   - The artwork (house.jpg) is the hero.
   - The page around it is a quiet evening: soft dusk paper,
     a faint vignette, nothing that competes with the house.
   - Hotspots are invisible until hovered/focused, then they
     "wake up" with a warm inner lamp-light glow.
   ============================================================ */

:root{
  /* --- Page palette (quiet dusk paper) --- */
  --page-top:    #d8e0be;   /* soft leaf light */
  --page-bottom: #71845c;   /* quiet moss */
  --paper:       #f3e9d7;   /* warm paper for text panels */
  --ink:         #3b3128;   /* warm ink for text */
  --ink-soft:    #6e5f50;
  --lamp:        #ffd98a;   /* warm window light */
  --lamp-deep:   #ffb95e;   /* deeper amber for click */

  /* --- Glow strength (see also GLOW settings in the JS) --- */
  --glow-hover-opacity: 0.55;
  --glow-click-opacity: 0.9;
}

*{ box-sizing: border-box; }

html, body{
  margin: 0;
  padding: 0;
}

body{
  min-height: 100vh;
  background: #4a563a;          /* deep moss fallback while the image loads */
  color: var(--paper);
  font-family: Georgia, "Times New Roman", "Hiragino Mincho ProN", "Yu Mincho", serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 0 48px;
}

/* ============================================================
   THE WORLD BACKDROP (cinematic, CSS-only)
   ------------------------------------------------------------
   A softly enlarged, blurred, slightly darkened echo of the
   SAME house artwork fills the whole landscape screen, so the
   portrait picture sits inside its own world instead of plain
   side bars. It is fixed in place, so the foreground house
   scrolls over it with a natural storybook depth (parallax).
   The image file is set automatically from IMAGE_FILE in the
   EDIT HERE box — you never need to edit it here.
   ============================================================ */
.world-backdrop{
  position: fixed;
  inset: -48px;                     /* oversized so blur has no hard edges */
  z-index: -2;
  background-size: cover;           /* image is set by the script */
  background-position: center 22%;  /* keep the sunny treetops in view */
  filter: blur(18px) brightness(0.82) saturate(0.92);
  transform: scale(1.08);
  pointer-events: none;
}

/* quiet light over the backdrop: a sunlit clearing, leaf-shadow
   dapple at the edges, and a gentle vignette so the eye settles
   on the house. No purple, no neon — only forest light. */
.world-veil{
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    /* soft sun from above the sign */
    radial-gradient(90% 55% at 50% 0%, rgba(255,248,220,0.18), rgba(0,0,0,0) 60%),
    /* large, soft leaf shadows drifting in from the corners */
    radial-gradient(40% 34% at 6% 12%,  rgba(26,36,18,0.34), rgba(0,0,0,0) 70%),
    radial-gradient(42% 36% at 96% 8%,  rgba(26,36,18,0.30), rgba(0,0,0,0) 70%),
    radial-gradient(36% 30% at 88% 78%, rgba(26,36,18,0.26), rgba(0,0,0,0) 70%),
    /* natural vignette toward the edges */
    radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 52%, rgba(22,30,16,0.42) 100%),
    /* grounding shade at the very bottom */
    linear-gradient(180deg, rgba(0,0,0,0) 78%, rgba(20,28,14,0.35) 100%);
}

/* ---------- The stage that holds the artwork ---------- */
/* The window onto the scene: full page width, and it crops away
   whatever part of the (deliberately oversized) artwork doesn't
   fit — like looking at a wide theater stage through the screen. */
.stage-window{
  width: 100%;
  overflow: hidden;
  display: flex;
  justify-content: center;   /* keep the house centered in the crop */
}

.house-stage{
  position: relative;
  flex: none;                /* never shrink: overflow IS the design */
  /* CINEMATIC CROP SIZING:
     The artwork is rendered LARGER than the screen and centered,
     so the forest edges crop away and the house itself stands
     big, with the first view cutting cleanly at the lower row of
     name plaques (Mr. T / Videos / Lumo). Scrolling reveals the
     porch, Alex & Daisy, and the garden signs.

       - 285vh: THE CUT DIAL (the main number to tune).
                285 = the first view ends right at the lower
                name plaques. 260 = smaller house, cut moves
                down past the lower windows. 320 = bigger house,
                cut moves up to the Welcome oval.
       - 170vw: phone guard — on narrow screens the crop never
                goes past 1.7x the screen width, so the house
                always fits nicely on mobile.
       - 100vw: never smaller than the full screen width. */
  width: max(100vw, min(285vh, 170vw));
}

/* The artwork itself. Never cropped, aspect ratio preserved. */
.house-stage img.house-art{
  display: block;
  width: 100%;
  height: auto;
}

/* ============================================================
   HOTSPOTS
   - Created by JavaScript from the HOTSPOTS list (see EDIT HERE).
   - Positioned with percentage top/left/width/height so they
     scale perfectly with the image at any screen size.
   ============================================================ */
.hotspot{
  position: absolute;
  display: block;
  border: none;
  background: transparent;
  padding: 0;
  margin: 0;
  cursor: pointer;
  border-radius: 14px;
  /* keep the artwork visible: the glow lives in ::before */
}

/* warm inner lamp-light, invisible until hover/focus */
.hotspot::before{
  content:"";
  position: absolute;
  inset: -6%;
  border-radius: inherit;
  background: radial-gradient(ellipse at 50% 55%,
              rgba(255,217,138,0.95) 0%,
              rgba(255,185,94,0.45) 45%,
              rgba(255,185,94,0.0) 75%);
  mix-blend-mode: screen;       /* light "adds" onto the painting */
  opacity: 0;
  transition: opacity 0.45s ease;
  pointer-events: none;
}

.hotspot:hover::before,
.hotspot:focus-visible::before{
  opacity: var(--glow-hover-opacity);
}

/* doors get a slightly fuller, but still gentle, light */
.hotspot.is-door:hover::before,
.hotspot.is-door:focus-visible::before{
  opacity: calc(var(--glow-hover-opacity) + 0.15);
}

/* click: the light swells for a moment */
.hotspot.is-lit::before{
  opacity: var(--glow-click-opacity) !important;
  transition: opacity 0.18s ease;
}

/* elegant keyboard focus: a thin candle-gold line */
.hotspot:focus{ outline: none; }
.hotspot:focus-visible{
  outline: 2px solid rgba(255,221,160,0.85);
  outline-offset: 3px;
}

/* small floating name tag that appears on hover/focus */
.hotspot .hotspot-label{
  position: absolute;
  left: 50%;
  bottom: calc(100% + 6px);
  transform: translateX(-50%) translateY(4px);
  white-space: nowrap;
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  color: var(--ink);
  background: linear-gradient(180deg, #f8efdd, #eddfc4);
  border: 1px solid rgba(120,95,60,0.35);
  border-radius: 999px;
  padding: 4px 12px;
  opacity: 0;
  transition: opacity 0.35s ease, transform 0.35s ease;
  pointer-events: none;
  box-shadow: 0 2px 8px rgba(30,20,10,0.3);
}
.hotspot:hover .hotspot-label,
.hotspot:focus-visible .hotspot-label{
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ---------- tiny golden dust motes (created on click) ---------- */
.dust-mote{
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: radial-gradient(circle, #ffe9b8 0%, rgba(255,200,110,0.85) 50%, rgba(255,200,110,0) 100%);
  pointer-events: none;
  opacity: 0;
  animation: mote-rise 1.1s ease-out forwards;
}
@keyframes mote-rise{
  0%   { opacity: 0;   transform: translateY(0)    scale(0.6); }
  20%  { opacity: 0.9; }
  100% { opacity: 0;   transform: translateY(-34px) scale(1.1); }
}

/* ---------- fairy dust (created by the script) ----------------------
   Golden-amber magic motes over the scene. Each mote is TWO parts:
     .fairy-dust  = the invisible carrier that drifts upward in a
                    gentle S-shaped sway (zig, zag, zig)
     .fairy-core  = the glowing light itself, which twinkles:
                    swelling, shrinking, breathing its halo
   Round motes mix with little four-point star sparkles.
   All colors/sizes/timings are randomized per mote by the script. */
.fairy-dust{
  position: absolute;
  pointer-events: none;
  opacity: 0;
  animation: fairy-rise var(--dur) ease-in-out var(--delay) infinite;
}
.fairy-core{
  display: block;
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  background: radial-gradient(circle,
              rgba(255,252,235,1)   0%,
              rgba(var(--c1), 0.95) 35%,
              rgba(var(--c2), 0)    75%);
  box-shadow:
    0 0 calc(var(--size) * 0.7) calc(var(--size) * 0.18) rgba(var(--c1), 0.65),
    0 0 calc(var(--size) * 1.6) calc(var(--size) * 0.45) rgba(var(--c2), 0.30);
  animation: fairy-twinkle var(--tw) ease-in-out var(--delay) infinite;
}
/* some motes are tiny four-point stars instead of round glows */
.fairy-dust.is-star .fairy-core{
  border-radius: 0;
  clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%,
                     50% 100%, 39% 61%, 0% 50%, 39% 39%);
  background: radial-gradient(circle,
              rgba(255,253,240,1)   0%,
              rgba(var(--c1), 1)    45%,
              rgba(var(--c2), 0.2)  100%);
}

/* the upward S-curve journey: rise, sway right, sway left, fade */
@keyframes fairy-rise{
  0%   { opacity: 0;
         transform: translate3d(0, 0, 0); }
  10%  { opacity: var(--peak); }
  25%  { transform: translate3d(var(--sway), calc(var(--rise) * 0.25), 0); }
  50%  { transform: translate3d(calc(var(--sway) * -0.8), calc(var(--rise) * 0.5), 0);
         opacity: calc(var(--peak) * 0.85); }
  75%  { transform: translate3d(var(--sway), calc(var(--rise) * 0.75), 0); }
  90%  { opacity: calc(var(--peak) * 0.9); }
  100% { opacity: 0;
         transform: translate3d(0, var(--rise), 0); }
}

/* the heartbeat of the light: swell, brighten, breathe */
@keyframes fairy-twinkle{
  0%, 100% { transform: scale(0.65) rotate(0deg);  filter: brightness(0.9); }
  50%      { transform: scale(1.35) rotate(22deg); filter: brightness(1.9); }
}

/* ============================================================
   SOCIAL ICON ROW — real-world buttons under the menu.
   The red YouTube "candy" button lives here now (it used to
   float over the artwork; the artwork stays art-only).
   YouTube sits on the LEFT; the open space to its right is
   reserved for future icons (Instagram, …) from the SOCIAL
   list in the EDIT HERE box.
   ============================================================ */
.menu-social{
  margin-top: 52px;
  padding-top: 32px;
  border-top: 1px solid rgba(243,233,215,0.25);
  display: flex;
  align-items: center;
  gap: 14px;
  justify-content: flex-start;   /* ← "center" centers the icons */
}
.social-btn{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.social-btn:focus{ outline: none; }
.social-btn:focus-visible{
  outline: 2px solid rgba(255,221,160,0.9);
  outline-offset: 4px;
}

/* the candy-red YouTube button (same friendly look as before) */
.social-yt{
  width: 70px;
  height: 48px;
  border-radius: 14px;
  background: linear-gradient(180deg, #ff5347 0%, #e3170a 55%, #c20d04 100%);
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,0.45),   /* candy highlight   */
    inset 0 -4px 6px rgba(90,0,0,0.35),       /* underside shading */
    0 5px 14px rgba(80,15,8,0.45),            /* drop shadow       */
    0 2px 4px rgba(60,10,5,0.4);
  animation: social-bob 3.6s ease-in-out infinite alternate;
}
/* the white play triangle */
.social-yt::after{
  content:"";
  width: 0;
  height: 0;
  margin-left: 3px;
  border-top:    9px solid transparent;
  border-bottom: 9px solid transparent;
  border-left:   15px solid #fffdf6;
  filter: drop-shadow(0 1px 1px rgba(90,0,0,0.4));
}
/* gentle bobbing, like a sign swaying on a breeze */
@keyframes social-bob{
  from { transform: translateY(-2px) rotate(-1.5deg); }
  to   { transform: translateY( 2px) rotate( 1.5deg); }
}
/* point at it: a happy lift and a warm halo */
.social-yt:hover,
.social-yt:focus-visible{
  animation: none;
  transform: scale(1.12);
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,0.5),
    inset 0 -4px 6px rgba(90,0,0,0.3),
    0 8px 20px rgba(80,15,8,0.5),
    0 0 0 6px rgba(255,224,150,0.35),         /* golden ring  */
    0 0 26px 8px rgba(255,205,120,0.55);      /* warm halo    */
}

/* ---------- debugging aid: outlines for placing hotspots ----------
   Turned on/off with SHOW_HOTSPOT_OUTLINES in the JS EDIT HERE box. */
.show-outlines .hotspot{
  outline: 1px dashed rgba(255,120,120,0.9);
  background: rgba(255,120,120,0.12);
}

/* ============================================================
   "VISIT ROOMS" — the main menu under the picture.
   On phones this is how most visitors actually navigate, so
   the buttons are big (44px+ tall), clear, and arranged in
   friendly rows (set row by row in MENU, in the EDIT HERE box).
   The About button wears the same honey-gold as the painted
   sign — one plank of the artwork stepping down into the menu.
   ============================================================ */
.visit-rooms{
  width: min(100%, 760px);
  margin-top: 96px;          /* a stretch of garden between house & menu */
  padding: 0 16px;
  text-align: center;
}
.visit-rooms h2{
  font-size: 1rem;
  font-weight: normal;
  letter-spacing: 0.34em;
  color: rgba(250,242,226,0.96);
  text-shadow: 0 1px 4px rgba(20,28,14,0.9), 0 0 16px rgba(20,28,14,0.5);
  margin: 0 0 40px;          /* a quiet pause under the heading */
}
.visit-rooms h2::before,
.visit-rooms h2::after{
  content:"·";
  margin: 0 12px;
  color: rgba(255,225,170,0.8);
}

/* one .menu-row per line of buttons — set apart like plaques
   spaced out along a garden path, not packed in a panel */
.menu-row{
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  margin: 0 0 26px;          /* generous step between rows */
}

/* the standard worn-paper button — bigger and easy to tap */
.menu-btn{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 46px;
  padding: 10px 20px;
  text-decoration: none;
  color: var(--ink);
  background: linear-gradient(180deg, rgba(248,238,219,0.96) 0%, rgba(229,213,182,0.96) 100%);
  border: 1px solid rgba(110,88,56,0.4);
  border-bottom-width: 3px;
  border-radius: 12px;
  font-size: 0.95rem;
  letter-spacing: 0.06em;
  box-shadow: 0 2px 7px rgba(15,22,10,0.4);
  transition: box-shadow 0.3s ease, transform 0.3s ease, background 0.3s ease;
}
.menu-btn:hover,
.menu-btn:focus-visible{
  background: linear-gradient(180deg, #fff4dd 0%, #f1e0bf 100%);
  box-shadow: 0 4px 12px rgba(255,190,110,0.4);
  transform: translateY(-1px);
}
.menu-btn:focus{ outline: none; }
.menu-btn:focus-visible{
  outline: 2px solid rgba(255,221,160,0.9);
  outline-offset: 2px;
}

/* THE ABOUT BUTTON — honey-gold, like the big painted sign */
.menu-btn.menu-feature{
  min-height: 54px;
  padding: 12px 26px;
  font-size: 1.12rem;
  letter-spacing: 0.09em;
  color: #45300f;
  background: linear-gradient(180deg, #fadc82 0%, #eeb14a 52%, #cf8d2b 100%);
  border-color: rgba(99,64,18,0.6);
  border-radius: 14px;
  text-shadow: 0 1px 0 rgba(255,243,200,0.65);
  box-shadow:
    inset 0 2px 2px rgba(255,246,205,0.8),    /* sunlit top edge   */
    inset 0 -3px 5px rgba(125,75,15,0.3),     /* carved underside  */
    0 3px 12px rgba(15,22,10,0.45);
}
/* little sparkles on both sides (decorative only) */
.menu-btn.menu-feature::before,
.menu-btn.menu-feature::after{
  content:"\2726";                 /* ✦ */
  font-size: 0.78em;
  color: rgba(110,68,14,0.9);
}
.menu-btn.menu-feature::before{ margin-right: 12px; }
.menu-btn.menu-feature::after { margin-left: 12px; }
.menu-btn.menu-feature:hover,
.menu-btn.menu-feature:focus-visible{
  background: linear-gradient(180deg, #ffe79b 0%, #f7bf5c 52%, #db9834 100%);
  box-shadow:
    inset 0 2px 2px rgba(255,248,215,0.85),
    inset 0 -3px 5px rgba(125,75,15,0.28),
    0 5px 16px rgba(255,190,110,0.5);
  transform: translateY(-1px);
}

/* ---------- footer whisper ---------- */
.page-footer{
  margin-top: 72px;
  font-size: 0.82rem;
  letter-spacing: 0.16em;
  color: rgba(247,238,222,0.72);
  text-shadow: 0 1px 4px rgba(20,28,14,0.85);
  font-style: italic;
  text-align: center;
}

/* ============================================================
   REDUCED MOTION
   - No dust motes, no label slide; glow becomes a simple fade.
   ============================================================ */
@media (prefers-reduced-motion: reduce){
  .dust-mote{ display: none !important; }
  .fairy-dust{ display: none !important; }
  .social-btn{ animation: none; }
  .hotspot::before,
  .hotspot .hotspot-label,
  .menu-btn{
    transition: opacity 0.2s linear;
    transform: none !important;
  }
}

/* ---------- small screens ---------- */
@media (max-width: 600px){
  body{ padding: 0 0 48px; }
  .hotspot .hotspot-label{ font-size: 0.65rem; padding: 3px 9px; }

  /* MOBILE — the menu is a garden of plaques, not a packed panel.
     Narrow the group and center it so the forest shows on both
     sides, and keep the generous vertical air (scrolling is fine). */
  .visit-rooms{
    width: 88vw;
    max-width: 360px;
    margin-left: auto;
    margin-right: auto;
    margin-top: 72px;          /* garden walk between house & menu */
    padding: 0;
  }
  .visit-rooms h2{ margin-bottom: 34px; }
  .menu-row{ margin-bottom: 22px; }
  /* buttons size to their content again (no full-row stretch);
     min-height in the base CSS keeps them comfortably tappable */
  .menu-btn{ flex: 0 1 auto; }
  .menu-social{ margin-top: 46px; padding-top: 30px; }
  .page-footer{ margin-top: 60px; }

  /* on phones the house fills the screen, so the backdrop barely
     shows — use a cheaper blur to keep scrolling silky */
  .world-backdrop{ filter: blur(10px) brightness(0.82); }
}
/* ============================================================
   GIFT BOX  (the little wooden treasure chest, lower right)
   ------------------------------------------------------------
   The chest is a hotspot that leads to gift.html. The word GIFT
   and a small garnet are laid on the chest's blank wooden panel
   with CSS / SVG only — the artwork (house.png) is never touched.
   Position is tuned with giftLeft / giftTop / giftTilt in the
   EDIT HERE box, so it can be nudged in one line.
   ============================================================ */
.hotspot.is-gift{ container-type: inline-size; }

/* the face laid on the wooden panel: GIFT stacked over the garnet.
   The whole face is rotated to sit flat on the chest's perspective. */
.gift-face{
  position: absolute;
  left: 50%;
  top: 71%;
  transform: translate(-50%, -50%) rotate(var(--gift-tilt, 0deg));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4cqw;
  pointer-events: none;          /* the whole chest handles the click */
  text-align: center;
  line-height: 1;
}

/* GIFT — carved / branded into the tan wood of the panel */
.gift-word{
  font-family: Georgia, "Times New Roman", "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-weight: 700;
  font-size: 17cqw;              /* scales with the chest, not the screen */
  letter-spacing: 0.16em;
  margin-right: -0.16em;
  color: #3a2414;               /* burnt-umber carving */
  text-shadow:
     0 1px 0   rgba(255,243,214,0.40),
     0 -1px 1px rgba(36,18,8,0.55);
  transition: color .35s ease, text-shadow .35s ease;
}

/* the garnet: a faceted gem in SVG — bigger now, with a faint,
   slow twinkle so it catches the eye ("what's that?") */
.gift-gem{
  display: block;
  width: 18cqw;                  /* bigger so it reads on a phone */
  height: auto;
  overflow: visible;
  filter:
     drop-shadow(0 1px 2px rgba(30,6,10,0.55))
     drop-shadow(0 0 1.5px rgba(150,22,34,0.40));
  /* the gem breathes a faint deep-red glow */
  animation: gemBreath 4.6s ease-in-out infinite;
}
@keyframes gemBreath{
  0%, 100% { filter:
     drop-shadow(0 1px 2px rgba(30,6,10,0.55))
     drop-shadow(0 0 1.5px rgba(150,22,34,0.35)); }
  50%      { filter:
     drop-shadow(0 1px 2px rgba(30,6,10,0.55))
     drop-shadow(0 0 5px rgba(184,32,49,0.70)); }
}
/* a small bright reflection slips across the gem every few seconds
   — "did something just glint?" rather than steady blinking */
.gift-gem .gem-shine{
  opacity: 0;
  animation: gemFlash 5s ease-in-out infinite;
}
@keyframes gemFlash{
  0%, 80%, 100% { opacity: 0;    transform: translateX(0); }
  85%           { opacity: 0.95; }
  91%           { opacity: 0;    transform: translateX(26px); }
}
.gift-gem .gem-spark{
  transform-origin: center;
  transform-box: fill-box;
  animation: gemTwinkle 3.4s ease-in-out infinite;
}
.gift-gem .gem-spark.s2{ animation-delay: 1.3s; }
.gift-gem .gem-spark.s3{ animation-delay: 2.3s; }
@keyframes gemTwinkle{
  0%, 100% { opacity: 0.10; transform: scale(0.6); }
  50%      { opacity: 0.85; transform: scale(1.05); }
}

/* wake-up: the word warms and a single bright sweep crosses the
   garnet on hover / focus / tap */
.hotspot.is-gift:hover .gift-word,
.hotspot.is-gift:focus-visible .gift-word,
.hotspot.is-gift.is-lit .gift-word{
  color: #2c1a0d;
  text-shadow:
     0 1px 0   rgba(255,247,224,0.55),
     0 -1px 1px rgba(28,12,4,0.6),
     0 0 6cqw  rgba(255,210,140,0.35);
}
.hotspot.is-gift:hover  .gift-gem .gem-shine,
.hotspot.is-gift:focus-visible .gift-gem .gem-shine,
.gift-face.shine .gem-shine{
  animation: gemSweep 0.9s ease-out 1;
}
@keyframes gemSweep{
  0%   { opacity: 0;    transform: translateX(0); }
  16%  { opacity: 0.9;  }
  100% { opacity: 0;    transform: translateX(26px); }
}

@media (prefers-reduced-motion: reduce){
  .hotspot.is-gift .gift-word{ transition: none; }
  .gift-gem{ animation: none !important; }
  .gift-gem .gem-spark{ animation: none !important; opacity: 0.5; }
  .gift-gem .gem-shine{ animation: none !important; opacity: 0; }
}
</style>
</head>
<body>

<!-- ============================================================
     THE WORLD BACKDROP — a blurred, darkened echo of the SAME
     artwork fills the landscape screen behind the house, plus a
     veil of forest light and vignette. Both are decorative only.
     The picture used here follows IMAGE_FILE automatically.
     ============================================================ -->
<div class="world-backdrop" id="worldBackdrop" aria-hidden="true"></div>
<div class="world-veil" aria-hidden="true"></div>

<!-- ============================================================
     THE STAGE — the artwork itself is the homepage.
     No extra title above it; the painted sign is the title.
     To change the picture, see IMAGE_FILE in the EDIT HERE box.
     ============================================================ -->
<div class="stage-window">
<main class="house-stage" id="houseStage" aria-label="The Alex and Daisy storybook house. Interactive windows and doors.">
  <img class="house-art" id="houseArt"
       src="house.png"
       alt="A handmade storybook house in a sunlit forest garden. Each window belongs to a friend: Alex, Daisy, Giga, Mr. T, and Lumo. The door leads to the videos, with signs for downloads and contact among the flowers.">
  <!-- hotspots are inserted here by the script below -->
</main>
</div><!-- /stage-window -->

<!-- ============================================================
     VISIT ROOMS — the main menu (built from MENU in EDIT HERE),
     plus the social icon row (built from SOCIAL). On phones,
     this is the navigation most visitors actually use.
     ============================================================ -->
<nav class="visit-rooms" aria-label="Visit rooms">
  <h2>VISIT&nbsp;ROOMS</h2>
  <div id="menuRows"></div>
  <div class="menu-social" id="menuSocial"></div>
</nav>

<footer class="page-footer">
  a little house, handmade with love
</footer>


<script>
/* ╔══════════════════════════════════════════════════════════════╗
   ║                                                              ║
   ║   ★★★  EDIT HERE  ★★★                                        ║
   ║                                                              ║
   ║   Everything you normally need to change lives in this box: ║
   ║   the image file, every link, every label, every position,  ║
   ║   and the glow strength. You should not need to touch       ║
   ║   anything below the "ENGINE" line.                         ║
   ║                                                              ║
   ╚══════════════════════════════════════════════════════════════╝ */

/* 1) THE PICTURE -------------------------------------------------
      Put your image in the same folder as this file and write its
      filename here. */
const IMAGE_FILE = "house.png";


/* 2) HOTSPOT POSITIONING HELP ------------------------------------
      Set this to true to see red dashed boxes over the image while
      you adjust positions. Set back to false when you're done. */
const SHOW_HOTSPOT_OUTLINES = false;


/* 3) GLOW STRENGTH -----------------------------------------------
      0 = invisible, 1 = strongest. Gentle values look best. */
const GLOW = {
  hover: 0.55,   // warm light when pointing at a window
  click: 0.90    // brighter swell at the moment of a click
};


/* 3a) FAIRY DUST ---------------------------------------------------
      Golden-amber magic motes that twinkle, breathe, and sway
      upward over the scene. Set enabled to false to turn off. */
const SPARKLES = {
  enabled: true,
  count: 22        // how many motes (14 = calm, 30 = festival)
};


/* 4) THE HOTSPOTS ------------------------------------------------
      One entry per clickable spot on the picture.

      top / left / width / height are PERCENTAGES of the image,
      so they stay in place on every screen size.
        - top:  distance from the TOP edge of the picture
        - left: distance from the LEFT edge of the picture

      HOW TO ADJUST A POSITION:
        a) set SHOW_HOTSPOT_OUTLINES = true (above)
        b) open the page and look at the red boxes
        c) nudge the numbers until each box sits on its window
        d) set SHOW_HOTSPOT_OUTLINES = false again

      "type" changes the feel slightly:
        "window"  – normal gentle glow
        "door"    – a touch stronger glow
        "sign"    – normal glow
        "motes"   – how many dust motes appear on click (optional,
                    defaults to 6)

      NOTE: these positions were measured against the real
      artwork (the portrait house picture). If anything is a
      little off, nudge the numbers with the red outlines on. */
const HOTSPOTS = [
  {
    name: "Alex window",
    label: "Alex",
    aria: "Visit Alex's room",
    href: "#alex",
    type: "window",
    top: 37.5, left: 36.2, width: 6.4, height: 15.5
  },
  {
    name: "Daisy window",
    label: "Daisy",
    aria: "Visit Daisy's room",
    href: "#daisy",
    type: "window",
    top: 34.5, left: 47.4, width: 6,   height: 17
  },
  {
    name: "Giga window",
    label: "Giga",
    aria: "Visit Giga's room",
    href: "#giga",
    type: "window",
    top: 37.5, left: 57.7, width: 6.2, height: 15.5
  },
  {
    name: "Mr. T window",
    label: "Mr. T",
    aria: "Visit Mr. T's room",
    href: "#mr-t",
    type: "window",
    top: 60.5, left: 35.6, width: 7,   height: 17
  },
  {
    name: "Lumo window",
    label: "Lumo",
    aria: "Visit Lumo's room",
    href: "#lumo",
    type: "window",
    top: 60.5, left: 57.5, width: 7,   height: 17
  },
  {
    name: "Videos door",
    label: "Videos",
    aria: "Open the door to the videos",
    href: "#videos",
    type: "door",
    motes: 9,
    top: 60.5, left: 46.4, width: 8.2, height: 36
  },
  {
    name: "Downloads sign",
    label: "Posters & Wallpapers",
    aria: "Download posters and wallpapers",
    href: "#downloads",
    type: "sign",
    top: 77.5, left: 24,   width: 7.8, height: 15.5
  },
  {
    name: "Gift box",
    label: "",                /* "" = no floating tag; GIFT is laid on the panel */
    aria: "Open the gift box",
    href: "gift.html",        /* a small real page — never a dead link */
    type: "gift",
    /* the whole chest is the click target */
    top: 79,   left: 66.2, width: 7.4, height: 17,
    /* GIFT + garnet position, as % INSIDE the chest box.
       giftTilt tilts the text to match the chest's panel: the
       panel's top edge runs slightly DOWN to the right, so a small
       POSITIVE tilt makes the word sit flat instead of pasted-on.
       Nudge giftLeft / giftTop / giftTilt while watching the page. */
    giftLeft: 49.5, giftTop: 71, giftTilt: 1.5
  },
  {
    name: "Alex & Daisy top sign",
    label: "",                /* "" = no floating tag; the painted sign speaks for itself */
    aria: "Alex and Daisy home sign",
    href: "#top",
    type: "sign",
    top: 2.5,  left: 32,   width: 36.5, height: 16.5
  }
];


/* 5) THE MENU ----------------------------------------------------
      The "VISIT ROOMS" menu under the picture, arranged ROW BY
      ROW: each inner [ ... ] is one row of buttons, top to
      bottom. To move a button, just move its line.
        label   = the words on the button
        href    = where it goes. "#about" etc. are placeholders
                  until the real pages exist. Full "https://"
                  links open in a new tab automatically.
        aria    = what screen readers announce
        feature = true gives the big honey-gold style (About) */
const MENU = [
  [ { label: "About Alex & Daisy", href: "about.html",
      aria: "About Alex and Daisy", feature: true } ],

  [ { label: "Alex",  href: "#alex",  aria: "Visit Alex's room"  },
    { label: "Daisy", href: "#daisy", aria: "Visit Daisy's room" },
    { label: "Giga",  href: "#giga",  aria: "Visit Giga's room"  } ],

  [ { label: "Mr. T", href: "#mr-t", aria: "Visit Mr. T's room" },
    { label: "Lumo",  href: "#lumo", aria: "Visit Lumo's room"  } ],

  [ { label: "Posters & Wallpapers", href: "#downloads",
      aria: "Download posters and wallpapers" } ],

  [ { label: "Watch Videos", href: "#videos",
      aria: "Watch the videos" },
    { label: "Gift", href: "gift.html",
      aria: "Open the gift box" } ],

  [ { label: "YouTube", href: "https://www.youtube.com/@alexanddaisy2022",
      aria: "Visit the Alex and Daisy YouTube channel" } ]
];


/* 6) SOCIAL ICONS ------------------------------------------------
      The icon row under the menu. YouTube sits on the left; the
      open space to its right is saved for future icons
      (Instagram, …). "kind" picks the icon look — only
      "youtube" exists so far. */
const SOCIAL = [
  { kind: "youtube",
    href: "https://www.youtube.com/@alexanddaisy2022",
    aria: "Alex and Daisy on YouTube" }
];

/* ╔══════════════════════════════════════════════════════════════╗
   ║   END OF "EDIT HERE".                                        ║
   ║   Below is the ENGINE — it just builds the page from the     ║
   ║   list above. You normally never need to change it.          ║
   ╚══════════════════════════════════════════════════════════════╝ */


/* ----------------------- THE ENGINE ----------------------------- */
(function () {
  "use strict";

  const stage    = document.getElementById("houseStage");
  const art      = document.getElementById("houseArt");

  const reducedMotion =
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* --- the garnet on the gift box: a faceted gem drawn in SVG.
         Light core fading to a dark pavilion gives it depth (it
         reads as translucent, not a flat stone); a few facets catch
         light, three tiny sparkles twinkle slowly, and a bright bar
         sweeps across on hover / tap. Only one gem exists, so the
         gradient / clip ids are safe to hard-code. --- */
  const GEM_SVG =
    '<defs>' +
      '<radialGradient id="gemCore" cx="48%" cy="36%" r="64%">' +
        '<stop offset="0%" stop-color="#d24a58"/>' +
        '<stop offset="44%" stop-color="#9c2031"/>' +
        '<stop offset="100%" stop-color="#4a0b12"/>' +
      '</radialGradient>' +
      '<linearGradient id="gemTable" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="#ef8b95"/>' +
        '<stop offset="100%" stop-color="#b22f46"/>' +
      '</linearGradient>' +
      '<clipPath id="gemClip"><polygon points="12,1 21,9.5 12,23 3,9.5"/></clipPath>' +
    '</defs>' +
    '<polygon points="12,1 21,9.5 12,23 3,9.5" fill="url(#gemCore)"/>' +
    /* pavilion (lower half) — deep and dark, draws the eye inward */
    '<polygon points="3,9.5 12,10.8 12,23"  fill="#54101a"/>' +
    '<polygon points="21,9.5 12,10.8 12,23" fill="#3e0a12"/>' +
    /* crown bezels — light on the left, dark on the right */
    '<polygon points="12,1 3,9.5 8.6,8.3"     fill="#c2384a"/>' +
    '<polygon points="3,9.5 12,10.8 8.6,8.3"  fill="#9c2031"/>' +
    '<polygon points="12,1 15.4,8.3 21,9.5"   fill="#7c1622"/>' +
    '<polygon points="21,9.5 12,10.8 15.4,8.3" fill="#641019"/>' +
    '<polygon points="12,1 8.6,8.3 12,4"      fill="#cf414f"/>' +
    '<polygon points="12,1 12,4 15.4,8.3"     fill="#8a1d2a"/>' +
    /* table (top facet) */
    '<polygon points="12,4 15.4,8.3 12,10.8 8.6,8.3" fill="url(#gemTable)"/>' +
    /* girdle hint + sharp table highlight + upper-left rim light */
    '<polygon points="12,1 21,9.5 12,23 3,9.5" fill="none" ' +
        'stroke="#e8808c" stroke-opacity="0.45" stroke-width="0.5"/>' +
    '<polygon points="11.4,5.2 13.2,7.6 11,7.9" fill="#ffe9ec" fill-opacity="0.9"/>' +
    '<path d="M12,1 L3,9.5" stroke="#ffd0d6" stroke-opacity="0.55" ' +
        'stroke-width="0.5" fill="none"/>' +
    /* three slow sparkles */
    '<path class="gem-spark" d="M11,3.6 11.4,4.4 12.2,4.8 11.4,5.2 11,6 10.6,5.2 9.8,4.8 10.6,4.4Z" fill="#fff"/>' +
    '<path class="gem-spark s2" d="M17,10.4 17.35,11.1 18,11.4 17.35,11.7 17,12.4 16.65,11.7 16,11.4 16.65,11.1Z" fill="#fff"/>' +
    '<path class="gem-spark s3" d="M6.4,9.6 6.7,10.2 7.3,10.5 6.7,10.8 6.4,11.4 6.1,10.8 5.5,10.5 6.1,10.2Z" fill="#fff"/>' +
    /* the bright sweep on hover / tap */
    '<rect class="gem-shine" x="-7" y="0" width="5" height="24" rx="2.5" ' +
        'fill="#fff2de" clip-path="url(#gemClip)"/>';

  /* links that start with http(s) open in a new tab */
  function setLinkTarget(a, href) {
    if (/^https?:/i.test(href)) {
      a.target = "_blank";
      a.rel = "noopener noreferrer";
    }
  }

  /* apply the simple settings from EDIT HERE */
  art.src = IMAGE_FILE;
  /* the blurred world behind the house uses the SAME image */
  document.getElementById("worldBackdrop").style.backgroundImage =
    'url("' + IMAGE_FILE + '")';
  document.documentElement.style.setProperty("--glow-hover-opacity", GLOW.hover);
  document.documentElement.style.setProperty("--glow-click-opacity", GLOW.click);
  if (SHOW_HOTSPOT_OUTLINES) stage.classList.add("show-outlines");

  /* --- build one hotspot link on the picture --- */
  function buildHotspot(spot) {
    const a = document.createElement("a");
    a.className = "hotspot"
      + (spot.type === "door" ? " is-door" : "")
      + (spot.type === "gift" ? " is-gift" : "");
    a.href = spot.href;
    a.setAttribute("aria-label", spot.aria || spot.label || spot.name);
    setLinkTarget(a, spot.href);

    /* percentage positioning — scales with the image */
    a.style.top    = spot.top    + "%";
    a.style.left   = spot.left   + "%";
    a.style.width  = spot.width  + "%";
    a.style.height = spot.height + "%";

    /* the floating name tag (a hotspot with label: "" gets none) */
    if (spot.label !== "") {
      const tag = document.createElement("span");
      tag.className = "hotspot-label";
      tag.textContent = spot.label || spot.name;
      a.appendChild(tag);
    }

    /* gift box: lay GIFT + the garnet on the chest's wooden panel */
    let giftFace = null;
    if (spot.type === "gift") {
      giftFace = document.createElement("span");
      giftFace.className = "gift-face";
      giftFace.style.left = (spot.giftLeft != null ? spot.giftLeft : 50) + "%";
      giftFace.style.top  = (spot.giftTop  != null ? spot.giftTop  : 72) + "%";
      if (spot.giftTilt != null) {
        giftFace.style.setProperty("--gift-tilt", spot.giftTilt + "deg");
      }
      giftFace.innerHTML =
        '<span class="gift-word">GIFT</span>' +
        '<svg class="gift-gem" viewBox="0 0 24 24" aria-hidden="true">' + GEM_SVG + '</svg>';
      a.appendChild(giftFace);
    }

    /* click: glow swell + a few dust motes + 0.4s pause, then go.
       The gift box gives the garnet one bright sweep on the way. */
    a.addEventListener("click", function (event) {
      event.preventDefault();
      a.classList.add("is-lit");
      if (spot.type === "gift" && giftFace && !reducedMotion) {
        giftFace.classList.remove("shine");
        void giftFace.offsetWidth;          /* restart the light sweep */
        giftFace.classList.add("shine");
      }
      if (!reducedMotion) {
        releaseDustMotes(a, spot.motes || (spot.type === "gift" ? 5 : 6));
      }
      window.setTimeout(function () {
        a.classList.remove("is-lit");
        if (a.target === "_blank") {
          window.open(spot.href, "_blank", "noopener");
        } else {
          window.location.href = spot.href;
        }
      }, 400);
    });

    return a;
  }

  /* --- a few tiny golden dust motes drifting up from the spot --- */
  function releaseDustMotes(hotspotEl, count) {
    for (let i = 0; i < count; i++) {
      const mote = document.createElement("span");
      mote.className = "dust-mote";
      /* scatter inside the hotspot */
      mote.style.left = (15 + Math.random() * 70) + "%";
      mote.style.top  = (35 + Math.random() * 50) + "%";
      mote.style.animationDelay = (Math.random() * 0.25) + "s";
      hotspotEl.appendChild(mote);
      /* clean up after the little drift finishes */
      window.setTimeout(function () { mote.remove(); }, 1600);
    }
  }

  /* --- build the VISIT ROOMS menu from the MENU rows --- */
  function buildMenu() {
    const holder = document.getElementById("menuRows");
    MENU.forEach(function (row) {
      const rowEl = document.createElement("div");
      rowEl.className = "menu-row";
      row.forEach(function (item) {
        const a = document.createElement("a");
        a.className = "menu-btn" + (item.feature ? " menu-feature" : "");
        a.href = item.href;
        a.textContent = item.label;
        a.setAttribute("aria-label", item.aria || item.label);
        setLinkTarget(a, item.href);
        rowEl.appendChild(a);
      });
      holder.appendChild(rowEl);
    });
  }
  buildMenu();

  /* --- build the social icon row from the SOCIAL list --- */
  function buildSocial() {
    const holder = document.getElementById("menuSocial");
    SOCIAL.forEach(function (s) {
      const a = document.createElement("a");
      a.className = "social-btn social-" + (s.kind === "youtube" ? "yt" : s.kind);
      a.href = s.href;
      a.setAttribute("aria-label", s.aria || s.kind);
      setLinkTarget(a, s.href);
      holder.appendChild(a);
    });
  }
  buildSocial();

  /* --- fairy dust drifting over the scene --- */
  function buildFairyDust() {
    if (!SPARKLES.enabled || reducedMotion) return;
    /* warm storybook palette: [inner glow, outer halo] as "r,g,b" */
    const tones = [
      ["255,216,110", "255,170,60"],   /* gold      */
      ["255,196,86",  "230,140,40"],   /* amber     */
      ["255,232,170", "255,196,120"],  /* candle    */
      ["255,184,128", "240,140,80"]    /* peach ember */
    ];
    for (let i = 0; i < SPARKLES.count; i++) {
      const dust = document.createElement("span");
      dust.className = "fairy-dust" + (Math.random() < 0.35 ? " is-star" : "");
      const tone = tones[Math.floor(Math.random() * tones.length)];

      dust.style.left = (4 + Math.random() * 92) + "%";
      dust.style.top  = (24 + Math.random() * 68) + "%";
      dust.style.setProperty("--c1",   tone[0]);
      dust.style.setProperty("--c2",   tone[1]);
      dust.style.setProperty("--size", (6 + Math.random() * 8).toFixed(0) + "px");
      dust.style.setProperty("--rise", (-(70 + Math.random() * 130)).toFixed(0) + "px");
      dust.style.setProperty("--sway", (18 + Math.random() * 30).toFixed(0) + "px");
      dust.style.setProperty("--dur",  (7 + Math.random() * 7).toFixed(1) + "s");
      dust.style.setProperty("--tw",   (1.3 + Math.random() * 1.7).toFixed(1) + "s");
      dust.style.setProperty("--delay",(Math.random() * 8).toFixed(1) + "s");
      dust.style.setProperty("--peak", (0.8 + Math.random() * 0.2).toFixed(2));

      const core = document.createElement("i");
      core.className = "fairy-core";
      dust.appendChild(core);
      stage.appendChild(dust);
    }
  }
  buildFairyDust();

  /* --- build everything from the HOTSPOTS list --- */
  HOTSPOTS.forEach(function (spot) {
    stage.appendChild(buildHotspot(spot));
  });
})();
</script>

</body>
</html>
