.hotspot{
  position: absolute;
  display: block;
  border: none;
  background: transparent;
  padding: 0;
  margin: 0;
  cursor: pointer;
  border-radius: 14px;
}

.hotspot::before{
  content:"";
  position: absolute;
  inset: -6%;
  border-radius: inherit;
  background: radial-gradient(ellipse at 50% 55%,
              rgba(255,217,138,0.95) 0%,
              rgba(255,185,94,0.45) 45%,
              rgba(255,185,94,0.0) 75%);
  mix-blend-mode: screen;
  opacity: 0;
  transition: opacity 0.45s ease;
  pointer-events: none;
}

.hotspot:hover::before,
.hotspot:focus-visible::before{
  opacity: var(--glow-hover-opacity);
}

.hotspot.is-door:hover::before,
.hotspot.is-door:focus-visible::before{
  opacity: calc(var(--glow-hover-opacity) + 0.15);
}

.hotspot.is-lit::before{
  opacity: var(--glow-click-opacity) !important;
  transition: opacity 0.18s ease;
}

.hotspot:focus{ outline: none; }
.hotspot:focus-visible{
  outline: 2px solid rgba(255,221,160,0.85);
  outline-offset: 3px;
}

.hotspot .hotspot-label{
  position: absolute;
  left: 50%;
  bottom: calc(100% + 6px);
  transform: translateX(-50%) translateY(4px);
  white-space: nowrap;
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  color: var(--ink);
  background: linear-gradient(180deg, #f8efdd, #eddfc4);
  border: 1px solid rgba(120,95,60,0.35);
  border-radius: 999px;
  padding: 4px 12px;
  opacity: 0;
  transition: opacity 0.35s ease, transform 0.35s ease;
  pointer-events: none;
  box-shadow: 0 2px 8px rgba(30,20,10,0.3);
}
.hotspot:hover .hotspot-label,
.hotspot:focus-visible .hotspot-label{
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.dust-mote{
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: radial-gradient(circle, #ffe9b8 0%, rgba(255,200,110,0.85) 50%, rgba(255,200,110,0) 100%);
  pointer-events: none;
  opacity: 0;
  animation: mote-rise 1.1s ease-out forwards;
}
@keyframes mote-rise{
  0%   { opacity: 0;   transform: translateY(0)    scale(0.6); }
  20%  { opacity: 0.9; }
  100% { opacity: 0;   transform: translateY(-34px) scale(1.1); }
}

.fairy-dust{
  position: absolute;
  pointer-events: none;
  opacity: 0;
  animation: fairy-rise var(--dur) ease-in-out var(--delay) infinite;
}
.fairy-core{
  display: block;
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  background: radial-gradient(circle,
              rgba(255,252,235,1)   0%,
              rgba(var(--c1), 0.95) 35%,
              rgba(var(--c2), 0)    75%);
  box-shadow:
    0 0 calc(var(--size) * 0.7) calc(var(--size) * 0.18) rgba(var(--c1), 0.65),
    0 0 calc(var(--size) * 1.6) calc(var(--size) * 0.45) rgba(var(--c2), 0.30);
  animation: fairy-twinkle var(--tw) ease-in-out var(--delay) infinite;
}
.fairy-dust.is-star .fairy-core{
  border-radius: 0;
  clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%,
                     50% 100%, 39% 61%, 0% 50%, 39% 39%);
  background: radial-gradient(circle,
              rgba(255,253,240,1)   0%,
              rgba(var(--c1), 1)    45%,
              rgba(var(--c2), 0.2)  100%);
}

@keyframes fairy-rise{
  0%   { opacity: 0;
         transform: translate3d(0, 0, 0); }
  10%  { opacity: var(--peak); }
  25%  { transform: translate3d(var(--sway), calc(var(--rise) * 0.25), 0); }
  50%  { transform: translate3d(calc(var(--sway) * -0.8), calc(var(--rise) * 0.5), 0);
         opacity: calc(var(--peak) * 0.85); }
  75%  { transform: translate3d(var(--sway), calc(var(--rise) * 0.75), 0); }
  90%  { opacity: calc(var(--peak) * 0.9); }
  100% { opacity: 0;
         transform: translate3d(0, var(--rise), 0); }
}

@keyframes fairy-twinkle{
  0%, 100% { transform: scale(0.65) rotate(0deg);  filter: brightness(0.9); }
  50%      { transform: scale(1.35) rotate(22deg); filter: brightness(1.9); }
}

/* ===== 軽い霧(Fable画像) + ジェムのフチ消し魔法 ===== */
.water-mist {
  position: absolute;
  left: 50%;
  top: calc(-1 * var(--water-line) - 132px);
  width: 100vw;
  height: 1290px;
  transform: translateX(-50%);
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
  /* ライスペーパーのフチを自然に溶かす魔法のマスク */
  -webkit-mask-image: linear-gradient(to bottom, 
      transparent 0%, 
      rgba(0,0,0,1) 15%, 
      rgba(0,0,0,1) 75%, 
      transparent 100%);
  mask-image: linear-gradient(to bottom, 
      transparent 0%, 
      rgba(0,0,0,1) 15%, 
      rgba(0,0,0,1) 75%, 
      transparent 100%);
}

.water-mist .mist-layer {
  position: absolute;
  background-size: 100% 100%;
  background-repeat: no-repeat;
  background-position: center center;
  transform-origin: 50% 100%;
  will-change: transform, opacity;
}

/* 1枚目：一番手前の霧 */
.water-mist .mist-layer:nth-child(1) {
  background-image: url("mist_t2_1.webp");
  left: -20vw;
  width: 140vw;
  top: 0vw;
  height: 1200px;
  opacity: 0.85;
  filter: blur(1px);
  animation: mistDriftA 20s ease-in-out -6s infinite alternate;
}

/* 2枚目：中間の霧（腹巻防止のため top を vw で分散） */
.water-mist .mist-layer:nth-child(2) {
  background-image: url("mist_t2_2.webp");
  left: -30vw;
  width: 160vw;
  top: 15vw;
  height: 1100px;
  opacity: 0.70;
  filter: blur(2px);
  animation: mistDriftB 27s ease-in-out -14s infinite alternate;
}

/* 3枚目：奥の霧（腹巻防止のため top を vw で分散） */
.water-mist .mist-layer:nth-child(3) {
  background-image: url("mist_t2_3.webp");
  left: -20vw;
  width: 140vw;
  top: 25vw;
  height: 1000px;
  opacity: 0.55;
  filter: blur(4px);
  animation: mistDriftC 36s ease-in-out -22s infinite alternate;
}

@keyframes mistDriftA {
  0%   { transform: translate3d(-8%,  15px, 0) scale(1.03) rotate(-0.3deg); }
  100% { transform: translate3d( 8%, -15px, 0) scale(1.12) rotate( 0.3deg); }
}
@keyframes mistDriftB {
  0%   { transform: translate3d( 8%, -15px, 0) scale(1.06) rotate( 0.2deg); }
  100% { transform: translate3d(-8%,  15px, 0) scale(1.15) rotate(-0.2deg); }
}
@keyframes mistDriftC {
  0%   { transform: translate3d(-5%,  20px, 0) scale(1.00) rotate(-0.2deg); }
  100% { transform: translate3d( 5%, -15px, 0) scale(1.10) rotate( 0.2deg); }
}

@media (max-width: 700px) {
  .water-mist {
    top: calc(-1 * var(--water-line) - 116px);
    height: 940px;
  }
  .water-mist .mist-layer:nth-child(1) { left:-25vw; width:150vw; top: -10px; height: 950px; opacity: 0.75; }
  .water-mist .mist-layer:nth-child(2) { left:-35vw; width:170vw; top:  80px; height: 850px; opacity: 0.60; }
  .water-mist .mist-layer:nth-child(3) { left:-25vw; width:150vw; top: 160px; height: 750px; opacity: 0.45; }
}
@media (prefers-reduced-motion: reduce) {
  .water-mist .mist-layer { animation: none; }
}

/* ===== ジェムの特効薬：Galaxy Tab 画面剥がれ(GPUパンク/レイヤー分離)対策 =====
   タッチ端末のみ。重い合成レイヤーを間引いてコンポジタ負荷を10枚→4枚に。
   セレクタは現物(.ripple / .river-current::before/::after)と照合済み(クロ検証)。 */
@media (hover: none) and (pointer: coarse){
  /* 1. さざ波影は ripple-a を1枚だけ復活させて水面に息を戻す。ripple-b は停止のまま。
        ripple-a の端末別値(PC0.34/16s・スマホ0.20/56s・低DPI0.16/70s)は各メディアで既定済み。
        soft-light 1枚なら Galaxy Tab コンポジタが耐えられる想定(実機で剥離ラインを線引き)。 */
  .ripple-b{
    display: none !important;
    animation: none !important;
  }
  /* 2. モアレの元凶「川3枚重ね」を土台1枚に。相手が消えるのでモアレは構造上起きない。 */
  .river-current{
    filter: blur(1px) saturate(1.1) !important;
    opacity: 0.8 !important;
  }
  .river-current::before,
  .river-current::after{
    display: none !important;
    animation: none !important;
  }
}

<main class="house-stage" id="houseStage" aria-label="The Alex and Daisy storybook house. Interactive windows and doors.">
  <img class="house-art" id="houseArt"
       src="house_q85.webp"
       width="1672"
       height="941"
       fetchpriority="high"
       decoding="async"
       alt="A handmade storybook house in a sunlit forest garden. Each window belongs to a friend: Alex, Daisy, Giga, Mr. T, and Lumo. The door leads to the videos, with signs for downloads and contact among the flowers.">
</main>
</div>

<nav class="visit-rooms" aria-label="Visit rooms">
  <div class="water" id="waterLayer" aria-hidden="true"><div class="water-reflection-image" aria-hidden="true"></div><div class="lower-water-undulate" aria-hidden="true"></div><svg class="ripple ripple-a" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><filter id="rwA" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.009 0.020" numOctaves="2" seed="7" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.80  0 0 0 0 0.87  0 0 0 0 0.82  0 0 0 0.9 -0.42"/><feGaussianBlur stdDeviation="1.3"/></filter><rect width="100%" height="100%" filter="url(#rwA)"/></svg><svg class="ripple ripple-b" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><filter id="rwB" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.026" numOctaves="2" seed="23" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.15  0 0 0 0 0.25  0 0 0 0 0.18  0 0 0 0.8 -0.34"/><feGaussianBlur stdDeviation="1.6"/></filter><rect width="100%" height="100%" filter="url(#rwB)"/></svg><div class="river-current" aria-hidden="true"></div></div><div class="water-mist" aria-hidden="true"><div class="mist-layer"></div><div class="mist-layer"></div><div class="mist-layer"></div></div>
  <h2>VISIT&nbsp;ROOMS</h2>
  <div id="menuRows"></div>
  <div class="menu-social" id="menuSocial"></div>
</nav>

<footer class="page-footer">
  a little house,<br>handmade with love
</footer>

<script>
/* ╔══════════════════════════════════════════════════════════════╗
   ║                                                              ║
   ║   ★★★  EDIT HERE  ★★★                                        ║
   ║                                                              ║
   ╚══════════════════════════════════════════════════════════════╝ */

const SHOW_HOTSPOT_OUTLINES = false;

const GLOW = {
  hover: 0.55,
  click: 0.90
};

const SPARKLES = {
  enabled: true,
  count: 22
};

const HOTSPOTS = [
  {
    name: "Alex window",
    label: "Alex",
    aria: "Visit Alex's room",
    href: "alex.html",
    type: "window",
    top: 37.5, left: 36.2, width: 6.4, height: 15.5
  },
  {
    name: "Daisy window",
    label: "Daisy",
    aria: "Visit Daisy's room",
    href: "daisy.html",
    type: "window",
    top: 34.5, left: 47.4, width: 6,   height: 17
  },
  {
    name: "Giga window",
    label: "Giga",
    aria: "Visit Giga's room",
    href: "giga.html",
    type: "window",
    top: 37.5, left: 57.7, width: 6.2, height: 15.5
  },
  {
    name: "Mr. T window",
    label: "Mr. T",
    aria: "Visit Mr. T's room",
    href: "mr-t.html",
    type: "window",
    top: 60.5, left: 35.6, width: 7,   height: 17
  },
  {
    name: "Lumo window",
    label: "Lumo",
    aria: "Visit Lumo's room",
    href: "lumo.html",
    type: "window",
    top: 60.5, left: 57.5, width: 7,   height: 17
  },
  {
    name: "Videos door",
    label: "Videos",
    aria: "Open the door to the videos",
    href: "#videos",
    type: "door",
    motes: 9,
    top: 60.5, left: 46.4, width: 8.2, height: 36
  },
  {
    name: "Downloads sign",
    label: "Posters & Wallpapers",
    aria: "Download posters and wallpapers",
    href: "#downloads",
    type: "sign",
    top: 77.5, left: 24,   width: 7.8, height: 15.5
  },
  {
    name: "Gift box",
    label: "",
    aria: "Open the gift box",
    href: "gift.html",
    type: "gift",
    top: 79,   left: 66.2, width: 7.4, height: 17,
    giftLeft: 49.5, giftTop: 71, giftTilt: 1.5
  },
  {
    name: "Alex & Daisy top sign",
    label: "",
    aria: "Alex and Daisy home sign",
    href: "#top",
    type: "sign",
    top: 2.5,  left: 32,   width: 36.5, height: 16.5
  }
];

const MENU = [
  [ { label: "About Alex & Daisy", href: "about.html",
      aria: "About Alex and Daisy", feature: true } ],

  [ { label: "Alex",  href: "alex.html",  aria: "Visit Alex's room"  },
    { label: "Daisy", href: "daisy.html", aria: "Visit Daisy's room" },
    { label: "Giga",  href: "giga.html",  aria: "Visit Giga's room"  } ],

  [ { label: "Mr. T", href: "mr-t.html", aria: "Visit Mr. T's room" },
    { label: "Lumo",  href: "lumo.html", aria: "Visit Lumo's room"  } ],

  [ { label: "Posters & Wallpapers", href: "#downloads",
      aria: "Download posters and wallpapers" } ],

  [ { label: "Watch Videos", href: "#videos",
      aria: "Watch the videos" },
    { label: "Gift", href: "gift.html",
      aria: "Open the gift box" } ],

  [ { label: "Fun Room", href: "fun.html",
      aria: "Enter the Fun Room" } ]
];

const SOCIAL = [
  { kind: "youtube",
    href: "https://www.youtube.com/@alexanddaisy2022",
    aria: "Alex and Daisy on YouTube" }
];

/* ╔══════════════════════════════════════════════════════════════╗
   ║   ENGINE                                                     ║
   ╚══════════════════════════════════════════════════════════════╝ */

(function () {
  "use strict";

  const stage    = document.getElementById("houseStage");

  const reducedMotion =
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const GEM_SVG =
    '<defs>' +
      '<radialGradient id="gemBody" cx="42%" cy="30%" r="78%">' +
        '<stop offset="0%" stop-color="#ff5e76"/>' +
        '<stop offset="34%" stop-color="#d11d38"/>' +
        '<stop offset="100%" stop-color="#530b14"/>' +
      '</radialGradient>' +
      '<linearGradient id="gemGloss" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="#ffe3e8" stop-opacity="0.95"/>' +
        '<stop offset="55%" stop-color="#ff9aac" stop-opacity="0.12"/>' +
        '<stop offset="100%" stop-color="#ff9aac" stop-opacity="0"/>' +
      '</linearGradient>' +
      '<clipPath id="gemClip"><polygon points="12,1 21,9.5 12,23 3,9.5"/></clipPath>' +
    '</defs>' +
    '<polygon points="12,1 21,9.5 12,23 3,9.5" fill="url(#gemBody)"/>' +
    '<polygon points="3,9.5 12,11 12,23"  fill="#2c0710" fill-opacity="0.62"/>' +
    '<polygon points="21,9.5 12,11 12,23" fill="#1c050c" fill-opacity="0.66"/>' +
    '<polygon points="12,1 8.6,8 12,4"  fill="#ff7a90" fill-opacity="0.45"/>' +
    '<polygon points="12,1 12,4 15.4,8" fill="#7c1622" fill-opacity="0.40"/>' +
    '<polygon points="12,1.5 18.6,8.6 12,11 5.4,8.6" fill="url(#gemGloss)"/>' +
    '<ellipse cx="9.4" cy="6" rx="2.7" ry="1.5" fill="#ffffff" fill-opacity="0.92" transform="rotate(-34 9.4 6)"/>' +
    '<ellipse cx="14.4" cy="5.2" rx="0.9" ry="0.5" fill="#ffffff" fill-opacity="0.80" transform="rotate(-20 14.4 5.2)"/>' +
    '<path d="M12,1.3 L3.2,9.4"  stroke="#ffdbe1" stroke-opacity="0.90" stroke-width="1"   fill="none" stroke-linecap="round"/>' +
    '<path d="M12,1.3 L20.8,9.4" stroke="#ffa6b6" stroke-opacity="0.55" stroke-width="0.8" fill="none" stroke-linecap="round"/>' +
    '<path d="M3.2,9.6 L12,22.7" stroke="#c83048" stroke-opacity="0.50" stroke-width="0.7" fill="none" stroke-linecap="round"/>' +
    '<circle class="gem-spark" cx="16.4" cy="10.6" r="1.15" fill="#fff"/>' +
    '<circle class="gem-spark s2" cx="7.6" cy="10.4" r="0.95" fill="#fff"/>' +
    '<polygon class="gem-shine" points="-3,-3 4,-3 0,27 -7,27" fill="#ffffff" fill-opacity="0.90" clip-path="url(#gemClip)"/>';

  function setLinkTarget(a, href) {
    if (/^https?:/i.test(href)) {
      a.target = "_blank";
      a.rel = "noopener noreferrer";
    }
  }

  document.documentElement.style.setProperty("--glow-hover-opacity", GLOW.hover);
  document.documentElement.style.setProperty("--glow-click-opacity", GLOW.click);
  if (SHOW_HOTSPOT_OUTLINES) stage.classList.add("show-outlines");

  function buildHotspot(spot) {
    const a = document.createElement("a");
    a.className = "hotspot"
      + (spot.type === "door" ? " is-door" : "")
      + (spot.type === "gift" ? " is-gift" : "");
    a.href = spot.href;
    a.setAttribute("aria-label", spot.aria || spot.label || spot.name);
    setLinkTarget(a, spot.href);

    a.style.top    = spot.top    + "%";
    a.style.left   = spot.left   + "%";
    a.style.width  = spot.width  + "%";
    a.style.height = spot.height + "%";

    if (spot.label !== "") {
      const tag = document.createElement("span");
      tag.className = "hotspot-label";
      tag.textContent = spot.label || spot.name;
      a.appendChild(tag);
    }

    let giftFace = null;
    if (spot.type === "gift") {
      giftFace = document.createElement("span");
      giftFace.className = "gift-face";
      giftFace.style.left = (spot.giftLeft != null ? spot.giftLeft : 50) + "%";
      giftFace.style.top  = (spot.giftTop  != null ? spot.giftTop  : 72) + "%";
      if (spot.giftTilt != null) {
        giftFace.style.setProperty("--gift-tilt", spot.giftTilt + "deg");
      }
      giftFace.innerHTML =
        '<span class="gift-word">GIFT</span>' +
        '<svg class="gift-gem" viewBox="0 0 24 24" aria-hidden="true">' + GEM_SVG + '</svg>';
      a.appendChild(giftFace);
    }

    a.addEventListener("click", function (event) {
      event.preventDefault();
      a.classList.add("is-lit");
      if (spot.type === "gift" && giftFace && !reducedMotion) {
        giftFace.classList.remove("shine");
        void giftFace.offsetWidth;
        giftFace.classList.add("shine");
      }
      if (!reducedMotion) {
        releaseDustMotes(a, spot.motes || (spot.type === "gift" ? 5 : 6));
      }
      window.setTimeout(function () {
        a.classList.remove("is-lit");
        if (a.target === "_blank") {
          window.open(spot.href, "_blank", "noopener");
        } else {
          window.location.href = spot.href;
        }
      }, 400);
    });

    return a;
  }

  function releaseDustMotes(hotspotEl, count) {
    for (let i = 0; i < count; i++) {
      const mote = document.createElement("span");
      mote.className = "dust-mote";
      mote.style.left = (15 + Math.random() * 70) + "%";
      mote.style.top  = (35 + Math.random() * 50) + "%";
      mote.style.animationDelay = (Math.random() * 0.25) + "s";
      hotspotEl.appendChild(mote);
      window.setTimeout(function () { mote.remove(); }, 1600);
    }
  }

  function buildMenu() {
    const holder = document.getElementById("menuRows");
    MENU.forEach(function (row) {
      const rowEl = document.createElement("div");
      rowEl.className = "menu-row";
      row.forEach(function (item) {
        const a = document.createElement("a");
        a.className = "menu-btn" + (item.feature ? " menu-feature" : "");
        a.href = item.href;
        a.textContent = item.label;
        a.setAttribute("aria-label", item.aria || item.label);
        setLinkTarget(a, item.href);
        rowEl.appendChild(a);
      });
      holder.appendChild(rowEl);
    });
  }
  buildMenu();

  function buildSocial() {
    const holder = document.getElementById("menuSocial");
    SOCIAL.forEach(function (s) {
      const a = document.createElement("a");
      a.className = "social-btn social-" + (s.kind === "youtube" ? "yt" : s.kind);
      a.href = s.href;
      a.setAttribute("aria-label", s.aria || s.kind);
      setLinkTarget(a, s.href);
      holder.appendChild(a);
    });
  }
  buildSocial();

  function buildFairyDust() {
    if (!SPARKLES.enabled || reducedMotion) return;
    /* スマホでは粒と光輪を小さく・静かに（霊魂化防止） */
    const small = window.matchMedia("(max-width: 600px)").matches;
    const sizeK = small ? 0.55 : 1;
    const peakK = small ? 0.75 : 1;
    const tones = [
      ["255,216,110", "255,170,60"],
      ["255,196,86",  "230,140,40"],
      ["255,232,170", "255,196,120"],
      ["255,184,128", "240,140,80"]
    ];
    for (let i = 0; i < SPARKLES.count; i++) {
      const dust = document.createElement("span");
      dust.className = "fairy-dust" + (Math.random() < 0.35 ? " is-star" : "");
      const tone = tones[Math.floor(Math.random() * tones.length)];

      dust.style.left = (4 + Math.random() * 92) + "%";
      dust.style.top  = (24 + Math.random() * 68) + "%";
      dust.style.setProperty("--c1",   tone[0]);
      dust.style.setProperty("--c2",   tone[1]);
      dust.style.setProperty("--size", ((6 + Math.random() * 8) * sizeK).toFixed(1) + "px");
      dust.style.setProperty("--rise", (-(70 + Math.random() * 130)).toFixed(0) + "px");
      dust.style.setProperty("--sway", (18 + Math.random() * 30).toFixed(0) + "px");
      dust.style.setProperty("--dur",  (7 + Math.random() * 7).toFixed(1) + "s");
      dust.style.setProperty("--tw",   (1.3 + Math.random() * 1.7).toFixed(1) + "s");
      dust.style.setProperty("--delay",(Math.random() * 8).toFixed(1) + "s");
      dust.style.setProperty("--peak", ((0.8 + Math.random() * 0.2) * peakK).toFixed(2));

      const core = document.createElement("i");
      core.className = "fairy-core";
      dust.appendChild(core);
      stage.appendChild(dust);
    }
  }
  buildFairyDust();

  HOTSPOTS.forEach(function (spot) {
    stage.appendChild(buildHotspot(spot));
  });

})();
</script>

</body>
</html>
