<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex &amp; Daisy — Welcome to the House</title>
<meta name="description" content="Welcome to the Alex & Daisy storybook house. Knock on a window to visit a friend.">
<link rel="icon" href="/favicon.ico?v=1" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png?v=1">

<!-- Baloo 2: the menu heading + footer typeface (rounded, friendly, reads
     clearly for kids — chosen to step away from the "hotel front desk" look) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================================
   ALEX & DAISY — STORYBOOK HOUSE HOMEPAGE
   ------------------------------------------------------------
   STYLE NOTES
   - The artwork (house.jpg) is the hero.
   - The page around it is a quiet evening: soft dusk paper,
     a faint vignette, nothing that competes with the house.
   - Hotspots are invisible until hovered/focused, then they
     "wake up" with a warm inner lamp-light glow.
   ============================================================ */

:root{
  /* --- Page palette (quiet dusk paper) --- */
  --page-top:    #d8e0be;   /* soft leaf light */
  --page-bottom: #71845c;   /* quiet moss */
  --paper:       #f3e9d7;   /* warm paper for text panels */
  --ink:         #3b3128;   /* warm ink for text */
  --ink-soft:    #6e5f50;
  --lamp:        #ffd98a;   /* warm window light */
  --lamp-deep:   #ffb95e;   /* deeper amber for click */

  /* --- Glow strength (see also GLOW settings in the JS) --- */
  --glow-hover-opacity: 0.55;
  --glow-click-opacity: 0.9;

  /* --- "VISIT ROOMS" gold sparkle — tune by changing only these numbers ---
     --vr-shimmer-speed : how fast the sheen drifts across (smaller = faster)
     --vr-glow          : warmth/strength of the gold halo (raise alpha = brighter) */
  --vr-shimmer-speed: 5s;
  --vr-glow: rgba(255,210,128,0.55);

  /* --- SEAM: the house picture's lower edge melts into the river
     below it. house.png itself is NEVER touched — we only fade the
     IMAGE element's bottom. Kept HIGH so Alex & Daisy's feet and the
     little dino stay crisp; only the garden strip below them softens,
     and the green water (further down) does the real blending.
     --seam-fade-start : how high the picture stays fully solid.
                         95% = solid to 95% (feet crisp), then a short
                         soft fade. LOWER (90%) = dreamier/softer feet;
                         HIGHER (97%) = feet razor-sharp, harder edge.
     --seam-mist       : the old cream haze on the seam. OFF now (0) so
                         it can't whiten the feet or fog the boundary —
                         the green water blends instead. Try 0.06–0.10
                         only if you want a hair of softening. */
  --seam-fade-start: 96.5%;
  --seam-mist: 0;
  --seam-mist-rise: 150px;
  --seam-mist-height: 280px;
  --seam-mist-width: 130vw;
  --seam-mist-speed: 16s;

  /* ── 水槽の断面（パスA：静止） ──────────────────────────────
     家・Alex・Daisy・小恐竜・GIFT・看板は陸の上に残り、その手前に
     浅い幻想の水があって、こちら側はその水を“断面”で覗いている。
     川を横から見るのではなく、水槽の縁から覗くレイアウト。
     --water-line  : 水際の高さ（家の足元の下）。下げる＝足元と小恐竜を
                     陸（水の上）に残す。上げる＝水際が足元に近づく。
     --water-tail  : メニューの下、フッターまで水中を伸ばす余分の高さ。
     --water-top / -mid / -deep : 水中の縦グラデ。
                     top=水際の明るいエメラルド／mid=メニューが乗る帯
                     （木札化しても沈まないよう“暗くしない”）／deep=底だけ
                     少し暗め。濁らせない＝alpha は控えめ・透明感キープ。
     --wave-amp    : 水際の波打ちの強さ（控えめ。線にしない）。
     --ripple-light / --ripple-dark : 水中の有機的な濃淡。ベタ塗りの段差
                     （ファミコン/マッハバンド）を防ぐためのノイズの濃さ。
     ※ 流れの動きはパスB、泡はパスC で足す。今は“静止の断面”だけ。 */
  /* ★--water-line は “.water を上へ配置する” ためだけに使う（水面を家の足元
     すぐ下に着地させる）。mask や ::before の top には もう使わない＝二重使用
     をやめた。これがループ原因だった。実機で 220〜245px の範囲で微調整。 */
  --water-line:   235px;
  --water-tail:   260px;   /* ★v20の max(420px,70vh) は空きスクロール(void)を増やすだけと判明→260pxに戻す。床が深緑になったので水の下は床が続いて受ける。 */
  /* ★土台は“不透明”＝後ろのぼかし背景を完全遮断（曇りガラス防止）。
     透明感・濁り・薄膜は ③ベール(.water::after)で別に乗せる。 */
  --water-top:    rgb(150,184,158);   /* 水際の明るい sageエメラルド（不透明） */
  --water-mid:    rgb(104,148,118);   /* メニューが乗る帯（暗くしすぎない・不透明） */
  --water-deep:   rgb( 50, 88, 70);   /* 底だけ少し深いティールグリーン（不透明） */
  --wave-amp:     14px;
  --ripple-light: 0.26;
  --ripple-dark:  0.22;
  --bubble-glow:  0.78;
}

*{ box-sizing: border-box; }

html, body{
  margin: 0;
  padding: 0;
}
/* 横スクロール封じ。全幅レイヤー＝水(.water 100vw)と seam-mist
   (.visit-rooms::before 130vw, 今は透明)の左右はみ出しだけを root で
   切り落とす。見えている絵・水・ボタンは1pxも変わらない（切れるのは
   画面外＆透明な部分だけ）。PC(150%)・iPhone 両対応。
   ★要点：hidden を html+body 両方に掛けると、片軸 hidden の副作用で
   もう片軸(縦)が auto に化け、body がスクロール領域になって絶対配置の
   水(下に --water-tail はみ出し)を拾い、縦スクロールバーが二重になる。
   なので body には掛けず、html に clip を使う。clip は scroll コンテナを
   作らない＝縦は1本のまま・横だけ消える。 */
html{
  background: rgb(34,62,48);   /* ★深い水の床（body と同値）。iOS のオーバースクロール枠もこの色にして、最下部に汚い緑/白を出さない。 */
  overflow-x: hidden;   /* 古い環境用フォールバック（html だけなら二重化しない） */
  overflow-x: clip;     /* 本命：scroll コンテナを作らず横だけクリップ */
  /* ★v15 横パン封じ：iPhone は overflow-x:clip だけでは指の横スライドが
     残り、前景(家・メニュー)だけ横に動いて固定背景と剥がれて見えた。
     touch-action で“横パンというジェスチャ自体”を禁止して根元から殺す。
     pan-y = 縦スクロールは許可／pinch-zoom = ピンチ拡大は残す(a11y)。
     overscroll-behavior-x = 横の慣性・バウンドも止める。 */
  touch-action: pan-y pinch-zoom;
  overscroll-behavior-x: none;
}

body{
  min-height: 100vh;
  /* ★v15 横パン封じ（body側）。栞の教訓：body に overflow-x:HIDDEN を掛けると
     片軸hiddenの副作用で縦が auto に化け、body が水の --water-tail を拾って
     縦スクロールバーが二重化する。→ 二重化しない CLIP を使う（clip は縦を
     auto に変えず scroll コンテナも作らない）。ルモ案の方向(body側も止める)は
     採用しつつ、hidden の地雷だけ回避した形。 */
  max-width: 100%;
  overflow-x: clip;
  touch-action: pan-y pinch-zoom;
  overscroll-behavior-x: none;
  background: rgb(34,62,48);    /* ★深い水の床。world-backdrop の家を消した今、布の下に最後まで出るのはここ。moss(#4a563a)は水とケンカする汚い緑だったので、水の底より一段深いティールグリーンに変更。スクロール最下部でも「水が深くなって続く」ように見せる。--water-deep(50,88,70)より敢えて暗い＝明るい床に逆転させない。実機で要微調整。 */
  color: var(--paper);
  font-family: Georgia, "Times New Roman", "Hiragino Mincho ProN", "Yu Mincho", serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 0 48px;
}

/* ============================================================
   THE WORLD BACKDROP (cinematic, CSS-only)
   ------------------------------------------------------------
   A softly enlarged, blurred, slightly darkened echo of the
   SAME house artwork fills the whole landscape screen, so the
   portrait picture sits inside its own world instead of plain
   side bars. It is fixed in place, so the foreground house
   scrolls over it with a natural storybook depth (parallax).
   The image file is set automatically from IMAGE_FILE in the
   EDIT HERE box — you never need to edit it here.
   ============================================================ */
.world-backdrop{
  position: fixed;
  inset: -48px;                     /* oversized so blur has no hard edges */
  z-index: -2;
  background-size: cover;           /* image is set by the script */
  background-position: center 22%;  /* keep the sunny treetops in view */
  filter: blur(18px) brightness(0.82) saturate(0.92);
  transform: scale(1.08);
  pointer-events: none;
}

/* quiet light over the backdrop: a sunlit clearing, leaf-shadow
   dapple at the edges, and a gentle vignette so the eye settles
   on the house. No purple, no neon — only forest light. */
.world-veil{
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    /* soft sun from above the sign */
    radial-gradient(90% 55% at 50% 0%, rgba(255,248,220,0.18), rgba(0,0,0,0) 60%),
    /* large, soft leaf shadows drifting in from the corners */
    radial-gradient(40% 34% at 6% 12%,  rgba(26,36,18,0.34), rgba(0,0,0,0) 70%),
    radial-gradient(42% 36% at 96% 8%,  rgba(26,36,18,0.30), rgba(0,0,0,0) 70%),
    radial-gradient(36% 30% at 88% 78%, rgba(26,36,18,0.26), rgba(0,0,0,0) 70%),
    /* natural vignette toward the edges */
    radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 52%, rgba(22,30,16,0.42) 100%),
    /* grounding shade at the very bottom */
    linear-gradient(180deg, rgba(0,0,0,0) 78%, rgba(20,28,14,0.35) 100%);
}

/* ---------- The stage that holds the artwork ---------- */
/* The window onto the scene: full page width, and it crops away
   whatever part of the (deliberately oversized) artwork doesn't
   fit — like looking at a wide theater stage through the screen. */
.stage-window{
  width: 100%;
  overflow: hidden;
  display: flex;
  justify-content: center;   /* keep the house centered in the crop */
}

.house-stage{
  position: relative;
  flex: none;                /* never shrink: overflow IS the design */
  /* CINEMATIC CROP SIZING:
     The artwork is rendered LARGER than the screen and centered,
     so the forest edges crop away and the house itself stands
     big, with the first view cutting cleanly at the lower row of
     name plaques (Mr. T / Videos / Lumo). Scrolling reveals the
     porch, Alex & Daisy, and the garden signs.

       - 285vh: THE CUT DIAL (the main number to tune).
                285 = the first view ends right at the lower
                name plaques. 260 = smaller house, cut moves
                down past the lower windows. 320 = bigger house,
                cut moves up to the Welcome oval.
       - 170vw: phone guard — on narrow screens the crop never
                goes past 1.7x the screen width, so the house
                always fits nicely on mobile.
       - 100vw: never smaller than the full screen width. */
  width: max(100vw, min(285vh, 170vw));
}

/* The artwork itself. Never cropped, aspect ratio preserved. */
.house-stage img.house-art{
  display: block;
  width: 100%;
  height: auto;
  /* Dissolve ONLY the picture's lower edge into the blurred world
     beneath it, so the house meets the forest with no hard line.
     This masks the image element alone — hotspots, the GIFT word,
     the garnet and every glow live on separate layers and stay crisp.
     house.png is not modified in any way. */
  -webkit-mask-image: linear-gradient(to bottom,
            #000 var(--seam-fade-start), transparent 100%);
          mask-image: linear-gradient(to bottom,
            #000 var(--seam-fade-start), transparent 100%);
}

/* ============================================================
   HOTSPOTS
   - Created by JavaScript from the HOTSPOTS list (see EDIT HERE).
   - Positioned with percentage top/left/width/height so they
     scale perfectly with the image at any screen size.
   ============================================================ */
.hotspot{
  position: absolute;
  display: block;
  border: none;
  background: transparent;
  padding: 0;
  margin: 0;
  cursor: pointer;
  border-radius: 14px;
  /* keep the artwork visible: the glow lives in ::before */
}

/* warm inner lamp-light, invisible until hover/focus */
.hotspot::before{
  content:"";
  position: absolute;
  inset: -6%;
  border-radius: inherit;
  background: radial-gradient(ellipse at 50% 55%,
              rgba(255,217,138,0.95) 0%,
              rgba(255,185,94,0.45) 45%,
              rgba(255,185,94,0.0) 75%);
  mix-blend-mode: screen;       /* light "adds" onto the painting */
  opacity: 0;
  transition: opacity 0.45s ease;
  pointer-events: none;
}

.hotspot:hover::before,
.hotspot:focus-visible::before{
  opacity: var(--glow-hover-opacity);
}

/* doors get a slightly fuller, but still gentle, light */
.hotspot.is-door:hover::before,
.hotspot.is-door:focus-visible::before{
  opacity: calc(var(--glow-hover-opacity) + 0.15);
}

/* click: the light swells for a moment */
.hotspot.is-lit::before{
  opacity: var(--glow-click-opacity) !important;
  transition: opacity 0.18s ease;
}

/* elegant keyboard focus: a thin candle-gold line */
.hotspot:focus{ outline: none; }
.hotspot:focus-visible{
  outline: 2px solid rgba(255,221,160,0.85);
  outline-offset: 3px;
}

/* small floating name tag that appears on hover/focus */
.hotspot .hotspot-label{
  position: absolute;
  left: 50%;
  bottom: calc(100% + 6px);
  transform: translateX(-50%) translateY(4px);
  white-space: nowrap;
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  color: var(--ink);
  background: linear-gradient(180deg, #f8efdd, #eddfc4);
  border: 1px solid rgba(120,95,60,0.35);
  border-radius: 999px;
  padding: 4px 12px;
  opacity: 0;
  transition: opacity 0.35s ease, transform 0.35s ease;
  pointer-events: none;
  box-shadow: 0 2px 8px rgba(30,20,10,0.3);
}
.hotspot:hover .hotspot-label,
.hotspot:focus-visible .hotspot-label{
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ---------- tiny golden dust motes (created on click) ---------- */
.dust-mote{
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: radial-gradient(circle, #ffe9b8 0%, rgba(255,200,110,0.85) 50%, rgba(255,200,110,0) 100%);
  pointer-events: none;
  opacity: 0;
  animation: mote-rise 1.1s ease-out forwards;
}
@keyframes mote-rise{
  0%   { opacity: 0;   transform: translateY(0)    scale(0.6); }
  20%  { opacity: 0.9; }
  100% { opacity: 0;   transform: translateY(-34px) scale(1.1); }
}

/* ---------- fairy dust (created by the script) ----------------------
   Golden-amber magic motes over the scene. Each mote is TWO parts:
     .fairy-dust  = the invisible carrier that drifts upward in a
                    gentle S-shaped sway (zig, zag, zig)
     .fairy-core  = the glowing light itself, which twinkles:
                    swelling, shrinking, breathing its halo
   Round motes mix with little four-point star sparkles.
   All colors/sizes/timings are randomized per mote by the script. */
.fairy-dust{
  position: absolute;
  pointer-events: none;
  opacity: 0;
  animation: fairy-rise var(--dur) ease-in-out var(--delay) infinite;
}
.fairy-core{
  display: block;
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  background: radial-gradient(circle,
              rgba(255,252,235,1)   0%,
              rgba(var(--c1), 0.95) 35%,
              rgba(var(--c2), 0)    75%);
  box-shadow:
    0 0 calc(var(--size) * 0.7) calc(var(--size) * 0.18) rgba(var(--c1), 0.65),
    0 0 calc(var(--size) * 1.6) calc(var(--size) * 0.45) rgba(var(--c2), 0.30);
  animation: fairy-twinkle var(--tw) ease-in-out var(--delay) infinite;
}
/* some motes are tiny four-point stars instead of round glows */
.fairy-dust.is-star .fairy-core{
  border-radius: 0;
  clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%,
                     50% 100%, 39% 61%, 0% 50%, 39% 39%);
  background: radial-gradient(circle,
              rgba(255,253,240,1)   0%,
              rgba(var(--c1), 1)    45%,
              rgba(var(--c2), 0.2)  100%);
}

/* the upward S-curve journey: rise, sway right, sway left, fade */
@keyframes fairy-rise{
  0%   { opacity: 0;
         transform: translate3d(0, 0, 0); }
  10%  { opacity: var(--peak); }
  25%  { transform: translate3d(var(--sway), calc(var(--rise) * 0.25), 0); }
  50%  { transform: translate3d(calc(var(--sway) * -0.8), calc(var(--rise) * 0.5), 0);
         opacity: calc(var(--peak) * 0.85); }
  75%  { transform: translate3d(var(--sway), calc(var(--rise) * 0.75), 0); }
  90%  { opacity: calc(var(--peak) * 0.9); }
  100% { opacity: 0;
         transform: translate3d(0, var(--rise), 0); }
}

/* the heartbeat of the light: swell, brighten, breathe */
@keyframes fairy-twinkle{
  0%, 100% { transform: scale(0.65) rotate(0deg);  filter: brightness(0.9); }
  50%      { transform: scale(1.35) rotate(22deg); filter: brightness(1.9); }
}

/* ============================================================
   SOCIAL ICON ROW — real-world buttons under the menu.
   The red YouTube "candy" button lives here now (it used to
   float over the artwork; the artwork stays art-only).
   YouTube sits on the LEFT; the open space to its right is
   reserved for future icons (Instagram, …) from the SOCIAL
   list in the EDIT HERE box.
   ============================================================ */
.menu-social{
  margin-top: 52px;
  padding-top: 32px;
  border-top: 1px solid rgba(243,233,215,0.25);
  display: flex;
  align-items: center;
  gap: 14px;
  justify-content: flex-start;   /* ← "center" centers the icons */
}
.social-btn{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.social-btn:focus{ outline: none; }
.social-btn:focus-visible{
  outline: 2px solid rgba(255,221,160,0.9);
  outline-offset: 4px;
}

/* the candy-red YouTube button (same friendly look as before) */
.social-yt{
  width: 70px;
  height: 48px;
  border-radius: 14px;
  background: linear-gradient(180deg, #ff5347 0%, #e3170a 55%, #c20d04 100%);
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,0.45),   /* candy highlight   */
    inset 0 -4px 6px rgba(90,0,0,0.35),       /* underside shading */
    0 5px 14px rgba(80,15,8,0.45),            /* drop shadow       */
    0 2px 4px rgba(60,10,5,0.4);
  animation: social-bob 3.6s ease-in-out infinite alternate;
}
/* the white play triangle */
.social-yt::after{
  content:"";
  width: 0;
  height: 0;
  margin-left: 3px;
  border-top:    9px solid transparent;
  border-bottom: 9px solid transparent;
  border-left:   15px solid #fffdf6;
  filter: drop-shadow(0 1px 1px rgba(90,0,0,0.4));
}
/* gentle bobbing, like a sign swaying on a breeze */
@keyframes social-bob{
  from { transform: translateY(-2px) rotate(-1.5deg); }
  to   { transform: translateY( 2px) rotate( 1.5deg); }
}
/* point at it: a happy lift and a warm halo */
.social-yt:hover,
.social-yt:focus-visible{
  animation: none;
  transform: scale(1.12);
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,0.5),
    inset 0 -4px 6px rgba(90,0,0,0.3),
    0 8px 20px rgba(80,15,8,0.5),
    0 0 0 6px rgba(255,224,150,0.35),         /* golden ring  */
    0 0 26px 8px rgba(255,205,120,0.55);      /* warm halo    */
}

/* ---------- debugging aid: outlines for placing hotspots ----------
   Turned on/off with SHOW_HOTSPOT_OUTLINES in the JS EDIT HERE box. */
.show-outlines .hotspot{
  outline: 1px dashed rgba(255,120,120,0.9);
  background: rgba(255,120,120,0.12);
}

/* ============================================================
   "VISIT ROOMS" — the main menu under the picture.
   On phones this is how most visitors actually navigate, so
   the buttons are big (44px+ tall), clear, and arranged in
   friendly rows (set row by row in MENU, in the EDIT HERE box).
   The About button wears the same honey-gold as the painted
   sign — one plank of the artwork stepping down into the menu.
   ============================================================ */
.visit-rooms{
  position: relative;        /* anchor for the soft seam haze below */
  isolation: isolate;        /* keep the water layer (z-index:-1) tucked
                                behind THIS menu, never behind the house */
  width: min(100%, 760px);
  margin-top: 220px;         /* a long quiet gap: feet → river → calm →
                                VISIT ROOMS. The picture-book "間" before
                                the menu. The green water band fills this
                                gap from above (see --water-line). */
  padding: 0 16px;
  text-align: center;
}
/* a soft breath of mist that sits ON the seam — it reaches a little
   way up into the picture's faded edge and a little way down into the
   garden gap, so the join reads as drifting forest haze, not a cut.
   Painted under the heading/buttons; never blocks a tap. Tune with the
   --seam-mist* knobs in :root (set --seam-mist:0 to switch it off). */
.visit-rooms::before{
  content: "";
  position: absolute;
  left: 50%;
  top: calc(-1 * var(--seam-mist-rise));
  width: var(--seam-mist-width);
  height: var(--seam-mist-height);
  transform: translateX(-50%);
  pointer-events: none;
  background: radial-gradient(closest-side,
      rgba(228,224,206, var(--seam-mist)) 0%,
      rgba(228,224,206, 0) 78%);
  filter: blur(20px);
  animation: seamDrift var(--seam-mist-speed) ease-in-out infinite alternate;
}
@keyframes seamDrift{
  from{ transform: translateX(-52%) translateY(-5px) scale(1); }
  to  { transform: translateX(-48%) translateY(5px)  scale(1.05); }
}

/* ============================================================
   THE RIVER WATER — built to read as WATER first (rebuild #2).
   No stripes, no repeating lines. The surface is a "面のゆらぎ":
   organic mottled green made with SVG feTurbulence noise that
   drifts slowly. A vertical MASK shapes the whole band, so the
   green, the ripple noise AND the bubbles all fade out over the
   feet (nothing is ever painted on the feet or the little dino)
   and fade out again into a calm gap before the menu. Bubbles
   rise from the very BOTTOM of the water in gentle columns and
   dissolve before they reach the feet.
     .water     — the green band: flat-ish pond colour + the mask.
     .ripple    — two SVG turbulence layers (light & dark patches)
                  drifting slowly = the surface undulation. The
                  filter is computed ONCE and only TRANSFORM moves,
                  so it stays cheap at 150% zoom. house.png is never
                  filtered — only this separate water layer is.
     .bubble    — an air bubble rising from the floor upward.
   Sits behind the menu (z-index:-1), takes no taps. house.png
   is untouched. Only the water moves — heading & buttons are still.
   ============================================================ */
.water{
  position: absolute;
  left: 50%;
  top: calc(-1 * var(--water-line));
  width: 100vw;
  /* 水際から下、メニューを抜けてフッターの下まで ずっと水中（断面）。
     100% = visit-rooms の高さ。その上に water-line、下に tail を足す。 */
  height: calc(var(--water-line) + 100% + var(--water-tail));
  transform: translateX(-50%);
  z-index: -1;                  /* メニュー（睡蓮の葉）の後ろ */
  pointer-events: none;
  overflow: hidden;
  /* ① 水の土台＝不透明。一番下に多段の縦グラデ（不透明）で背景を完全遮断し、
     その上に「上から差す光のプール」と「底の陰」を薄く重ねて、ベタ塗りの
     “ぺたーっ”を避けつつ奥行きを出す。どの層も不透明ベースの上なので、
     後ろのぼかし背景は一切透けない（曇りガラスにならない）。 */
  background:
      /* ── 3層プラン（家の反射→森の反射→深い水底）の「中身」を司る土台 ──
         旧：泡(白線の素)＋不透明ベタ緑(濁り湯の本丸)。両方とも撤去した。
         新：上〜中段は“透明”＝下層のルモPNG(森と空の反射)がそのまま水の中身として見える。
         深部のみ「直線の蓋」でなく、光の届かない水底へシームレスに暗転して床色
         rgb(34,62,48) に溶け、iOSびろーんを覆う（ジェムの深海）。色変数 --water-* の
         定義は不変。白線・泡・サンレイ・全幅直線帯は無し。 */
      /* ※「光プール」radial は撤去。水面の淡い処理は夢のベール(::before)に集約。 */
      /* 底の方の陰＝深さ（緩いグラデで段差を出さない） */
      radial-gradient(150% 72% at 50% 100%,
          rgba(26, 56, 42, 0.40), rgba(26, 56, 42, 0) 58%),
      /* 最下層＝バグ隠しの深海。上〜90%は透明（PNGの森が水の中身）。残り約10%だけ
         床色へシームレスに暗転＝メニューより下(tail帯)で深くなる。直線の蓋にしない。
         メニューに被って暗くなるようなら 90% をさらに下げる。 */
      linear-gradient(to bottom,
          rgba(34, 62, 48, 0)    0,
          rgba(34, 62, 48, 0)    90%,
          rgba(34, 62, 48, 0.55) 96%,
          rgba(34, 62, 48, 0.9)  100%);
  /* ★マスクは “.water の上端” 基準で短くフェードするだけ＝水面のすぐ下から
     不透明。--water-line には依存しない（二重使用をやめた）。これで上の
     “透明窓”が一気に閉じ、後ろのぼかし背景が透けなくなる＝曇りガラス解消。 */
  --w-mask: linear-gradient(to bottom,
      #000 0,
      #000 10px,
      #000 30px,
      #000 100%);
  -webkit-mask-image: var(--w-mask);
          mask-image: var(--w-mask);
}
/* 波打つ水際 — くっきりした白い線ではなく、水中と同系の緑のやわらかい
   濃淡を波形に重ね、水平の単調さをほどく。強めにぼかして“漫画の線”を
   回避する（白い foam はパスBで別途）。上端に固定高さで乗るので縦に
   伸びない。--wave-amp は :root で控えめに。 */
.water::before{
  /* ★夢の水面ベール（旧：波SVGの“線”名残を撤去）。細い線でなく、水面直下〜VISIT ROOMS
     手前まで届く“広く薄い半透明の光の面”。白・水色・薄緑・透明をゆるく混ぜ、下へ自然に消す。
     z-indexで反射・PNGの上にふわっとかける（薄いので反射もPNGも殺さない）。新レイヤーでは
     ない＝既存の::beforeを転用。線・サンレイ・曇りガラスにはしない。 */
  content:"";
  position:absolute;
  left:0; right:0;
  top: 0;
  height: 520px;            /* 水面直下〜VISIT ROOMS手前まで届く広い帯（下端で透明） */
  z-index: 1;               /* 反射・PNGの上に薄くかぶせる */
  pointer-events:none;
  background: linear-gradient(to bottom,
      rgba(230,243,238, 0.06) 0,      /* ★水際は薄く＝足元の反射の始点を隠さない（ルモ指定） */
      rgba(212,231,239, 0.12) 110px,  /* 少し下でベールが効く（薄い水色） */
      rgba(216,235,223, 0.09) 240px,  /* 薄い緑 */
      rgba(216,235,223, 0.04) 380px,
      rgba(216,235,223, 0)    520px); /* VISIT ROOMS手前で消える */
  filter: blur(6px);        /* 縞・名残を溶かす＝硬い線にしない */
}
/* ④ 水面の主素材（実写の水面写真）──────────────────────────────
   旧：house.png をCSSで上下反転して水面に見せる“パーフェクト・ミラー”。
   →単純反転のパース限界のため【完全撤去】。house.png参照・scaleY(-1)・
   旧反射mask/opacity/position/size はすべて削除（コメントアウト保存もしない）。
   新：実写の水面素材 water_surface_ripple_photo_v1.png（2059×764）を“水面の主素材”
   として敷く。担当は反射の正確さではなく、水面のリアリティ・揺らぎ・光・色。
   幅は前景の家(.house-stage)と同一式にハードリンク＝cover不使用で全端末スケール一致。
   継ぎ目（上の家との水際）は上端maskのフェードイン＋既存の夢ベール(::before)で隠す。
   ※第一段階＝この1枚だけ。house.png由来の反射ガイドはまだ足さない。
   実機で：強すぎ→opacity/blur下げる、薄すぎ→opacity上げる（判定はナコロン）。 */
.water::after{
  content:"";
  position:absolute;
  top: 0;
  left: 50%;
  width: max(100vw, min(285vh, 170vw));                  /* ★家とハードリンク（cover廃止・全端末でスケール一致） */
  height: calc(max(100vw, min(285vh, 170vw)) * 0.3711);  /* 新画像アスペクト 764/2059＝要素にぴったり収まる */
  transform: translateX(-50%);                           /* ★scaleY(-1)削除＝反転しない（もう鏡ではない） */
  pointer-events:none;
  background-image: url("water_surface_ripple_photo_v1.png");
  background-size: 110% auto;                             /* ★1.10倍に拡大（cover不使用／position:center topで上端中央基準＝足元を保持したまま像を大きく） */
  background-position: center top;
  background-repeat: no-repeat;
  filter: blur(2px) brightness(0.97) saturate(0.95);     /* ★軽く馴染ませるだけ（白い霧・灰色の汚れにしない） */
  opacity: 0.8;
  /* 上端(=家との継ぎ目/水際)はごく短く薄フェード＝接合線だけ隠す。足元反射(上端すぐ下)は
     消さずに見せる（ナコロン：接合線は隠す・でも足元は消さない）。中段で水面をしっかり見せ、
     下端で透明に消して中層PNG・水底へ溶かす。線・サンレイ・全幅一様帯は無し。 */
  -webkit-mask-image: linear-gradient(to bottom,
      transparent      0,
      rgba(0,0,0,0.70) 16px,
      rgba(0,0,0,0.92) 56px,
      rgba(0,0,0,0.92) 64%,
      transparent      100%);
          mask-image: linear-gradient(to bottom,
      transparent      0,
      rgba(0,0,0,0.70) 16px,
      rgba(0,0,0,0.92) 56px,
      rgba(0,0,0,0.92) 64%,
      transparent      100%);
}
/* ④.5 中層＝水中の反射画像（空と森が水面下に映る）──────────────────
   不透明土台(④)の上・既存rippleの手前に敷く専用レイヤー。★水面エッジでは
   ない＝下の大きな緑エリアを「冥界/背景板」から「空と森が映る浅い水」へ
   近づける。中身は別素材 water_reflection_sky_forest.png（house.png の加工
   ではない・家/Alex/Daisy/GIFT/卵/看板/文字なし・空/雲/緑/黄緑/金/ティール
   の抽象反射）。house.png や .world-backdrop は反射のネタ元にしない。
   不透明土台の上に乗るので後ろのぼかし背景は透けない（曇りガラスに戻らない）。
   今は静止（動きは後工程）。実機で：強すぎ→opacity下げる／弱すぎ→上げる。
   mask で水際を溶かす（自前mask＋.water上端maskの二重がけでなじむ）。
   色ロック(--water-*)には一切触れていない。*/
.water-reflection-image{
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image: url("water_reflection_sky_forest.png.png");  /* ★実ファイルは二重拡張子(.png.png)。旧 .png(単) は404でPNGがずっと表示されず＝緑のまま見えた本当の原因。これは美術調整でなくファイル名修正。 */
  background-size: cover;
  background-position: center top;
  background-repeat: no-repeat;
  opacity: 0.42;            /* ★ルモ指定：下地として少し弱める（壁紙化を避ける）。完全には消さない＝中〜下で森と空の色が見える。 */
  filter: saturate(0.72) brightness(0.92) blur(1.6px);
  /* 上は反射が勝つ・中〜下でPNGの森色が出る。 */
  -webkit-mask-image: linear-gradient(to bottom,
      rgba(0,0,0,0.05) 0,
      rgba(0,0,0,0.24) 120px,
      rgba(0,0,0,0.50) 260px,
      rgba(0,0,0,0.62) 100%);
          mask-image: linear-gradient(to bottom,
      rgba(0,0,0,0.05) 0,
      rgba(0,0,0,0.24) 120px,
      rgba(0,0,0,0.50) 260px,
      rgba(0,0,0,0.62) 100%);
}
/* the two drifting noise layers = the surface "面のゆらぎ".
   Oversized so the slow drift never exposes an edge. */
.ripple{
  position: absolute;
  left: -20%; top: -10%;
  width: 140%; height: 120%;
  pointer-events: none;
  /* パスA = 静止。流れ（ドリフト）はパスB で足す。今はノイズを薄く敷いて
     水中の有機的な濃淡を作り、ベタ塗りの段差（マッハバンド）を防ぐだけ。 */
}
.ripple-a{ opacity: var(--ripple-light, 0.26); }
.ripple-b{ opacity: var(--ripple-dark, 0.22); }
@keyframes rippleA{
  from{ transform: translate3d(0, 0, 0); }
  to  { transform: translate3d(-4%, 3%, 0); }   /* lazy, organic drift */
}
@keyframes rippleB{
  from{ transform: translate3d(0, 0, 0); }
  to  { transform: translate3d(4%, -2%, 0); }   /* the other way = it morphs */
}
/* an air bubble rising from the FLOOR of the water upward. It is born
   at bottom:0 (the depths, where the mask is still transparent) and
   becomes visible as it climbs into the green, dissolving before it
   reaches the feet. Travels a real PIXEL distance (--rise). */
.bubble{
  position: absolute;
  left: 0;
  bottom: var(--b-bottom, 0%);   /* the water floor */
  width: var(--bsize);
  height: var(--bsize);
  border-radius: 50%;
  background: radial-gradient(circle at 38% 32%,
      rgba(244,250,242, var(--bubble-glow)) 0%,
      rgba(214,232,216, calc(var(--bubble-glow) * 0.40)) 48%,
      rgba(200,214,202, 0) 72%);
  opacity: 0;
  will-change: transform, opacity;
  animation: bubbleRise var(--bdur) ease-in forwards;
}
@keyframes bubbleRise{
  0%  { transform: translate(0, 0) scale(0.6); opacity: 0; }
  10% { opacity: 1; }
  55% { transform: translate(var(--sway), calc(var(--rise) * -0.55)) scale(1); }
  85% { transform: translate(calc(var(--sway) * -0.6), calc(var(--rise) * -0.85)) scale(1.05); opacity: 0.9; }
  100%{ transform: translate(0, calc(var(--rise) * -1)) scale(1.1); opacity: 0; }
}

.visit-rooms h2{
  font-family: 'Baloo 2', system-ui, -apple-system, sans-serif;
  font-size: clamp(1.7rem, 5.2vw, 2.5rem);
  font-weight: 700;
  letter-spacing: 0.10em;       /* heavy face, so keep tracking modest */
  margin: 0 0 40px;             /* a quiet pause under the heading */

  /* gold gradient text with a sheen that slowly drifts across */
  background: linear-gradient(100deg,
      #e6bd63 0%, #f4d896 26%, #fff7e6 46%,
      #f4d896 62%, #ddac52 100%);
  background-size: 220% auto;
  -webkit-background-clip: text;
          background-clip: text;
  -webkit-text-fill-color: transparent;
          color: transparent;
  /* depth + warm halo (replaces the old flat text-shadow, which can't
     show through clipped text) */
  filter: drop-shadow(0 1px 1px rgba(54,36,10,0.6))
          drop-shadow(0 0 14px var(--vr-glow));
  animation: vrShimmer var(--vr-shimmer-speed) linear infinite;
}
@keyframes vrShimmer{
  to{ background-position: 220% center; }
}
.visit-rooms h2::before,
.visit-rooms h2::after{
  content:"\2726";                 /* ✦ — same star the gold About button uses */
  -webkit-text-fill-color: initial;
  color: rgba(255,224,150,0.92);
  text-shadow: 0 0 8px rgba(255,196,110,0.6);
  margin: 0 16px;
  font-size: 0.62em;
  vertical-align: 0.16em;
}

/* one .menu-row per line of buttons — set apart like plaques
   spaced out along a garden path, not packed in a panel */
.menu-row{
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  margin: 0 0 26px;          /* generous step between rows */
}

/* the standard worn-paper button — bigger and easy to tap */
.menu-btn{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 46px;
  padding: 10px 20px;
  text-decoration: none;
  color: var(--ink);
  background: linear-gradient(180deg, rgba(248,238,219,0.96) 0%, rgba(229,213,182,0.96) 100%);
  border: 1px solid rgba(110,88,56,0.4);
  border-bottom-width: 3px;
  border-radius: 12px;
  font-size: 0.95rem;
  letter-spacing: 0.06em;
  box-shadow: 0 2px 7px rgba(15,22,10,0.4);
  transition: box-shadow 0.3s ease, transform 0.3s ease, background 0.3s ease;
}
.menu-btn:hover,
.menu-btn:focus-visible{
  background: linear-gradient(180deg, #fff4dd 0%, #f1e0bf 100%);
  box-shadow: 0 4px 12px rgba(255,190,110,0.4);
  transform: translateY(-1px);
}
.menu-btn:focus{ outline: none; }
.menu-btn:focus-visible{
  outline: 2px solid rgba(255,221,160,0.9);
  outline-offset: 2px;
}

/* THE ABOUT BUTTON — honey-gold, like the big painted sign */
.menu-btn.menu-feature{
  min-height: 54px;
  padding: 12px 26px;
  font-size: 1.12rem;
  letter-spacing: 0.09em;
  color: #45300f;
  background: linear-gradient(180deg, #fadc82 0%, #eeb14a 52%, #cf8d2b 100%);
  border-color: rgba(99,64,18,0.6);
  border-radius: 14px;
  text-shadow: 0 1px 0 rgba(255,243,200,0.65);
  box-shadow:
    inset 0 2px 2px rgba(255,246,205,0.8),    /* sunlit top edge   */
    inset 0 -3px 5px rgba(125,75,15,0.3),     /* carved underside  */
    0 3px 12px rgba(15,22,10,0.45);
}
/* little sparkles on both sides (decorative only) */
.menu-btn.menu-feature::before,
.menu-btn.menu-feature::after{
  content:"\2726";                 /* ✦ */
  font-size: 0.78em;
  color: rgba(110,68,14,0.9);
}
.menu-btn.menu-feature::before{ margin-right: 12px; }
.menu-btn.menu-feature::after { margin-left: 12px; }
.menu-btn.menu-feature:hover,
.menu-btn.menu-feature:focus-visible{
  background: linear-gradient(180deg, #ffe79b 0%, #f7bf5c 52%, #db9834 100%);
  box-shadow:
    inset 0 2px 2px rgba(255,248,215,0.85),
    inset 0 -3px 5px rgba(125,75,15,0.28),
    0 5px 16px rgba(255,190,110,0.5);
  transform: translateY(-1px);
}

/* ---------- footer whisper ---------- */
.page-footer{
  margin-top: 72px;
  font-family: 'Baloo 2', system-ui, -apple-system, sans-serif;
  font-size: clamp(0.98rem, 2.7vw, 1.18rem);
  font-weight: 500;
  letter-spacing: 0.05em;
  color: rgba(250,244,230,0.94);   /* a touch brighter so it reads cleanly */
  text-shadow: 0 1px 3px rgba(20,28,14,0.92), 0 0 10px rgba(20,28,14,0.45);
  font-style: normal;              /* drop the script-y italic */
  text-align: center;
}

/* ============================================================
   REDUCED MOTION
   - No dust motes, no label slide; glow becomes a simple fade.
   ============================================================ */
@media (prefers-reduced-motion: reduce){
  .dust-mote{ display: none !important; }
  .fairy-dust{ display: none !important; }
  .social-btn{ animation: none; }
  .visit-rooms h2{ animation: none; background-position: 50% center; }
  .visit-rooms::before{ animation: none; }
  /* still water: keep the green band so the composition still reads,
     but stop every motion. JS skips bubbles already. */
  .ripple{ animation: none; }
  .hotspot::before,
  .hotspot .hotspot-label,
  .menu-btn{
    transition: opacity 0.2s linear;
    transform: none !important;
  }
}

/* ---------- small screens ---------- */
@media (max-width: 600px){
  body{ padding: 0 0 48px; }
  .hotspot .hotspot-label{ font-size: 0.65rem; padding: 3px 9px; }

  /* MOBILE — the menu is a garden of plaques, not a packed panel.
     Narrow the group and center it so the forest shows on both
     sides, and keep the generous vertical air (scrolling is fine). */
  .visit-rooms{
    width: 88vw;
    max-width: 360px;
    margin-left: auto;
    margin-right: auto;
    margin-top: 150px;         /* the quiet gap on mobile too: feet →
                                  river → calm → menu (scrolling is fine) */
    --water-line: 165px;       /* モバイルは家〜メニューの間が狭いぶん水際も上へ */
    --water-tail: 240px;   /* ★max(720px,110vh)が「びよーん」の主因→240pxに戻す。水の下は深緑の床が受ける。 */
    padding: 0;
  }
  .visit-rooms h2{ margin-bottom: 34px; }
  .menu-row{ margin-bottom: 22px; }
  /* buttons size to their content again (no full-row stretch);
     min-height in the base CSS keeps them comfortably tappable */
  .menu-btn{ flex: 0 1 auto; }
  .menu-social{ margin-top: 46px; padding-top: 30px; }
  .page-footer{ margin-top: 60px; }

  /* on phones the house fills the screen, so the backdrop barely
     shows — use a cheaper blur to keep scrolling silky */
  .world-backdrop{ filter: blur(10px) brightness(0.82); }
}
/* ============================================================
   GIFT BOX  (the little wooden treasure chest, lower right)
   ------------------------------------------------------------
   The chest is a hotspot that leads to gift.html. The word GIFT
   and a small garnet are laid on the chest's blank wooden panel
   with CSS / SVG only — the artwork (house.png) is never touched.
   Position is tuned with giftLeft / giftTop / giftTilt in the
   EDIT HERE box, so it can be nudged in one line.
   ============================================================ */
.hotspot.is-gift{ container-type: inline-size; }

/* the face laid on the wooden panel: GIFT stacked over the garnet.
   The whole face is rotated to sit flat on the chest's perspective. */
.gift-face{
  position: absolute;
  left: 50%;
  top: 71%;
  transform: translate(-50%, -50%) rotate(var(--gift-tilt, 0deg));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4cqw;
  pointer-events: none;          /* the whole chest handles the click */
  text-align: center;
  line-height: 1;
}

/* GIFT — carved / branded into the tan wood of the panel */
.gift-word{
  font-family: Georgia, "Times New Roman", "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-weight: 700;
  font-size: 17cqw;              /* scales with the chest, not the screen */
  letter-spacing: 0.16em;
  margin-right: -0.16em;
  color: #3a2414;               /* burnt-umber carving */
  text-shadow:
     0 1px 0   rgba(255,243,214,0.40),
     0 -1px 1px rgba(36,18,8,0.55);
  transition: color .35s ease, text-shadow .35s ease;
}

/* the garnet: a faceted gem in SVG — bigger now, with a faint,
   slow twinkle so it catches the eye ("what's that?") */
.gift-gem{
  display: block;
  width: 20cqw;                  /* a touch larger — easy to spot */
  height: auto;
  overflow: visible;
  filter:
     drop-shadow(0 1px 2px rgba(20,4,8,0.60))
     drop-shadow(0 0 5px rgba(235,55,75,0.85));
  /* the gem glows like a lit crystal and pulses — clearly visible */
  animation: gemBreath 2.4s ease-in-out infinite;
}
@keyframes gemBreath{
  0%, 100% { filter:
     drop-shadow(0 1px 2px rgba(20,4,8,0.60))
     drop-shadow(0 0 4px rgba(235,55,75,0.70)); }
  50%      { filter:
     drop-shadow(0 1px 2px rgba(20,4,8,0.60))
     drop-shadow(0 0 12px rgba(255,80,100,1))
     drop-shadow(0 0 22px rgba(235,55,75,0.55)); }
}
/* a wide gloss bar sweeps across the gem every couple of seconds —
   a real moving reflection, not a whisper */
.gift-gem .gem-shine{
  opacity: 0;
  animation: gemFlash 2s ease-in-out infinite;
}
@keyframes gemFlash{
  0%, 50%, 100% { opacity: 0;    transform: translateX(-4px); }
  62%           { opacity: 0.95; }
  78%           { opacity: 0;    transform: translateX(26px); }
}
.gift-gem .gem-spark{
  transform-origin: center;
  transform-box: fill-box;
  animation: gemTwinkle 1.5s ease-in-out infinite;
}
.gift-gem .gem-spark.s2{ animation-delay: 0.7s; }
@keyframes gemTwinkle{
  0%, 100% { opacity: 0.35; transform: scale(0.6);  }
  50%      { opacity: 1;    transform: scale(1.45); }
}

/* wake-up: the word warms and a single bright sweep crosses the
   garnet on hover / focus / tap */
.hotspot.is-gift:hover .gift-word,
.hotspot.is-gift:focus-visible .gift-word,
.hotspot.is-gift.is-lit .gift-word{
  color: #2c1a0d;
  text-shadow:
     0 1px 0   rgba(255,247,224,0.55),
     0 -1px 1px rgba(28,12,4,0.6),
     0 0 6cqw  rgba(255,210,140,0.35);
}
.hotspot.is-gift:hover  .gift-gem .gem-shine,
.hotspot.is-gift:focus-visible .gift-gem .gem-shine,
.gift-face.shine .gem-shine{
  animation: gemSweep 0.9s ease-out 1;
}
@keyframes gemSweep{
  0%   { opacity: 0;    transform: translateX(0); }
  16%  { opacity: 0.9;  }
  100% { opacity: 0;    transform: translateX(26px); }
}

@media (prefers-reduced-motion: reduce){
  .hotspot.is-gift .gift-word{ transition: none; }
  .gift-gem{ animation: none !important; }
  .gift-gem .gem-spark{ animation: none !important; opacity: 0.5; }
  .gift-gem .gem-shine{ animation: none !important; opacity: 0; }
}

<script>

const GLOW = {

/* 3a) FAIRY DUST ---------------------------------------------------
      Golden-amber magic motes that twinkle, breathe, and sway

const SPARKLES = {

};


/* 4) THE HOTSPOTS ------------------------------------------------
      One entry per clickable spot on the picture.

      top / left / width / height are PERCENTAGES of the image,

        - top:  distance from the TOP edge of the picture
        - left: distance from the LEFT edge of the picture

      HOW TO ADJUST A POSITION:
        a) set SHOW_HOTSPOT_OUTLINES = true (above)
        b) open the page and look at the red boxes
        c) nudge the numbers until each box sits on its window

const HOTSPOTS = [
  {

    label: "Alex",
    aria: "Visit Alex's room",
    href: "alex.html",
    type: "window",
    top: 37.5, left: 36.2, width: 6.4, height: 15.5
  },
  {

    label: "Daisy",
    aria: "Visit Daisy's room",
    href: "daisy.html",
    type: "window",
    top: 34.5, left: 47.4, width: 6,   height: 17
  },
  {
    name: "Giga window",
    label: "Giga",
    aria: "Visit Giga's room",
    href: "giga.html",
    type: "window",
    top: 37.5, left: 57.7, width: 6.2, height: 15.5
  },
  {
    name: "Mr. T window",
    label: "Mr. T",
    aria: "Visit Mr. T's room",
    href: "mr-t.html",
    type: "window",
    top: 60.5, left: 35.6, width: 7,   height: 17
  },
  {

    label: "Lumo",
    aria: "Visit Lumo's room",
    href: "lumo.html",
    type: "window",

    label: "Videos",

  {

const MENU = [
  [ { label: "About Alex & Daisy", href: "about.html",
      aria: "About Alex and Daisy", feature: true } ],

  [ { label: "Alex",  href: "alex.html",  aria: "Visit Alex's room"  },

  [ { label: "Mr. T", href: "mr-t.html", aria: "Visit Mr. T's room" },

/* 6) SOCIAL ICONS ------------------------------------------------
      The icon row under the menu. YouTube sits on the left; the

      (Instagram, …). "kind" picks the icon look — only

const SOCIAL = [
  { kind: "youtube",
    href: "https://www.youtube.com/@alexanddaisy2022",
    aria: "Alex and Daisy on YouTube" }
];

/* ╔══════════════════════════════════════════════════════════════╗
   ║   END OF "EDIT HERE".                                        ║
   ║   Below is the ENGINE — it just builds the page from the     ║
   ║   list above. You normally never need to change it.          ║
   ╚══════════════════════════════════════════════════════════════╝ */


/* ----------------------- THE ENGINE ----------------------------- */
(function () {
  "use strict";

  const stage    = document.getElementById("houseStage");
  const art      = document.getElementById("houseArt");

  const reducedMotion =
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* --- the garnet on the gift box: a faceted gem drawn in SVG.
         Light core fading to a dark pavilion gives it depth (it
         reads as translucent, not a flat stone); a few facets catch
         light, three tiny sparkles twinkle slowly, and a bright bar
         sweeps across on hover / tap. Only one gem exists, so the
         gradient / clip ids are safe to hard-code. --- */
  const GEM_SVG =
    '<defs>' +
      '<radialGradient id="gemBody" cx="42%" cy="30%" r="78%">' +
        '<stop offset="0%" stop-color="#ff5e76"/>' +
        '<stop offset="34%" stop-color="#d11d38"/>' +
        '<stop offset="100%" stop-color="#530b14"/>' +
      '</radialGradient>' +
      '<linearGradient id="gemGloss" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="#ffe3e8" stop-opacity="0.95"/>' +
        '<stop offset="55%" stop-color="#ff9aac" stop-opacity="0.12"/>' +
        '<stop offset="100%" stop-color="#ff9aac" stop-opacity="0"/>' +
      '</linearGradient>' +
      '<clipPath id="gemClip"><polygon points="12,1 21,9.5 12,23 3,9.5"/></clipPath>' +
    '</defs>' +
    /* glassy body: bright core fading to deep red = crystal depth */
    '<polygon points="12,1 21,9.5 12,23 3,9.5" fill="url(#gemBody)"/>' +
    /* deep pavilion shadows (lower half) for 3-D glass volume */
    '<polygon points="3,9.5 12,11 12,23"  fill="#2c0710" fill-opacity="0.62"/>' +
    '<polygon points="21,9.5 12,11 12,23" fill="#1c050c" fill-opacity="0.66"/>' +
    /* faint crown facet seams */
    '<polygon points="12,1 8.6,8 12,4"  fill="#ff7a90" fill-opacity="0.45"/>' +
    '<polygon points="12,1 12,4 15.4,8" fill="#7c1622" fill-opacity="0.40"/>' +
    /* BIG top gloss — the sheen that reads as polished crystal */
    '<polygon points="12,1.5 18.6,8.6 12,11 5.4,8.6" fill="url(#gemGloss)"/>' +
    /* bold specular highlights, upper-left (the "wet" shine) */
    '<ellipse cx="9.4" cy="6" rx="2.7" ry="1.5" fill="#ffffff" fill-opacity="0.92" transform="rotate(-34 9.4 6)"/>' +
    '<ellipse cx="14.4" cy="5.2" rx="0.9" ry="0.5" fill="#ffffff" fill-opacity="0.80" transform="rotate(-20 14.4 5.2)"/>' +
    /* rim light along the edges */
    '<path d="M12,1.3 L3.2,9.4"  stroke="#ffdbe1" stroke-opacity="0.90" stroke-width="1"   fill="none" stroke-linecap="round"/>' +
    '<path d="M12,1.3 L20.8,9.4" stroke="#ffa6b6" stroke-opacity="0.55" stroke-width="0.8" fill="none" stroke-linecap="round"/>' +
    '<path d="M3.2,9.6 L12,22.7" stroke="#c83048" stroke-opacity="0.50" stroke-width="0.7" fill="none" stroke-linecap="round"/>' +
    /* two bright sparkle dots (bigger, fewer than the old salt grains) */
    '<circle class="gem-spark" cx="16.4" cy="10.6" r="1.15" fill="#fff"/>' +
    '<circle class="gem-spark s2" cx="7.6" cy="10.4" r="0.95" fill="#fff"/>' +
    /* a wide diagonal gloss bar that sweeps across — moving reflection */
    '<polygon class="gem-shine" points="-3,-3 4,-3 0,27 -7,27" fill="#ffffff" fill-opacity="0.90" clip-path="url(#gemClip)"/>';

  /* links that start with http(s) open in a new tab */
  function setLinkTarget(a, href) {
    if (/^https?:/i.test(href)) {
      a.target = "_blank";
      a.rel = "noopener noreferrer";
    }
  }

  /* apply the simple settings from EDIT HERE */
  art.src = IMAGE_FILE;
  /* the blurred world behind the house uses the SAME image */
  /* ★パス1（家のお化け切り分けテスト）: worldBackdrop に house.png を流すのを停止。
     前景の art.src（家本体）は不変。スマホ最下部からお化けが消えるか実機確認用。
     戻すとき＝下2行のコメントを外すだけ。森の空気は .world-veil が引き続き担当。 */
  /* document.getElementById("worldBackdrop").style.backgroundImage =
    'url("' + IMAGE_FILE + '")'; */
  document.documentElement.style.setProperty("--glow-hover-opacity", GLOW.hover);
  document.documentElement.style.setProperty("--glow-click-opacity", GLOW.click);
  if (SHOW_HOTSPOT_OUTLINES) stage.classList.add("show-outlines");

  /* --- build one hotspot link on the picture --- */
  function buildHotspot(spot) {
    const a = document.createElement("a");
    a.className = "hotspot"
      + (spot.type === "door" ? " is-door" : "")
      + (spot.type === "gift" ? " is-gift" : "");
    a.href = spot.href;
    a.setAttribute("aria-label", spot.aria || spot.label || spot.name);
    setLinkTarget(a, spot.href);

    /* percentage positioning — scales with the image */
    a.style.top    = spot.top    + "%";
    a.style.left   = spot.left   + "%";
    a.style.width  = spot.width  + "%";
    a.style.height = spot.height + "%";

    /* the floating name tag (a hotspot with label: "" gets none) */
    if (spot.label !== "") {
      const tag = document.createElement("span");
      tag.className = "hotspot-label";
      tag.textContent = spot.label || spot.name;
      a.appendChild(tag);
    }

    /* gift box: lay GIFT + the garnet on the chest's wooden panel */
    let giftFace = null;
    if (spot.type === "gift") {
      giftFace = document.createElement("span");
      giftFace.className = "gift-face";
      giftFace.style.left = (spot.giftLeft != null ? spot.giftLeft : 50) + "%";
      giftFace.style.top  = (spot.giftTop  != null ? spot.giftTop  : 72) + "%";
      if (spot.giftTilt != null) {
        giftFace.style.setProperty("--gift-tilt", spot.giftTilt + "deg");
      }
      giftFace.innerHTML =
        '<span class="gift-word">GIFT</span>' +
        '<svg class="gift-gem" viewBox="0 0 24 24" aria-hidden="true">' + GEM_SVG + '</svg>';
      a.appendChild(giftFace);
    }

    /* click: glow swell + a few dust motes + 0.4s pause, then go.
       The gift box gives the garnet one bright sweep on the way. */
    a.addEventListener("click", function (event) {
      event.preventDefault();
      a.classList.add("is-lit");
      if (spot.type === "gift" && giftFace && !reducedMotion) {
        giftFace.classList.remove("shine");
        void giftFace.offsetWidth;          /* restart the light sweep */
        giftFace.classList.add("shine");
      }
      if (!reducedMotion) {
        releaseDustMotes(a, spot.motes || (spot.type === "gift" ? 5 : 6));
      }
      window.setTimeout(function () {
        a.classList.remove("is-lit");
        if (a.target === "_blank") {
          window.open(spot.href, "_blank", "noopener");
        } else {
          window.location.href = spot.href;
        }
      }, 400);
    });

    return a;
  }

  /* --- a few tiny golden dust motes drifting up from the spot --- */
  function releaseDustMotes(hotspotEl, count) {
    for (let i = 0; i < count; i++) {
      const mote = document.createElement("span");
      mote.className = "dust-mote";
      /* scatter inside the hotspot */
      mote.style.left = (15 + Math.random() * 70) + "%";
      mote.style.top  = (35 + Math.random() * 50) + "%";
      mote.style.animationDelay = (Math.random() * 0.25) + "s";
      hotspotEl.appendChild(mote);
      /* clean up after the little drift finishes */
      window.setTimeout(function () { mote.remove(); }, 1600);
    }
  }

  /* --- build the VISIT ROOMS menu from the MENU rows --- */
  function buildMenu() {
    const holder = document.getElementById("menuRows");
    MENU.forEach(function (row) {
      const rowEl = document.createElement("div");
      rowEl.className = "menu-row";
      row.forEach(function (item) {
        const a = document.createElement("a");
        a.className = "menu-btn" + (item.feature ? " menu-feature" : "");
        a.href = item.href;
        a.textContent = item.label;
        a.setAttribute("aria-label", item.aria || item.label);
        setLinkTarget(a, item.href);
        rowEl.appendChild(a);
      });
      holder.appendChild(rowEl);
    });
  }
  buildMenu();

  /* --- build the social icon row from the SOCIAL list --- */
  function buildSocial() {
    const holder = document.getElementById("menuSocial");
    SOCIAL.forEach(function (s) {
      const a = document.createElement("a");
      a.className = "social-btn social-" + (s.kind === "youtube" ? "yt" : s.kind);
      a.href = s.href;
      a.setAttribute("aria-label", s.aria || s.kind);
      setLinkTarget(a, s.href);
      holder.appendChild(a);
    });
  }
  buildSocial();

  /* --- fairy dust drifting over the scene --- */
  function buildFairyDust() {
    if (!SPARKLES.enabled || reducedMotion) return;
    /* warm storybook palette: [inner glow, outer halo] as "r,g,b" */
    const tones = [
      ["255,216,110", "255,170,60"],   /* gold      */
      ["255,196,86",  "230,140,40"],   /* amber     */
      ["255,232,170", "255,196,120"],  /* candle    */
      ["255,184,128", "240,140,80"]    /* peach ember */
    ];
    for (let i = 0; i < SPARKLES.count; i++) {
      const dust = document.createElement("span");
      dust.className = "fairy-dust" + (Math.random() < 0.35 ? " is-star" : "");
      const tone = tones[Math.floor(Math.random() * tones.length)];

      dust.style.left = (4 + Math.random() * 92) + "%";
      dust.style.top  = (24 + Math.random() * 68) + "%";
      dust.style.setProperty("--c1",   tone[0]);
      dust.style.setProperty("--c2",   tone[1]);
      dust.style.setProperty("--size", (6 + Math.random() * 8).toFixed(0) + "px");
      dust.style.setProperty("--rise", (-(70 + Math.random() * 130)).toFixed(0) + "px");
      dust.style.setProperty("--sway", (18 + Math.random() * 30).toFixed(0) + "px");
      dust.style.setProperty("--dur",  (7 + Math.random() * 7).toFixed(1) + "s");
      dust.style.setProperty("--tw",   (1.3 + Math.random() * 1.7).toFixed(1) + "s");
      dust.style.setProperty("--delay",(Math.random() * 8).toFixed(1) + "s");
      dust.style.setProperty("--peak", (0.8 + Math.random() * 0.2).toFixed(2));

      const core = document.createElement("i");
      core.className = "fairy-core";
      dust.appendChild(core);
      stage.appendChild(dust);
    }
  }
  buildFairyDust();

  /* --- build everything from the HOTSPOTS list --- */
  HOTSPOTS.forEach(function (spot) {
    stage.appendChild(buildHotspot(spot));
  });

  /* ============================================================
     THE RIVER — air bubbles rising from the FLOOR in gentle columns.
     • Born at the bottom of the water (bottom:0), they climb upward
       and dissolve before they reach the feet (the band's mask fades
       them in from the depths and out near the surface).
     • They rise near a few fixed "vents" (with a little wobble) so
       they read as streams from the bottom, like the reference — not
       scattered dots, and not a fizzy onsen.
     • Tune the FEEL here; the LOOK lives in the :root water knobs. */
  const WATER = {
    enabled:    false,  // パスA = 泡なし（静止）。パスC で true に戻す
    maxAtOnce:  6,      // how many can be climbing at once (DOWN = calmer)
    gapMin:     0.7,    // shortest pause between releases (seconds)
    gapMax:     2.2,    // longest pause
    vents:      [0.30, 0.46, 0.62, 0.74],  // column positions (0–1 across)
    catchAt:    0.4     // first bubble after the area scrolls into view
  };

  const water = document.getElementById("waterLayer");
  if (water && !reducedMotion && WATER.enabled) {
    let alive = 0, started = false;

    function spawnBubble() {
      if (alive >= WATER.maxAtOnce) return;
      const b = document.createElement("span");
      b.className = "bubble";
      // pick a vent column, then wobble a little around it → a stream
      const vent = WATER.vents[(Math.random() * WATER.vents.length) | 0];
      const x = Math.min(0.94, Math.max(0.06, vent + (Math.random() - 0.5) * 0.07));
      b.style.left = (x * 100).toFixed(1) + "%";
      // varied sizes, biased small (a few bigger ones rise among them)
      const big = Math.random() < 0.22;
      b.style.setProperty("--bsize",
        (big ? 16 + Math.random() * 8 : 7 + Math.random() * 8).toFixed(0) + "px");
      b.style.setProperty("--bdur", (5.5 + Math.random() * 4).toFixed(1) + "s");
      // born at the floor, climbing a real pixel distance up through the
      // green; the mask dissolves them before they reach the feet
      b.style.setProperty("--b-bottom", (Math.random() * 10).toFixed(0) + "%");
      b.style.setProperty("--rise", (210 + Math.random() * 120).toFixed(0) + "px");
      b.style.setProperty("--sway",
        ((Math.random() < 0.5 ? -1 : 1) * (6 + Math.random() * 10)).toFixed(0) + "px");
      alive++;
      b.addEventListener("animationend", function () { b.remove(); alive--; });
      water.appendChild(b);
    }

    function drift() {                       // the gentle, unpredictable pace
      spawnBubble();
      if (Math.random() < 0.35) spawnBubble();   // occasional little cluster
      const gap = WATER.gapMin + Math.random() * (WATER.gapMax - WATER.gapMin);
      setTimeout(drift, gap * 1000);
    }

    const io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting && !started) {
          started = true;
          setTimeout(spawnBubble, WATER.catchAt * 1000);   // first one quickly
          setTimeout(drift, (WATER.catchAt + 1.0) * 1000);  // then the stream
        }
      });
    }, { threshold: 0.35 });
    io.observe(water);
  }
})();
</script>
