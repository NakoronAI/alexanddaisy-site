<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex — Alex &amp; Daisy</title>
<meta name="description" content="Alex's room in the house in the woods.">
<link rel="icon" href="/favicon.ico?v=1" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png?v=1">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1">

<style>
/* ============================================================
   ROOM TEMPLATE  —  the shared skeleton for every character room
   ------------------------------------------------------------
   This is the "bones" (骨). Every room keeps the same skeleton:
   warm paper, hand-cut edges, a quiet forest light, Mincho-mixed
   serif, drifting motes, the same house artwork blurred far
   behind so the room belongs to the same world. Artwork is
   NEVER altered — we only re-skin with CSS.

   To make a new room, you change TWO things only:
     (A) the  :root  palette block right below  (color 着替え)
     (B) the  "ROOM CONTENT"  block down in <body>  (words 着替え)
   Everything else stays exactly the same across all rooms.

   Ready-to-paste palettes for all 5 characters are in the big
   comment block under :root — copy one over :root and you're done.
   ============================================================ */

/* ============================================================
   (A) EDIT HERE — THIS ROOM'S PALETTE  ←←← swap per room
   This live one is the neutral "house" tone (the template look).
   For a real room, paste one of the presets below over this.
   ============================================================ */
:root{ /* ALEX — moss & earth */
  --paper:#f1ecd8; --paper-deep:#e3dcc0;
  --ink:#2f3326; --ink-soft:#5f6b4c;
  --accent:#7a8c46; --accent-soft:#b6c87f;
  --veil-glow:rgba(240,236,180,0.18);
  --veil-color:rgba(96,120,52,0.30);
  --veil-dark:rgba(18,28,10,0.60);
  --base:#262e1c;
  --backdrop-pos:center 62%;
  --backdrop-filter:blur(26px) brightness(0.56) saturate(1.0) hue-rotate(8deg);
}

/* Palette presets for every room live in _room-template.html. */


/* ============================================================
   THE BONES (骨)  —  shared by every room. Don't edit per room.
   ============================================================ */

*{ box-sizing: border-box; }
html, body{ margin: 0; padding: 0; }

body{
  min-height: 100vh;
  background: var(--base);
  color: var(--paper);
  font-family: Georgia, "Times New Roman", "Hiragino Mincho ProN", "Yu Mincho", serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 44px 22px 60px;
  position: relative;
  overflow-x: hidden;
}

/* the same house artwork, far away and blurred: the world behind */
.world-backdrop{
  position: fixed;
  inset: -60px;
  z-index: -2;
  background-image: url("house.png");
  background-size: cover;
  background-position: var(--backdrop-pos);
  filter: var(--backdrop-filter);
  transform: scale(1.12);
  pointer-events: none;
}
/* a hush of forest light over it — tinted by this room's --veil-* */
.world-veil{
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(70% 50% at 50% 8%,   var(--veil-glow),  rgba(0,0,0,0) 60%),
    radial-gradient(120% 95% at 50% 42%,  var(--veil-color), rgba(0,0,0,0) 55%),
    radial-gradient(120% 90% at 50% 46%,  rgba(0,0,0,0) 40%, var(--veil-dark) 100%),
    linear-gradient(180deg, rgba(8,12,6,0.22), rgba(8,12,6,0.42));
}

/* ---------- the column of content ---------- */
.room-wrap{
  width: 100%;
  max-width: 560px;
  text-align: center;
  position: relative;
  z-index: 1;
}

.back{
  display: inline-block;
  margin: 0 0 30px;
  color: var(--paper);
  opacity: 0.72;
  text-decoration: none;
  font-size: 0.98rem;
  letter-spacing: 0.02em;
}
.back:hover, .back:focus-visible{ opacity: 1; text-decoration: underline; }

.title{
  margin: 0;
  font-size: clamp(2.1rem, 7vw, 3rem);
  font-weight: 700;
  letter-spacing: 0.06em;
  color: #fff6e6;
  text-shadow: 0 0 26px rgba(255,225,170,0.28), 0 2px 2px rgba(0,0,0,0.42);
}
.sub{
  margin: 12px 0 0;
  color: #efe6d2;
  opacity: 0.85;
  font-size: 1.04rem;
  font-style: italic;
  letter-spacing: 0.01em;
}

/* a small diamond mark under the title, in the room's accent —
   the same little "gem" language as the chest, re-colored per room */
.mark{
  width: 13px; height: 13px;
  margin: 22px auto 0;
  background: linear-gradient(135deg, var(--accent-soft), var(--accent) 55%, var(--ink));
  transform: rotate(45deg);
  border-radius: 2px;
  box-shadow: 0 1px 2px rgba(20,12,6,0.5),
              -2px -2px 2px rgba(255,255,255,0.30) inset;
}

/* the wooden plate: a hand-cut board the room's words sit on */
.plate{
  position: relative;
  max-width: 440px;
  margin: 34px auto 0;
  padding: 30px 32px 30px;
  color: var(--ink);
  background:
    radial-gradient(120% 80% at 30% 0%, rgba(255,255,255,0.42), rgba(0,0,0,0) 60%),
    linear-gradient(180deg, var(--paper), var(--paper-deep));
  border-radius: 6px 12px 7px 11px;   /* hand-cut, not a slick card */
  box-shadow:
     0 16px 36px rgba(8,12,6,0.46),
     0 2px 0 rgba(255,255,255,0.40) inset;
}
.plate p{
  margin: 0 0 0.9em;
  font-size: 1.16rem;
  line-height: 1.62;
}
.plate p:last-child{ margin-bottom: 0; }
.plate .whisper{                       /* a quieter aside, in accent */
  color: var(--ink-soft);
  font-style: italic;
  font-size: 1.02rem;
}

/* an optional frame for a hand-drawn portrait of the character.
   Leave it empty (a soft waiting frame) until Nakoron's matte PNG
   exists, then set  background-image  on  .portrait img  /  .portrait. */
.portrait{
  width: clamp(120px, 38vw, 168px);
  height: clamp(120px, 38vw, 168px);
  margin: 0 auto 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at 38% 34%, rgba(255,255,255,0.18), rgba(0,0,0,0) 60%),
    radial-gradient(circle at 50% 50%, var(--accent-soft), var(--accent) 70%, rgba(0,0,0,0.25));
  box-shadow: 0 10px 26px rgba(8,12,6,0.4),
              0 0 0 6px rgba(255,255,255,0.06),
              0 2px 0 rgba(255,255,255,0.25) inset;
  overflow: hidden;
}
.portrait img{ width: 100%; height: 100%; object-fit: contain; }
.portrait .waiting{                    /* shown only while empty */
  font-style: italic;
  font-size: 0.92rem;
  color: rgba(0,0,0,0.42);
  padding: 0 14px;
  text-align: center;
}

/* drifting motes of warm light — same world as the house */
.mote{
  position: fixed;
  bottom: -10px;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, rgba(255,238,184,0.95), rgba(255,176,80,0.15) 70%);
  box-shadow: 0 0 8px 2px rgba(255,206,128,0.35);
  pointer-events: none;
  z-index: 0;
  opacity: 0;
  animation: moteRise linear infinite;
}
@keyframes moteRise{
  0%   { opacity: 0;   transform: translateY(0)      translateX(0); }
  12%  { opacity: 0.8; }
  88%  { opacity: 0.7; }
  100% { opacity: 0;   transform: translateY(-104vh) translateX(var(--sway, 20px)); }
}

@media (prefers-reduced-motion: reduce){
  .mote{ display: none; }
}
</style>
</head>
<body>

<div class="world-backdrop"></div>
<div class="world-veil"></div>

<main class="room-wrap">
  <a class="back" href="index.html">&larr;&nbsp; Back to the house</a>

  <!-- ============================================================
       (B) ROOM CONTENT  ←←← swap per room
       Title = the character's name. Sub = one quiet half-line.
       The plate holds a few short lines in the room's voice —
       a small presence, never a full bio. "Answers not given."
       ============================================================ -->

  <!-- optional portrait: drop the matte PNG in when it exists.
       <div class="portrait"><img src="alex-portrait.png" alt="Alex"></div> -->
  <div class="portrait"><span class="waiting">a drawing will live here</span></div>

  <h1 class="title">Alex</h1>
  <p class="sub">the one who watches, and quietly wonders</p>
  <div class="mark"></div>

  <div class="plate">
    <p>Alex is still setting up his desk — the notebooks, the tablet, a few small bones he is keeping. The room is not quite ready.</p>
    <p class="whisper">Come back soon. He is almost done writing it all down.</p>
  </div>

  <!-- ============================================================
       END ROOM CONTENT
       ============================================================ -->
</main>

<script>
(function () {
  "use strict";
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  /* a handful of warm motes drifting up — same light as the house */
  const n = 12;
  for (let k = 0; k < n; k++) {
    const m = document.createElement("span");
    m.className = "mote";
    m.style.left = (Math.random() * 100) + "%";
    m.style.setProperty("--sway", (Math.random() * 60 - 30).toFixed(0) + "px");
    m.style.animationDuration = (9 + Math.random() * 8).toFixed(1) + "s";
    m.style.animationDelay = (Math.random() * 10).toFixed(1) + "s";
    m.style.width = m.style.height = (5 + Math.random() * 5).toFixed(0) + "px";
    document.body.appendChild(m);
  }
})();
</script>

</body>
</html>
