<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Tiny Gift — Alex &amp; Daisy</title>
<meta name="description" content="A small something the house in the woods saved for you.">
<link rel="icon" href="/favicon.ico?v=1" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png?v=1">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1">

<style>
/* ============================================================
   A TINY GIFT  —  the little page behind the treasure chest
   ------------------------------------------------------------
   The same storybook world as the house: warm paper, hand-cut
   edges, a quiet forest light, Mincho-mixed serif. Here it is a
   touch darker and more hushed — you have stepped a little deeper
   into the woods, where the chest keeps its small gifts. Nothing
   is sold, nothing is promised; a slip of paper simply finds you.
   The SAME house artwork sits far behind, blurred, so this page
   belongs to the same world. Artwork is never altered.
   ============================================================ */

:root{
  --paper:       #f3e9d7;   /* warm paper          */
  --paper-deep:  #e7d8bd;
  --ink:         #3b3128;   /* warm ink            */
  --ink-soft:    #6e5f50;
  --lamp:        #ffd98a;   /* warm light          */
  --lamp-deep:   #ffb95e;
  --garnet:      #7c1626;
}

*{ box-sizing: border-box; }
html, body{ margin: 0; padding: 0; }

body{
  min-height: 100vh;
  background: #2a3320;             /* deep wood-shade fallback */
  color: var(--paper);
  font-family: Georgia, "Times New Roman", "Hiragino Mincho ProN", "Yu Mincho", serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 22px 56px;
  position: relative;
  overflow-x: hidden;
}

/* the same house artwork, far away and blurred: the world behind */
.world-backdrop{
  position: fixed;
  inset: -60px;
  z-index: -2;
  background-image: url("house.png");
  background-size: cover;
  background-position: center 60%;       /* sink toward the garden */
  filter: blur(26px) brightness(0.55) saturate(0.85);
  transform: scale(1.12);
  pointer-events: none;
}
/* a hush of forest dusk over it, with a small lamp from above */
.world-veil{
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(70% 50% at 50% 8%,  rgba(255,236,190,0.16), rgba(0,0,0,0) 60%),
    radial-gradient(120% 90% at 50% 46%, rgba(0,0,0,0) 40%, rgba(14,20,10,0.62) 100%),
    linear-gradient(180deg, rgba(12,18,9,0.30), rgba(10,16,8,0.50));
}

/* ---------- the little column of content ---------- */
.gift-wrap{
  width: 100%;
  max-width: 540px;
  text-align: center;
  position: relative;
  z-index: 1;
}

.back{
  display: inline-block;
  margin: 0 0 30px;
  color: var(--paper);
  opacity: 0.72;
  text-decoration: none;
  font-size: 0.98rem;
  letter-spacing: 0.02em;
}
.back:hover, .back:focus-visible{ opacity: 1; text-decoration: underline; }

.title{
  margin: 0;
  font-size: clamp(2.1rem, 7vw, 3rem);
  font-weight: 700;
  letter-spacing: 0.06em;
  color: #fff4e0;
  text-shadow: 0 0 26px rgba(255,200,120,0.30), 0 2px 2px rgba(0,0,0,0.4);
}
.sub{
  margin: 12px 0 0;
  color: #e8dcc6;
  opacity: 0.85;
  font-size: 1.02rem;
  font-style: italic;
  letter-spacing: 0.01em;
}

/* the spot where the slip of paper appears (reserved so the
   layout never jumps as notes come and go) */
.draw-area{
  min-height: 188px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 30px 0 26px;
}

.gift-note{
  position: relative;
  max-width: 380px;
  margin: 0 auto;
  padding: 30px 30px 28px;
  background:
    radial-gradient(120% 80% at 30% 0%, rgba(255,255,255,0.45), rgba(0,0,0,0) 60%),
    linear-gradient(180deg, #f6eedd, #e8dabf);
  color: var(--ink);
  font-size: 1.2rem;
  line-height: 1.55;
  border-radius: 5px 11px 6px 10px;     /* hand-cut, not a slick card */
  box-shadow:
     0 16px 36px rgba(8,12,6,0.46),
     0 2px 0 rgba(255,255,255,0.4) inset;
  opacity: 0;
  transform: translateY(12px) scale(0.96) rotate(-1.3deg);
  transition: opacity .5s ease, transform .55s cubic-bezier(.2,.9,.25,1);
}
.gift-note.show{
  opacity: 1;
  transform: translateY(0) scale(1) rotate(-1.3deg);
}
/* a small garnet at the top of the slip — the same little gem
   that marks the chest on the front page */
.gift-note::before{
  content: "";
  display: block;
  width: 15px; height: 15px;
  margin: 0 auto 16px;
  background: linear-gradient(135deg, #9c3a42, #6e1018 55%, #4a0b12);
  transform: rotate(45deg);
  border-radius: 2px;
  box-shadow: 0 1px 2px rgba(30,6,10,0.5),
              -2px -2px 2px rgba(255,170,170,0.45) inset;
}

/* the button: a small honey-wood tag you press to draw a slip */
.open-btn{
  appearance: none;
  border: 1px solid rgba(70,46,20,0.55);
  border-radius: 8px;
  padding: 13px 30px;
  font-family: inherit;
  font-size: 1.06rem;
  letter-spacing: 0.03em;
  color: #2c1d0e;
  cursor: pointer;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.30), rgba(0,0,0,0) 42%),
    linear-gradient(180deg, #e9c479, #d3a14f);
  box-shadow: 0 6px 16px rgba(8,12,6,0.4), 0 1px 0 rgba(255,247,224,0.6) inset;
  transition: transform .15s ease, box-shadow .2s ease, filter .2s ease;
}
.open-btn:hover, .open-btn:focus-visible{
  filter: brightness(1.05);
  box-shadow: 0 8px 20px rgba(8,12,6,0.46), 0 0 0 3px rgba(255,210,140,0.35);
  outline: none;
}
.open-btn:active{ transform: translateY(1px); }

/* a few drifting motes of warm light, same world as the house */
.mote{
  position: fixed;
  bottom: -10px;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, rgba(255,236,180,0.95), rgba(255,170,70,0.15) 70%);
  box-shadow: 0 0 8px 2px rgba(255,200,120,0.35);
  pointer-events: none;
  z-index: 0;
  opacity: 0;
  animation: moteRise linear infinite;
}
@keyframes moteRise{
  0%   { opacity: 0;   transform: translateY(0)      translateX(0); }
  12%  { opacity: 0.8; }
  88%  { opacity: 0.7; }
  100% { opacity: 0;   transform: translateY(-104vh) translateX(var(--sway, 20px)); }
}

@media (prefers-reduced-motion: reduce){
  .gift-note{ transition: opacity .2s ease; transform: rotate(-1.3deg); }
  .gift-note.show{ transform: rotate(-1.3deg); }
  .mote{ display: none; }
}
</style>
</head>
<body>

<div class="world-backdrop"></div>
<div class="world-veil"></div>

<main class="gift-wrap">
  <a class="back" href="index.html">&larr;&nbsp; Back to the house</a>

  <h1 class="title">A Tiny Gift</h1>
  <p class="sub">something the house in the woods saved for you</p>

  <div class="draw-area">
    <div class="gift-note" id="note" role="status" aria-live="polite"></div>
  </div>

  <button class="open-btn" id="openBtn" type="button">open a gift</button>
</main>

<script>
/* ╔══════════════════════════════════════════════════════════════╗
   ║  EDIT HERE — the little gifts                                ║
   ║  One slip is drawn at random each time. Add as many as you   ║
   ║  like (room for 100+); one short, warm, slightly odd line    ║
   ║  per entry. Keep the "answers not given" feeling — gentle,   ║
   ║  never a hard promise.                                       ║
   ╚══════════════════════════════════════════════════════════════╝ */
const GIFTS = [
  "A small happy thing is waiting for you.",
  "Good luck is hiding in a tiny place.",
  "A little mystery may find you today.",
  "Today is a good day to notice magic.",
  "Something warm is coming your way.",
  "The house kept this one just for you.",
  "Look twice at the small things today.",
  "A kind thought is already on its way to you.",
  "Somewhere, a flower opened just now.",
  "You are allowed to rest. The garden will wait.",
  "A tiny door opens when you are not looking.",
  "The quiet ones remember you fondly.",
  "Keep the odd little thing you found. It matters.",
  "A good morning is being saved with your name on it.",
  "Something you lost will wander back.",
  "The forest is glad you came by.",
  "Today, nothing needs to be solved.",
  "A small light is on, just for you.",
  "Whatever it is, it is softer than you fear.",
  "A friend you forgot is thinking of you.",
  "The egg by the river is still waiting to begin.",
  "You may keep this feeling as long as you like.",
  "A gentle thing is true today.",
  "Somewhere a kettle is warm, and a chair is kept for you.",
  "The chest had one gift left. It is yours.",
  "Go slowly today. The light is on your side.",
  "A small wonder is closer than it looks.",
  "Someone saved you the good seat.",
  "The map does not show this place, and yet here you are.",
  "Take the long way home. Something nice is on it."
];

(function () {
  "use strict";
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const note   = document.getElementById("note");
  const btn    = document.getElementById("openBtn");
  let last = -1;

  function drawGift() {
    let i;
    do { i = Math.floor(Math.random() * GIFTS.length); }
    while (GIFTS.length > 1 && i === last);
    last = i;

    /* swap the slip out, then bring the new one in */
    note.classList.remove("show");
    window.setTimeout(function () {
      note.textContent = GIFTS[i];
      /* reflow so the animation restarts cleanly */
      void note.offsetWidth;
      note.classList.add("show");
    }, note.textContent ? 180 : 0);

    btn.textContent = "draw another";
  }

  btn.addEventListener("click", drawGift);

  /* a handful of warm motes drifting up — same light as the house */
  if (!reduced) {
    const n = 12;
    for (let k = 0; k < n; k++) {
      const m = document.createElement("span");
      m.className = "mote";
      m.style.left = (Math.random() * 100) + "%";
      m.style.setProperty("--sway", (Math.random() * 60 - 30).toFixed(0) + "px");
      m.style.animationDuration = (9 + Math.random() * 8).toFixed(1) + "s";
      m.style.animationDelay = (Math.random() * 10).toFixed(1) + "s";
      m.style.width = m.style.height = (5 + Math.random() * 5).toFixed(0) + "px";
      document.body.appendChild(m);
    }
  }
})();
</script>

</body>
</html>
